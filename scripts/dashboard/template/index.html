<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="craft-template-version" content="3">
<title>Craft Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; }

  #stage .hint {
    position: absolute;
    left: 20px;
    bottom: 18px;
    font-size: 11px;
    letter-spacing: 0.04em;
    pointer-events: none;
    z-index: 5;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: rgba(220, 224, 232, 0.62);
  }

  #stage #controls {
    position: absolute;
    top: 20px;
    right: 22px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    pointer-events: none;
  }
  #stage #controls .notice { display: none; color: rgba(220, 224, 232, 0.34); }
  #stage #controls .notice.visible { display: inline; }
  #stage #controls button {
    pointer-events: auto;
    font-family: inherit;
    font-size: inherit;
    color: rgba(226, 230, 238, 0.78);
    background: transparent;
    border: 1px solid rgba(210, 215, 225, 0.16);
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #stage #controls button:hover { color: rgba(220, 224, 232, 0.9); border-color: rgba(210, 215, 225, 0.3); }

  #stage #panel {
    position: absolute;
    top: 62px;
    right: 22px;
    width: 320px;
    max-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    background: rgba(16, 16, 19, 0.93);
    border: 1px solid rgba(210, 215, 225, 0.16);
    border-radius: 6px;
    padding: 16px 18px;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e8eaef;
    opacity: 0;
    transform: translateX(8px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
    z-index: 6;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #stage #panel.visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
  #stage #panel .p-type {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9fd8ff;
    margin-bottom: 6px;
    flex: none;
  }
  #stage #panel .p-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 10px;
    color: #fbfbfd;
    flex: none;
  }
  #stage #panel .p-meta {
    font-size: 12px;
    color: #a7acb8;
    margin-bottom: 12px;
    flex: none;
  }
  #stage #panel .p-summary {
    font-size: 12.5px;
    line-height: 1.5;
    color: #c6cad4;
    margin-bottom: 12px;
    flex: none;
    overflow-wrap: anywhere;
  }
  /* Section headers carry their own boundary: without the top rule and margin
     a chunk list and the Connections heading below it sit flush together. */
  #stage #panel .p-rel-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9298a6;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(210, 215, 225, 0.14);
    margin-bottom: 6px;
    flex: none;
  }
  #stage #panel .p-rels > .p-rel-label:first-child {
    margin-top: 4px;
    padding-top: 0;
    border-top: none;
  }
  #stage #panel .p-rels {
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
  }
  #stage #panel .p-rel-item {
    font-size: 12.5px;
    color: #c7cbd4;
    padding: 4px 0;
    border-top: 1px solid rgba(210, 215, 225, 0.08);
    overflow-wrap: anywhere;
  }
  #stage #panel .p-rel-item:first-of-type { border-top: none; }

  /* Back is a character in the type line, not a control on the card: bare
     chevron in that line's own colour and size, no fill, no border, no
     hit-box. iOS navigation-bar chevron / Linear's side panel. */
  #stage #panel .p-back {
    all: unset;
    cursor: pointer;
    font: inherit;
    color: inherit;
    font-size: 1.25em;
    line-height: 1;
    margin-right: 0.5em;
    vertical-align: -0.06em;
  }
  #stage #panel .p-back:hover { color: #ffffff; }
  /* `all: unset` above also unsets the user-agent focus ring, so the keyboard
     affordance has to be put back by hand - same outline the strip scroller
     uses. :focus-visible, not :focus, so a mouse click leaves no ring behind. */
  #stage #panel .p-back:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
    color: #ffffff;
  }

  /* The commit strip. A cell is ONE RECORD at a fixed size - a longer span
     widens the strip and scrolls; it never shrinks the cells below a
     clickable target. The scroller and its chrome exist only on overflow. */
  #stage #panel .p-strip-view { overflow: hidden; }
  #stage #panel .p-strip-view.is-scrollable {
    overflow-x: auto;
    overscroll-behavior-x: contain;
    padding-bottom: 7px;
    scrollbar-width: thin;
    scrollbar-color: rgba(210, 215, 225, 0.34) rgba(210, 215, 225, 0.10);
    -webkit-mask-image: linear-gradient(to right,
      transparent 0,
      #000 calc(18px * var(--fade-l, 0)),
      #000 calc(100% - 18px * var(--fade-r, 0)),
      transparent 100%);
  }
  /* The hairline that was already under the strip IS the scrollbar track, so
     overflow adds no new visual object to the card. */
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar { height: 3px; }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-track {
    background: rgba(210, 215, 225, 0.10);
    border-radius: 2px;
  }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-thumb {
    background: rgba(210, 215, 225, 0.34);
    border-radius: 2px;
  }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-thumb:hover {
    background: rgba(210, 215, 225, 0.55);
  }
  #stage #panel .p-strip-view.is-scrollable:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
  }
  #stage #panel .p-strip-grid {
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }
  #stage #panel .p-strip-col {
    display: flex;
    flex-direction: column-reverse;
    gap: 2px;
    width: 22px;
    flex: none;
  }
  #stage #panel .p-strip-cell {
    width: 22px;
    height: 9px;
    border-radius: 1.5px;
    cursor: pointer;
  }
  /* The strip is one tab stop with arrow keys inside it, so the ring has to
     read at 22x9 - same outline as the scroller and the back chevron. */
  #stage #panel .p-strip-cell:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
  }
  #stage #panel .p-strip-empty {
    width: 22px;
    height: 1px;
    background: rgba(210, 215, 225, 0.10);
  }
  #stage #panel .p-strip-ends {
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #83889a;
    margin-top: 6px;
  }
  #stage #panel .p-strip-span {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #7b808e;
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid rgba(210, 215, 225, 0.10);
  }
  #stage #panel .p-strip-legend {
    margin-top: 7px;
    font-size: 11px;
    color: #9aa0ad;
    line-height: 1.7;
  }
  #stage #panel .p-strip-legend span { margin-right: 11px; white-space: nowrap; }
  #stage #panel .p-strip-swatch {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 1.5px;
    margin-right: 5px;
  }
  #stage #panel .p-strip-hover {
    font-size: 11.5px;
    color: #aeb4c1;
    margin-top: 8px;
    height: 32px;
    line-height: 16px;
    overflow: hidden;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="controls">
    <span class="notice"></span>
    <button id="replay-btn">↺ Replay entrance</button>
    <button id="refresh-btn">⟳ Refresh</button>
  </div>
  <div id="panel">
    <div class="p-type"></div>
    <div class="p-title"></div>
    <div class="p-meta"></div>
    <div class="p-summary"></div>
    <div class="p-rels"></div>
  </div>
  <div class="hint">drag a node to pin · drag empty space to pan · scroll to zoom · click to lock</div>
</div>

<script src="graph/build-status.js"></script>
<script src="graph/graph.js"></script>
<script>
'use strict';

/* This page opens from file:// - every local file is its own opaque origin
   there, so the Fetch API and ES modules fail silently. Classic sibling
   <script src> tags are the only load path that works, hence the two
   tags above rather than any import. */
const TAU = Math.PI * 2;
const GRAPH = (window.CRAFT_GRAPH && window.CRAFT_GRAPH.nodes) ? window.CRAFT_GRAPH : { nodes: [], edges: [] };
// The status, dial-outcome and type words this page prints - additive on the
// graph envelope, read here instead of held as a second copy of the same rules
// inside the page. No relationship verbs: the card's Connections region is the
// commit strip now, so the builder stopped emitting words nothing reads.
const VOCAB = GRAPH.vocabulary || { statuses: {}, dial_outcomes: {}, types: {}, membership: [] };
const MEMBERSHIP_KINDS = new Set(VOCAB.membership);

// The page cannot read .craft/'s mtime, so elapsed time since the last build
// carries no information about whether the graph is current - only these
// three receipts do.
const EXPECTED_DATA_VERSION = 1;

function computeNotice(build, graph) {
  if (!graph || !graph.nodes || !graph.nodes.length) {
    return 'No graph data yet. Run any craft flow, then press Refresh.';
  }
  if (graph.version !== EXPECTED_DATA_VERSION) {
    return 'This page is older than your project data. Run /craft:dashboard to update it.';
  }
  if (build && build.status !== 'ok') {
    return "The last rebuild didn't finish. Refresh once it has run again.";
  }
  return null;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function truncateTitle(title, max) {
  const s = title || '(untitled)';
  return s.length > max ? s.slice(0, max - 1).trimEnd() + '…' : s;
}

function cloneNodes() {
  return GRAPH.nodes.map((n, i) => ({
    id: n.id,
    type: n.type,
    label: n.title || n.id,
    short: truncateTitle(n.title, 24),
    date: n.date,
    status: n.status,
    chunks: n.chunks,
    summary: n.summary,
    x: 0, y: 0, vx: 0, vy: 0,
    mass: 1,
    phase: i * 1.3197 + 0.4,
  }));
}

function buildEdges(nodes) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const out = [];
  let i = 0;
  for (const e of GRAPH.edges) {
    const s = byId.get(e.source), t = byId.get(e.target);
    if (!s || !t) continue; // defensive: skip any dangling reference
    out.push({ source: s, target: t, kind: e.kind, pulsePhase: (i * 0.3719) % 1 });
    i++;
  }
  return out;
}

function buildAdjacency(nodes, edges) {
  const adj = new Map(nodes.map(n => [n.id, []]));
  edges.forEach(e => {
    adj.get(e.source.id).push({ other: e.target, kind: e.kind, dir: 'out' });
    adj.get(e.target.id).push({ other: e.source, kind: e.kind, dir: 'in' });
  });
  return adj;
}

/* Cycles are cluster anchors placed evenly around a ring in a fixed
   reference box; every other node joins its cycle's cluster via the
   first membership-kind edge pointing at a cycle, phyllotaxis-scattered
   around that cluster's anchor with the spiral radius scaled by member
   count. Anything with no membership edge to a cycle has nowhere to
   belong and forms the outer dust ring. */
const GOLDEN_ANGLE = 2.399963229728653;
function computeRealLayout(nodes, edges) {
  const cycles = nodes.filter(n => n.type === 'cycle');
  const memberOf = new Map(); // nodeId -> cycleId, first membership edge wins
  for (const e of edges) {
    if (!MEMBERSHIP_KINDS.has(e.kind)) continue;
    if (e.target.type === 'cycle' && !memberOf.has(e.source.id)) memberOf.set(e.source.id, e.target.id);
  }
  const clusterMembers = new Map(cycles.map(c => [c.id, []]));
  for (const n of nodes) {
    if (n.type === 'cycle') continue;
    const cid = memberOf.get(n.id);
    if (cid && clusterMembers.has(cid)) clusterMembers.get(cid).push(n);
  }
  const orphans = nodes.filter(n => n.type !== 'cycle' && !memberOf.has(n.id));

  const ordered = [...cycles].sort((a, b) => (clusterMembers.get(b.id) || []).length - (clusterMembers.get(a.id) || []).length);
  const RING_R = 380;
  ordered.forEach((c, i) => {
    const angle = (i / ordered.length) * TAU;
    c.homeRefX = Math.cos(angle) * RING_R;
    c.homeRefY = Math.sin(angle) * RING_R;
  });
  ordered.forEach((c) => {
    const members = clusterMembers.get(c.id) || [];
    const spiralScale = 14 + Math.sqrt(members.length) * 9;
    members.forEach((m, j) => {
      const angle = j * GOLDEN_ANGLE;
      const rad = spiralScale * Math.sqrt(j + 0.5);
      m.homeRefX = c.homeRefX + Math.cos(angle) * rad;
      m.homeRefY = c.homeRefY + Math.sin(angle) * rad;
    });
  });
  const DUST_R0 = RING_R + 260;
  orphans.forEach((n, i) => {
    const angle = i * GOLDEN_ANGLE;
    const rad = DUST_R0 + Math.sqrt(i) * 18;
    n.homeRefX = Math.cos(angle) * rad;
    n.homeRefY = Math.sin(angle) * rad;
  });
}

// computeRealLayout lays the constellation out in a unitless reference box;
// computeHomes measures that box and scales it per-axis so the settled
// graph fills FIT_W_FRAC x FIT_H_FRAC of the actual viewport, any size.
const FIT_W_FRAC = 0.80;
const FIT_H_FRAC = 0.74;
function computeHomes(nodes, w, h) {
  if (nodes.length === 0) return; // no data yet - nothing to fit, nothing to poison with NaN
  const xs = nodes.map(n => n.homeRefX), ys = nodes.map(n => n.homeRefY);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const cx0 = (minX + maxX) / 2, cy0 = (minY + maxY) / 2;
  const scaleX = (w * FIT_W_FRAC) / (maxX - minX || 1);
  const scaleY = (h * FIT_H_FRAC) / (maxY - minY || 1);
  for (const n of nodes) {
    n.homeX = w / 2 + (n.homeRefX - cx0) * scaleX;
    n.homeY = h / 2 + (n.homeRefY - cy0) * scaleY;
  }
}

class Sim {
  constructor(opts) {
    this.nodes = cloneNodes();
    this.edges = buildEdges(this.nodes);
    computeRealLayout(this.nodes, this.edges);
    this.idx = new Map(this.nodes.map((n, i) => [n.id, i]));
    this.adj = buildAdjacency(this.nodes, this.edges);
    this.opts = opts;
    this.alpha = 0;
    this.alphaTarget = 0;
    this.alphaDecay = opts.alphaDecay != null ? opts.alphaDecay : 0.06;
  }
  resizeHome(w, h) { computeHomes(this.nodes, w, h); }
  hasFixed() { for (const n of this.nodes) if (n.fx != null) return true; return false; }
  isAtRest() {
    let maxSp2 = 0;
    for (const nd of this.nodes) { const s2 = nd.vx * nd.vx + nd.vy * nd.vy; if (s2 > maxSp2) maxSp2 = s2; }
    return this.alpha < 0.0006 && maxSp2 < 0.002 && !this.hasFixed();
  }
  step(dt) {
    const alphaRetain = Math.pow(1 - this.alphaDecay, dt * 60);
    this.alpha = this.alphaTarget + (this.alpha - this.alphaTarget) * alphaRetain;
    const nodes = this.nodes, n = nodes.length;
    // True-stillness fast path: once settled, skip the O(n^2) force pass
    // entirely rather than compute forces that round to nothing.
    if (this.isAtRest()) return;

    const { repulse, springK, springLength, gravity, maxSpeed, damping } = this.opts;
    const fx = new Float64Array(n), fy = new Float64Array(n);
    const forceScale = this.alpha;

    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        let d = Math.sqrt(dx * dx + dy * dy); if (d < 0.001) d = 0.001;
        const ux = dx / d, uy = dy / d;
        const dd = Math.max(d, 4);
        const f = (repulse / (dd * dd)) * forceScale;
        fx[i] += ux * f; fy[i] += uy * f;
        fx[j] -= ux * f; fy[j] -= uy * f;
      }
    }
    for (const e of this.edges) {
      const ai = this.idx.get(e.source.id), bi = this.idx.get(e.target.id);
      const a = nodes[ai], b = nodes[bi];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.sqrt(dx * dx + dy * dy); if (d < 0.001) d = 0.001;
      const f = springK * (d - springLength) * forceScale;
      const ux = dx / d, uy = dy / d;
      fx[ai] += ux * f; fy[ai] += uy * f;
      fx[bi] -= ux * f; fy[bi] -= uy * f;
    }
    for (let i = 0; i < n; i++) {
      const node = nodes[i];
      fx[i] += (node.homeX - node.x) * gravity * forceScale;
      fy[i] += (node.homeY - node.y) * gravity * forceScale;
    }
    const dampingStep = Math.pow(damping, dt * 60);
    for (let i = 0; i < n; i++) {
      const node = nodes[i];
      if (node.fx != null) { node.x = node.fx; node.y = node.fy; node.vx = 0; node.vy = 0; continue; }
      node.vx = (node.vx + (fx[i] / node.mass) * dt) * dampingStep;
      node.vy = (node.vy + (fy[i] / node.mass) * dt) * dampingStep;
      const sp = Math.hypot(node.vx, node.vy);
      if (sp > maxSpeed) { const s = maxSpeed / sp; node.vx *= s; node.vy *= s; }
      node.x += node.vx * dt;
      node.y += node.vy * dt;
    }
  }
}

function seedCompactCloud(nodes, cx, cy, scale) {
  nodes.forEach((n, i) => {
    const hx = n.homeX != null ? n.homeX : cx, hy = n.homeY != null ? n.homeY : cy;
    const jitter = (i % 2 === 0 ? 1 : -1) * (3 + (i * 7) % 9);
    n.x = cx + (hx - cx) * scale + jitter;
    n.y = cy + (hy - cy) * scale - jitter * 0.6;
    n.vx = 0; n.vy = 0;
  });
}

function makeCanvasCtx(canvas) {
  const ctx = canvas.getContext('2d');
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  return { ctx, resize };
}

function hitTestNode(nodes, wx, wy) {
  let best = null, bestScore = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d <= n.hw + 6 && d < bestScore) { best = n; bestScore = d; }
  }
  return best;
}

class Camera {
  constructor() { this.scale = 1; this.x = 0; this.y = 0; }
  toWorld(sx, sy, w, h) { return { x: (sx - w / 2) / this.scale + this.x, y: (sy - h / 2) / this.scale + this.y }; }
  zoomAt(sx, sy, w, h, factor) {
    const before = this.toWorld(sx, sy, w, h);
    this.scale = clamp(this.scale * factor, 0.2, 6);
    const after = this.toWorld(sx, sy, w, h);
    this.x += before.x - after.x;
    this.y += before.y - after.y;
  }
}

function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
}
const TYPE_HSL = {
  cycle: [40, 60, 58],      // amber-gold - the container
  story: [16, 72, 60],      // ember-coral - craft's own accent
  fix: [352, 66, 58],       // rose-red - alert/resolved
  tweak: [178, 46, 54],     // teal-cyan - minor/quiet
  planning: [210, 50, 58],  // blue - not built yet
  notebook: [258, 40, 56],  // violet - quiet dust-ring texture
  riff: [325, 58, 64],      // magenta - rare, allowed to stand out
  dial: [302, 42, 63],      // orchid
  mockup: [135, 45, 56],    // tree green
};
const TYPE_RGB = {};
for (const k in TYPE_HSL) TYPE_RGB[k] = hsl2rgb(TYPE_HSL[k][0], TYPE_HSL[k][1], TYPE_HSL[k][2]);
const GROUND = '#121214';
const rgbCss = (rgb, a) => 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + (a === undefined ? 1 : a) + ')';
// Status dims a record without changing its hue, so the strip reads type by
// colour and progress by weight, the same pair the graph already uses.
const STATUS_ALPHA = { complete: 1, shipped: 1, active: 0.85, ready: 0.6, open: 0.6, planning: 0.4 };
const fillFor = n => rgbCss(TYPE_RGB[n.type] || FALLBACK_RGB, STATUS_ALPHA[n.status] === undefined ? 0.75 : STATUS_ALPHA[n.status]);
// Legend wording rides the same vocabulary table the cards already print.
const typeCountWord = (t, count) => {
  const word = String(VOCAB.types[t] || t).toLowerCase();
  if (count === 1) return word;
  if (/[^aeiou]y$/.test(word)) return word.slice(0, -1) + 'ies';   // -y becomes -ies
  return /(?:[sxz]|ch|sh)$/.test(word) ? word + 'es' : word + 's'; // sibilants take -es
};
// Neutral hue for a record type this page has never seen, so a future
// type degrades gracefully instead of throwing on the first draw frame.
const FALLBACK_TYPE = '__unknown__';
const FALLBACK_RGB = hsl2rgb(0, 0, 55);

const SIZE_BUCKETS = [
  { key: 'dust', maxR: 11, bakeR: 12 },
  { key: 'small', maxR: 19, bakeR: 20 },
  { key: 'medium', maxR: 29, bakeR: 30 },
  { key: 'hub', maxR: Infinity, bakeR: 42 },
];
function bucketFor(r) {
  for (const b of SIZE_BUCKETS) if (r <= b.maxR) return b.key;
  return 'hub';
}

function bakeRadialGlow(rgb, size) {
  size = size || 96;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const g = c.getContext('2d');
  const cs = `${rgb[0]},${rgb[1]},${rgb[2]}`;
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, `rgba(${cs},0.8)`);
  grad.addColorStop(0.45, `rgba(${cs},0.26)`);
  grad.addColorStop(1, `rgba(${cs},0)`);
  g.fillStyle = grad; g.beginPath(); g.arc(size / 2, size / 2, size / 2, 0, TAU); g.fill();
  return c;
}

// A quieter, always-on sibling to bakeRadialGlow above (that one stays a
// hover-only interaction cue). This sprite paints permanently under a
// handful of rare or high-degree nodes so the sky itself reads as alive
// at rest, not only when a visitor points at something. Same additive
// no-blur baking approach, its own gradient curve.
function bakeAmbientGlow(rgb, size) {
  size = size || 96;
  const c = document.createElement('canvas'); c.width = size; c.height = size;
  const g = c.getContext('2d');
  const cs = `${rgb[0]},${rgb[1]},${rgb[2]}`;
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, `rgba(${cs},1)`);
  grad.addColorStop(0.45, `rgba(${cs},0.32)`);
  grad.addColorStop(1, `rgba(${cs},0)`);
  g.fillStyle = grad; g.beginPath(); g.arc(size / 2, size / 2, size / 2, 0, TAU); g.fill();
  return c;
}

// Flat circle baked at an explicit radius (bakeR) so rim width can be
// proportioned to that size bucket rather than one universal stretch ratio.
// No canvas blur-shadow property anywhere in this bakery or the per-frame
// draw path - sprites are baked once per (hue x size bucket) and reused
// every frame instead.
function bakeFlatCircle(rgb, bakeR, rimAlpha, rimBoost) {
  const pad = 6;
  const SZ = bakeR * 2 + pad * 2;
  const c = document.createElement('canvas'); c.width = SZ; c.height = SZ;
  const g = c.getContext('2d');
  g.beginPath(); g.arc(SZ / 2, SZ / 2, bakeR, 0, TAU);
  g.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},1)`; g.fill();
  g.lineWidth = clamp(bakeR * 0.09, 1.3, 3);
  const rb = rimBoost || 40;
  g.strokeStyle = `rgba(${Math.min(255, rgb[0] + rb)},${Math.min(255, rgb[1] + rb)},${Math.min(255, rgb[2] + rb)},${rimAlpha})`;
  g.stroke();
  return c;
}

function bakeBackground(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w); c.height = Math.max(1, h);
  const bctx = c.getContext('2d');
  bctx.fillStyle = GROUND;
  bctx.fillRect(0, 0, w, h);
  const vg = bctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.22, w / 2, h / 2, Math.max(w, h) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  bctx.fillStyle = vg; bctx.fillRect(0, 0, w, h);
  return c;
}
function entranceGlobalAlpha(entranceStart) {
  if (!entranceStart) return 0;
  return clamp((performance.now() - entranceStart) / 1000 / 0.38, 0, 1);
}
function drawLabelHalo(ctx, text, x, y, fillStyle) {
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(8,8,10,0.85)';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fillStyle;
  ctx.fillText(text, x, y);
}

const DEG_CAP = 40;
const MIN_R = 6, MAX_R = 40;

// Ambient node-treatment ratios - everything scales off each node's own
// radius or the current viewport width, never a fixed pixel count, so the
// look holds at any window size.
const GLOW_ACCENT_TO_R = 4.2;      // rare/hero nodes: reach 4.2x their own radius
const GLOW_HUB_QUIET_TO_R = 1.5;   // large cycle hubs: a quieter 1.5x halo
const GLOW_ACCENT_HERO_ALPHA = 0.7;
const GLOW_ACCENT_RARE_ALPHA = 0.55;
const GLOW_HUB_QUIET_ALPHA = 0.15;
const DEPTH_ALPHA_FLOOR = 0.45;    // fill alpha never drops below this far from the core
const DEPTH_REACH_TO_W = 0.94;     // world-units of viewport width the falloff spans
const MESH_REACH_TO_W = 0.094;     // hairline links quiet down to a floor past this reach
const MESH_ALPHA_FLOOR = 0.08;
const MESH_ALPHA_NEAR = 0.19;
// A trackpad zoom stream fires many wheel events per second; a shorter
// window would stutter the loop stopping and restarting between them.
const CALM_MS = 900;
// window.NS and window.LT are page globals on purpose - the browser skill's
// evaluate_script reaches them directly to try alternate values live.
window.NS = window.NS || { cycleScale: 0.65 };
window.LT = window.LT || { degreeAlwaysOn: Infinity, hubZoom: 2.2, dustZoom: 4.6, ramp: 0.8 };

// Progressive label reveal: labelAlpha = f(camera.scale, nodeRadius). Bigger
// radius means a lower reveal threshold (arrives first); alpha ramps
// linearly over LABEL_RAMP zoom-units around that threshold, never a hard
// pop. Labels render at a constant screen size regardless of zoom.
const LABEL_HUB_ZOOM = 0.6;   // large nodes: basically always revealed
const LABEL_DUST_ZOOM = 3.4;  // smallest nodes: require real zoom-in
const LABEL_RAMP = 0.9;       // zoom-units over which alpha fades 0->1

class GraphView {
  constructor(canvas, panel) {
    this.canvas = canvas;
    this.panel = panel;
    const { ctx, resize: resizeCanvas } = makeCanvasCtx(canvas);
    this.ctx = ctx;
    this._resizeCanvas = resizeCanvas;
    this.camera = new Camera();
    this.mouse = { x: -9999, y: -9999 };
    this.hoverNode = null;
    this.selectedNode = null;
    this.dragNode = null;
    this.dragCandidate = null;
    this.dragging = false;
    this.downScreen = null;
    this.panning = false;
    this.panStartScreen = null;
    this.panStartCam = null;
    this._labelWidthCache = new Map();
    // Both anchor on the first PAINTED frame (set inside tick), not here -
    // on a cold load the gap between this line and first paint can be large
    // enough to burn the entrance, or a whole clamped simulation step, dark.
    this.lastT = 0;
    this.entranceStart = 0;
    this.simT = 0;
    this.frameCount = 0;
    this.interactionActive = false;
    this.lastInputAt = 0;
    this.rafId = null;

    this.sim = new Sim({ repulse: 60000, springK: 2.5, springLength: 110, damping: 0.90, gravity: 18, maxSpeed: 6000, alphaDecay: 0.06 });
    this.sim.nodes.forEach(n => this.shapeNode(n));
    // The single largest cluster anchor earns the brightest always-on glow -
    // a sky needs one point the eye lands on first.
    this.heroHub = null;
    for (const n of this.sim.nodes) {
      if (n.type === 'cycle' && (!this.heroHub || n.hw > this.heroHub.hw)) this.heroHub = n;
    }
    this.bakeAssets();
    this.attachInteraction();
    this.tick = this.tick.bind(this);
    this.resize();
    this.replay();
  }

  shapeNode(n) {
    n.shape = 'circle';
    const degree = this.sim.adj.get(n.id).length;
    n.degree = degree;
    const t = Math.sqrt(Math.min(degree, DEG_CAP) / DEG_CAP);
    n.hw = n.hh = (MIN_R + (MAX_R - MIN_R) * t) * (n.type === 'cycle' ? window.NS.cycleScale : 1);
    n.mass = 0.5 + t * 2.2;
    n.bucket = bucketFor(n.hw);
  }

  bakeAssets() {
    this.fill = {};
    this.hoverGlow = {};
    this.ambientGlow = {};
    const bake = (key, rgb) => {
      this.fill[key] = {};
      for (const b of SIZE_BUCKETS) this.fill[key][b.key] = bakeFlatCircle(rgb, b.bakeR, 0.85, 55);
      this.hoverGlow[key] = bakeRadialGlow(rgb, 100);
      this.ambientGlow[key] = bakeAmbientGlow(rgb, 100);
    };
    for (const t in TYPE_RGB) bake(t, TYPE_RGB[t]);
    bake(FALLBACK_TYPE, FALLBACK_RGB);
  }

  // A record type this page has no hue for still resolves - to the baked
  // fallback sprite set - rather than throwing on the first draw frame.
  spriteFor(type, bucket) { return (this.fill[type] || this.fill[FALLBACK_TYPE])[bucket]; }
  ambientGlowFor(type) { return this.ambientGlow[type] || this.ambientGlow[FALLBACK_TYPE]; }
  glowFor(type) { return this.hoverGlow[type] || this.hoverGlow[FALLBACK_TYPE]; }

  // ---- the commit strip -------------------------------------------------
  // One cell = one record, at a FIXED size. A longer span makes the strip
  // wider (and scrollable); it never shrinks a cell below a clickable target.
  // The bucket unit is a calendar decision taken from the date strings before
  // anything is laid out - layout adapts to it and never overrules it.
  buildStrip(rels) {
    const CELL_W = 22, CELL_H = 9, GAP = 2;
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
    const host = el('div');

    const items = rels.map(r => r.other).filter(n => n.date).sort((a, b) => a.date.localeCompare(b.date));
    const undated = rels.length - items.length;
    if (!items.length) {
      const none = el('div', 'p-rel-item');
      none.textContent = rels.length + ' connection' + (rels.length === 1 ? '' : 's') + ', no dates recorded';
      host.appendChild(none);
      return host;
    }

    // Read the calendar straight off 'YYYY-MM-DD'. No average day-lengths:
    // an approximated month drifts off real month boundaries.
    const ymd = t => ({ y: +t.slice(0, 4), m: +t.slice(5, 7), d: +t.slice(8, 10) });
    const a = ymd(items[0].date), b = ymd(items[items.length - 1].date);
    const spanDays = Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000) + 1;
    const spanMonths = (b.y - a.y) * 12 + (b.m - a.m);
    const unit = spanDays <= 21 ? 'day' : spanMonths < 4 ? 'week' : spanMonths < 36 ? 'month' : 'year';

    const iso = dt => dt.toISOString().slice(0, 10);
    const monday = t => { const p = ymd(t); const dt = new Date(Date.UTC(p.y, p.m - 1, p.d)); dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7)); return iso(dt); };
    const keyOf = { day: t => t, week: monday, month: t => t.slice(0, 7), year: t => t.slice(0, 4) }[unit];
    const nextKey = {
      day:   k => { const p = ymd(k); return iso(new Date(Date.UTC(p.y, p.m - 1, p.d + 1))); },
      week:  k => { const p = ymd(k); return iso(new Date(Date.UTC(p.y, p.m - 1, p.d + 7))); },
      month: k => { const y = +k.slice(0, 4), m = +k.slice(5, 7); return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0'); },
      year:  k => String(+k + 1)
    }[unit];

    // Walk the calendar end to end so an idle week or month is a visible gap.
    const firstKey = keyOf(items[0].date), lastKey = keyOf(items[items.length - 1].date);
    const keys = [firstKey];
    for (let k = firstKey; k !== lastKey && keys.length < 4000; ) { k = nextKey(k); keys.push(k); }
    const slot = new Map(keys.map((k, i) => [k, i]));
    const cols = keys.map(() => []);
    items.forEach(n => { const i = slot.get(keyOf(n.date)); cols[i === undefined ? 0 : i].push(n); });

    const nCols = keys.length;
    const gridW = nCols * CELL_W + (nCols - 1) * GAP;
    const tallest = Math.max.apply(null, cols.map(c => c.length).concat([1]));

    const view = el('div', 'p-strip-view');
    const inner = el('div');
    inner.style.width = gridW + 'px';
    const grid = el('div', 'p-strip-grid');
    grid.style.height = (tallest * (CELL_H + GAP)) + 'px';

    const hover = el('div', 'p-strip-hover');
    // Cells are addressable by (column, row) so the key handler can walk the
    // grid. Row 0 is the bottom of a column - .p-strip-col is column-reverse.
    const colCells = [];
    cols.forEach((bucket, ci) => {
      const colEl = el('div', 'p-strip-col');
      const cells = [];
      bucket.forEach(n => {
        const cell = el('div', 'p-strip-cell');
        cell.style.background = fillFor(n);
        cell.title = n.label;
        // A div with a click handler is a pointer affordance and nothing else -
        // the browser synthesizes no keyboard activation for a roleless
        // element. Role plus a tab stop plus Enter/Space is the whole gap.
        cell.setAttribute('role', 'button');
        cell.setAttribute('aria-label', n.label);
        cell.tabIndex = -1;
        cell._node = n;
        cell._col = ci;
        cell._row = cells.length;
        cell.addEventListener('mouseenter', () => { hover.textContent = n.label; });
        cell.addEventListener('mouseleave', () => { hover.textContent = ''; });
        cell.addEventListener('focus', () => { hover.textContent = n.label; });
        cell.addEventListener('blur', () => { hover.textContent = ''; });
        cell.addEventListener('click', ev => { ev.stopPropagation(); this.goTo(n); });
        cells.push(cell);
        colEl.appendChild(cell);
      });
      colCells.push(cells);
      if (!bucket.length) colEl.appendChild(el('div', 'p-strip-empty'));
      grid.appendChild(colEl);
    });
    inner.appendChild(grid);

    // The endpoint dates ride inside the scroller with the bars, so the axis
    // never describes a window you are not looking at.
    const fmt = t => new Date(t + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const ends = el('div', 'p-strip-ends');
    ends.style.width = gridW + 'px';
    const from = el('span'); from.textContent = fmt(items[0].date); ends.appendChild(from);
    if (nCols > 1) { const to = el('span'); to.textContent = fmt(items[items.length - 1].date); ends.appendChild(to); }
    inner.appendChild(ends);
    view.appendChild(inner);
    host.appendChild(view);

    // Roving tabindex: the strip is ONE tab stop and the arrows walk it. A tab
    // stop per cell would put a thousand-record project's whole history in the
    // tab order, which is why this is not just tabIndex = 0 on every cell.
    const occupied = colCells.filter(c => c.length);
    if (occupied.length) {
      const firstCell = occupied[0][0];
      const lastCol = occupied[occupied.length - 1];
      const lastCell = lastCol[lastCol.length - 1];
      firstCell.tabIndex = 0;
      grid.setAttribute('role', 'group');
      grid.setAttribute('aria-label', 'Connected records, ' + items.length + ' dated, oldest first');

      // Nudge the scroller rather than scrollIntoView, which would also scroll
      // every ancestor. Paired with focus({preventScroll}) so the page is still.
      const keepInView = cell => {
        if (!view.classList.contains('is-scrollable')) return;
        const vr = view.getBoundingClientRect(), cr = cell.getBoundingClientRect();
        if (cr.left < vr.left) view.scrollLeft -= (vr.left - cr.left);
        else if (cr.right > vr.right) view.scrollLeft += (cr.right - vr.right);
      };
      const move = (from, to) => {
        if (!to || to === from) return;
        from.tabIndex = -1;
        to.tabIndex = 0;
        to.focus({ preventScroll: true });
        keepInView(to);
      };
      // Step to the nearest column that actually holds records, then clamp the
      // row - an idle week is a visible gap, and focus should skip over it.
      const stepCol = (ci, dir, row) => {
        for (let i = ci + dir; i >= 0 && i < colCells.length; i += dir) {
          if (colCells[i].length) return colCells[i][Math.min(row, colCells[i].length - 1)];
        }
        return null;
      };

      grid.addEventListener('keydown', ev => {
        const cell = ev.target;
        if (!cell || !cell.classList || !cell.classList.contains('p-strip-cell')) return;
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          ev.stopPropagation();
          this.goTo(cell._node);
          return;
        }
        const col = colCells[cell._col];
        let to = null;
        if (ev.key === 'ArrowUp') to = col[cell._row + 1];
        else if (ev.key === 'ArrowDown') to = col[cell._row - 1];
        else if (ev.key === 'ArrowRight') to = stepCol(cell._col, 1, cell._row);
        else if (ev.key === 'ArrowLeft') to = stepCol(cell._col, -1, cell._row);
        else if (ev.key === 'Home') to = firstCell;
        else if (ev.key === 'End') to = lastCell;
        else return;
        ev.preventDefault();
        ev.stopPropagation();
        move(cell, to);
      });
    }

    // Overflow chrome exists only when the strip actually overflows.
    const rail = this.panel.querySelector('.p-rels');
    if (gridW > (rail ? rail.clientWidth : gridW)) {
      view.classList.add('is-scrollable');
      view.tabIndex = 0;
      view.setAttribute('role', 'region');
      view.setAttribute('aria-label', 'Timeline, ' + nCols + ' ' + unit + (nCols === 1 ? '' : 's') + ', scrollable');
      const fades = () => {
        const max = view.scrollWidth - view.clientWidth;
        view.style.setProperty('--fade-l', view.scrollLeft > 1 ? '1' : '0');
        view.style.setProperty('--fade-r', view.scrollLeft < max - 1 ? '1' : '0');
      };
      view.addEventListener('scroll', fades, { passive: true });
      // Opened on the most recent end by fillPanel, once the strip is in the
      // document and has a measurable scrollWidth. Deliberately not deferred
      // to a frame: the render loop owns the only two rAF call sites.
      view.dataset.openAtEnd = '1';
      this._stripFades = fades;
    }

    // The span and the legend describe the whole record, not the visible
    // window, so they stay outside the scroller. The span is worded from the
    // columns actually drawn - there is no second unit ladder to drift.
    const span = el('div', 'p-strip-span');
    span.textContent = nCols + ' ' + unit + (nCols === 1 ? '' : 's') + (undated ? ' · ' + undated + ' undated' : '');
    host.appendChild(span);

    const counts = {};
    rels.forEach(r => { counts[r.other.type] = (counts[r.other.type] || 0) + 1; });
    const legend = el('div', 'p-strip-legend');
    Object.keys(counts).sort((x, y) => counts[y] - counts[x]).forEach(t => {
      const w = el('span');
      const sw = el('span', 'p-strip-swatch');
      sw.style.background = rgbCss(TYPE_RGB[t] || FALLBACK_RGB);
      w.appendChild(sw);
      w.appendChild(document.createTextNode(counts[t] + ' ' + typeCountWord(t, counts[t])));
      legend.appendChild(w);
    });
    host.appendChild(legend);
    host.appendChild(hover);
    return host;
  }

  fillPanel(n) {
    const fmtDate = d => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
    const bits = [VOCAB.types[n.type] || n.type];
    // A dial's status slot holds a session outcome rather than a status -
    // its own vocabulary axis, worded from a different table.
    const statusWords = n.type === 'dial' ? VOCAB.dial_outcomes : VOCAB.statuses;
    if (n.status) bits.push(statusWords[n.status] || n.status);
    if (n.date) bits.push(fmtDate(n.date));
    const typeEl = this.panel.querySelector('.p-type');
    typeEl.textContent = bits.join(' · ');
    // Back is a prefix character on the line that already says where you are,
    // shown only when there is a card behind this one. No container, no label.
    if (this.trail && this.trail.length) {
      const back = document.createElement('button');
      back.className = 'p-back';
      back.textContent = '\u2039';
      back.setAttribute('aria-label', 'Back');
      back.addEventListener('click', ev => { ev.stopPropagation(); this.goBack(); });
      typeEl.insertBefore(back, typeEl.firstChild);
    }
    this.panel.querySelector('.p-title').textContent = n.label;
    this.panel.querySelector('.p-meta').textContent = n.degree + ' connection' + (n.degree === 1 ? '' : 's');
    const summaryEl = this.panel.querySelector('.p-summary');
    summaryEl.textContent = n.summary || '';
    summaryEl.style.display = n.summary ? '' : 'none';
    const relsEl = this.panel.querySelector('.p-rels');
    relsEl.innerHTML = '';
    if (n.chunks && n.chunks.list && n.chunks.list.length) {
      const h = document.createElement('div'); h.className = 'p-rel-label';
      h.textContent = 'The work (' + n.chunks.complete + '/' + n.chunks.total + ' done)';
      relsEl.appendChild(h);
      n.chunks.list.forEach(c => { const div = document.createElement('div'); div.className = 'p-rel-item'; div.textContent = c.number + '. ' + c.title; relsEl.appendChild(div); });
    }
    const rels = this.sim.adj.get(n.id);
    if (rels.length) {
      const label = document.createElement('div'); label.className = 'p-rel-label'; label.textContent = 'Connections'; relsEl.appendChild(label);
      relsEl.appendChild(this.buildStrip(rels));
      const view = relsEl.querySelector('.p-strip-view[data-open-at-end]');
      if (view) { view.scrollLeft = view.scrollWidth; if (this._stripFades) this._stripFades(); }
    }
  }

  resize() {
    this._resizeCanvas();
    this.sim.resizeHome(window.innerWidth, window.innerHeight);
    this.camera.x = window.innerWidth / 2;
    this.camera.y = window.innerHeight / 2;
    this.bg = bakeBackground(window.innerWidth, window.innerHeight);
    this.requestRender();
  }

  // Travel between records from inside the card. Pushing happens only on an
  // in-card click; a canvas click clears the trail (see the mouseup handler).
  goTo(node) {
    if (this.selectedNode) (this.trail = this.trail || []).push(this.selectedNode);
    this.selectedNode = node;
    this.fillPanel(node);
    this.requestRender();
  }

  goBack() {
    const prev = (this.trail || []).pop();
    if (!prev) return;
    this.selectedNode = prev;
    this.fillPanel(prev);
    this.requestRender();
  }

  replay() {
    const w = window.innerWidth, h = window.innerHeight;
    this.sim.resizeHome(w, h);
    seedCompactCloud(this.sim.nodes, w / 2, h / 2, 0.13);
    this.sim.alpha = 1;
    this.sim.alphaTarget = 0;
    this.selectedNode = null;
    this.hoverNode = null;
    this.dragNode = null;
    this.dragCandidate = null;
    if (this.panel) this.panel.classList.remove('visible');
    this.entranceStart = 0;
    this.requestRender();
  }

  attachInteraction() {
    const canvas = this.canvas;
    canvas.addEventListener('mousedown', (ev) => {
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      const wp = this.camera.toWorld(ev.clientX, ev.clientY, w, h);
      this.dragCandidate = hitTestNode(this.sim.nodes, wp.x, wp.y);
      this.downScreen = { x: ev.clientX, y: ev.clientY };
      this.dragging = false;
      this.panning = false;
      if (!this.dragCandidate) {
        this.panStartScreen = { x: ev.clientX, y: ev.clientY };
        this.panStartCam = { x: this.camera.x, y: this.camera.y };
      }
    });
    canvas.addEventListener('mousemove', (ev) => {
      // Unconditional: with a stopped loop, hover state can change on any
      // move, and detecting "did it actually change" costs more than a
      // spare frame request does.
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      this.mouse.x = ev.clientX; this.mouse.y = ev.clientY;
      const wp = this.camera.toWorld(ev.clientX, ev.clientY, w, h);
      if (this.dragCandidate) {
        if (!this.dragging) {
          const dx = ev.clientX - this.downScreen.x, dy = ev.clientY - this.downScreen.y;
          if (Math.hypot(dx, dy) > 4) {
            this.dragging = true;
            this.dragNode = this.dragCandidate;
            this.dragNode.fx = this.dragNode.x; this.dragNode.fy = this.dragNode.y;
            this.sim.alphaTarget = 0.3;
            this.sim.alpha = Math.max(this.sim.alpha, 0.4);
          }
        }
        if (this.dragging && this.dragNode) { this.dragNode.fx = wp.x; this.dragNode.fy = wp.y; }
      } else if (this.panStartScreen) {
        // Background drag-to-pan - 1:1 with the cursor, no inertia, sharing
        // the same camera.x/y the wheel-zoom reads/writes so the two compose.
        const dx = ev.clientX - this.panStartScreen.x, dy = ev.clientY - this.panStartScreen.y;
        if (!this.panning && Math.hypot(dx, dy) > 3) {
          this.panning = true;
          canvas.style.cursor = 'grabbing';
        }
        if (this.panning) {
          this.camera.x = this.panStartCam.x - dx / this.camera.scale;
          this.camera.y = this.panStartCam.y - dy / this.camera.scale;
        }
      } else {
        this.hoverNode = hitTestNode(this.sim.nodes, wp.x, wp.y);
        canvas.style.cursor = this.hoverNode ? 'pointer' : 'default';
      }
    });
    const release = () => {
      this.requestRender();
      if (this.dragging && this.dragNode) {
        this.dragNode.fx = null; this.dragNode.fy = null;
        this.sim.alphaTarget = 0;
      } else if (this.panning) {
        // pan release - camera state just stays where it is, nothing to undo
      } else if (this.dragCandidate) {
        const hit = this.dragCandidate;
        this.selectedNode = (hit === this.selectedNode) ? null : hit;
        // A canvas click is a jump to somewhere new, not a step along a path,
        // so it starts the card's back-trail over rather than extending it.
        this.trail = [];
        if (this.selectedNode) this.fillPanel(this.selectedNode);
        if (this.panel) this.panel.classList.toggle('visible', !!this.selectedNode);
      } else if (this.panel && this.panStartScreen) {
        // a real empty-space click (never moved past the pan threshold) = deselect
        this.selectedNode = null;
        this.panel.classList.remove('visible');
      }
      this.dragCandidate = null; this.dragging = false; this.dragNode = null;
      this.panStartScreen = null; this.panStartCam = null;
      if (this.panning) { this.panning = false; canvas.style.cursor = 'default'; }
    };
    // Listen on window, not just canvas: a pan or drag that ends with the
    // cursor released outside the canvas must still clear cleanly.
    window.addEventListener('mouseup', release);
    canvas.addEventListener('mouseleave', () => { this.requestRender(); this.mouse.x = -9999; this.mouse.y = -9999; this.hoverNode = null; });
    canvas.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      // Proportional zoom: scale follows actual scroll distance, so trackpad
      // streams accumulate gently. deltaMode 1 = line-scroll mice; ctrlKey = pinch.
      const px = ev.deltaY * (ev.deltaMode === 1 ? 50 : 1);
      const factor = Math.pow(2, -px * (ev.ctrlKey ? 0.02 : 0.002));
      this.camera.zoomAt(ev.clientX, ev.clientY, w, h, factor);
    }, { passive: false });
  }

  draw() {
    const ctx = this.ctx, sim = this.sim, w = window.innerWidth, h = window.innerHeight;
    ctx.drawImage(this.bg, 0, 0, w, h);
    const ea = entranceGlobalAlpha(this.entranceStart);
    ctx.save();
    ctx.translate(w / 2, h / 2); ctx.scale(this.camera.scale, this.camera.scale); ctx.translate(-this.camera.x, -this.camera.y);

    const active = this.selectedNode || this.hoverNode;
    const connectedIds = active ? new Set(sim.adj.get(active.id).map(e => e.other.id)) : null;

    // Label candidates are gathered here (screen position projected under
    // the world transform) but drawn in a separate screen-space pass below,
    // so label text stays a constant size at every zoom level.
    const labelCandidates = [];
    for (const n of sim.nodes) {
      const alwaysOn = n === active || n === this.dragNode || n.degree >= window.LT.degreeAlwaysOn;
      let alpha = 1;
      if (!alwaysOn) {
        const t = (n.hw - MIN_R) / (MAX_R - MIN_R);
        const threshold = lerp(window.LT.dustZoom, window.LT.hubZoom, t);
        alpha = clamp((this.camera.scale - (threshold - window.LT.ramp)) / window.LT.ramp, 0, 1);
        if (alpha <= 0.01) continue; // not a candidate at all this frame
      }
      const sx = (n.x - this.camera.x) * this.camera.scale + w / 2;
      const sy = (n.y - this.camera.y) * this.camera.scale + h / 2;
      if (sx < -80 || sx > w + 80 || sy < -60 || sy > h + 60) continue; // off-screen
      labelCandidates.push({ n, alwaysOn, alpha, sx, sy });
    }
    // Always-on first, then most prominent (bigger radius) first.
    labelCandidates.sort((a, b) => (b.alwaysOn - a.alwaysOn) || (b.n.hw - a.n.hw));

    // Ambient hairline reach: the resting mesh (no node under the pointer or
    // selected) reads as a quiet constellation instead of a flat wireframe -
    // nearby links carry more of the line, distant ones settle to a floor
    // rather than vanish, so no real connection goes fully invisible.
    const meshReach = w * MESH_REACH_TO_W;
    for (const e of sim.edges) {
      const isConn = !!(active && (e.source.id === active.id || e.target.id === active.id));
      ctx.beginPath(); ctx.moveTo(e.source.x, e.source.y); ctx.lineTo(e.target.x, e.target.y);
      if (isConn) {
        ctx.strokeStyle = 'rgba(220,225,235,0.6)';
        ctx.lineWidth = 1.6;
      } else if (active) {
        ctx.strokeStyle = 'rgba(180,185,195,0.04)';
        ctx.lineWidth = 1;
      } else {
        const d = Math.hypot(e.source.x - e.target.x, e.source.y - e.target.y);
        const near = 1 - Math.min(d / meshReach, 1);
        ctx.strokeStyle = `rgba(180,185,195,${MESH_ALPHA_FLOOR + near * (MESH_ALPHA_NEAR - MESH_ALPHA_FLOOR)})`;
        ctx.lineWidth = 1;
      }
      ctx.globalAlpha = ea;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Depth: fill alpha eases off with distance from the sky's brightest
    // anchor, so the composition reads as a core with a fading field around
    // it instead of a flat scatter of equally-weighted dots.
    const depthOrigin = this.heroHub || { x: 0, y: 0 };
    const depthReach = w * DEPTH_REACH_TO_W;

    for (const n of sim.nodes) {
      const dim = active && n !== active && !(connectedIds && connectedIds.has(n.id)) ? 0.3 : 1;
      const isActive = n === active;
      if (isActive) {
        const gs = n.hw * 4.4;
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.7 * ea;
        ctx.drawImage(this.glowFor(n.type), n.x - gs / 2, n.y - gs / 2, gs, gs);
        ctx.globalCompositeOperation = 'source-over';
      } else {
        // Always-on ambient glow: the hero hub, and any rare riff/dial node,
        // burn bright; other large cycle hubs get a much quieter halo. Every
        // other node stays glow-free so the effect reads as rare, not busy.
        let glowRatio = 0, glowAlpha = 0;
        if (n === this.heroHub) { glowRatio = GLOW_ACCENT_TO_R; glowAlpha = GLOW_ACCENT_HERO_ALPHA; }
        else if (n.type === 'riff' || n.type === 'dial') { glowRatio = GLOW_ACCENT_TO_R; glowAlpha = GLOW_ACCENT_RARE_ALPHA; }
        else if (n.type === 'cycle' && (n.bucket === 'medium' || n.bucket === 'hub')) { glowRatio = GLOW_HUB_QUIET_TO_R; glowAlpha = GLOW_HUB_QUIET_ALPHA; }
        if (glowRatio) {
          const gs = n.hw * glowRatio;
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = glowAlpha * ea;
          ctx.drawImage(this.ambientGlowFor(n.type), n.x - gs / 2, n.y - gs / 2, gs, gs);
          ctx.globalCompositeOperation = 'source-over';
        }
      }
      const dist = Math.hypot(n.x - depthOrigin.x, n.y - depthOrigin.y);
      const depthAlpha = Math.max(DEPTH_ALPHA_FLOOR, 1 - Math.min(dist / depthReach, 1) * (1 - DEPTH_ALPHA_FLOOR));
      ctx.globalAlpha = dim * ea * depthAlpha;
      const d2 = n.hw * 2;
      ctx.drawImage(this.spriteFor(n.type, n.bucket), n.x - n.hw, n.y - n.hh, d2, d2);
      ctx.globalAlpha = 1;
    }
    ctx.restore(); // back to screen space - DPR-scaled, no camera transform

    // Screen-space label pass - constant 11px size at every zoom. Suppression
    // uses each candidate's real measured text bounds against an AABB of
    // already-placed higher-priority labels, not a fixed grid.
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const placed = [];
    for (const cand of labelCandidates) {
      const n = cand.n;
      let tw = this._labelWidthCache.get(n.id);
      if (tw == null) { tw = ctx.measureText(n.short).width; this._labelWidthCache.set(n.id, tw); }
      const labelY = cand.sy + n.hw * this.camera.scale + 13;
      const halfW = tw / 2 + 3, halfH = 8;
      const rect = { x1: cand.sx - halfW, y1: labelY - halfH, x2: cand.sx + halfW, y2: labelY + halfH };
      let overlaps = false;
      for (const p of placed) {
        if (rect.x1 < p.x2 && rect.x2 > p.x1 && rect.y1 < p.y2 && rect.y2 > p.y1) { overlaps = true; break; }
      }
      if (overlaps && !cand.alwaysOn) continue; // always-on always draws; others yield to a higher-priority neighbor
      placed.push(rect);

      const dim = active && n !== active && !(connectedIds && connectedIds.has(n.id)) ? 0.3 : 1;
      const isActive = n === active;
      ctx.font = (isActive ? '600 ' : '400 ') + '11px system-ui, -apple-system, sans-serif';
      const labelAlpha = cand.alpha * dim * ea;
      const col = isActive ? `rgba(255,255,255,${ea})` : `rgba(222,226,232,${0.78 * labelAlpha})`;
      drawLabelHalo(ctx, n.short, cand.sx, labelY, col);
    }
  }

  requestRender() {
    this.lastInputAt = performance.now();
    this.interactionActive = true;
    if (!this.rafId) this.rafId = requestAnimationFrame(this.tick);
  }

  tick(now) {
    this.rafId = null;
    if (!this.entranceStart) this.entranceStart = now;
    if (!this.lastT) this.lastT = now;
    const dt = Math.min((now - this.lastT) / 1000, 0.05);
    this.lastT = now;
    this.simT += dt;
    this.sim.step(dt);
    this.draw(now);
    this.frameCount++;

    const entranceActive = entranceGlobalAlpha(this.entranceStart) < 1;
    if (this.interactionActive && !this.dragging && !this.panning && (now - this.lastInputAt) > CALM_MS) {
      this.interactionActive = false;
    }
    const still = entranceActive || !this.sim.isAtRest() || this.dragging || this.panning || this.interactionActive;
    if (still) this.rafId = requestAnimationFrame(this.tick);
  }
}

window.GraphInstance = new GraphView(document.getElementById('canvas'), document.getElementById('panel'));

document.getElementById('replay-btn').addEventListener('click', () => {
  window.GraphInstance.replay();
});
document.getElementById('refresh-btn').addEventListener('click', () => {
  location.reload();
});
window.addEventListener('resize', () => {
  window.GraphInstance.resize();
});

const noticeMessage = computeNotice(window.CRAFT_BUILD, GRAPH);
if (noticeMessage) {
  const noticeEl = document.querySelector('#controls .notice');
  noticeEl.textContent = noticeMessage;
  noticeEl.classList.add('visible');
}
</script>
