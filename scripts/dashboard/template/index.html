<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="craft-template-version" content="7">
<title>Craft Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; }

  #stage .hint {
    position: absolute;
    left: 20px;
    bottom: 18px;
    font-size: 11px;
    letter-spacing: 0.04em;
    pointer-events: none;
    z-index: 5;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: rgba(220, 224, 232, 0.62);
  }

  #stage #controls {
    position: absolute;
    top: 20px;
    right: 22px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    pointer-events: none;
  }
  #stage #controls .notice { display: none; color: rgba(220, 224, 232, 0.34); }
  #stage #controls .notice.visible { display: inline; }
  #stage #controls button {
    pointer-events: auto;
    font-family: inherit;
    font-size: inherit;
    color: rgba(226, 230, 238, 0.78);
    background: transparent;
    border: 1px solid rgba(210, 215, 225, 0.16);
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #stage #controls button:hover { color: rgba(220, 224, 232, 0.9); border-color: rgba(210, 215, 225, 0.3); }

  #stage #panel {
    position: absolute;
    top: 62px;
    right: 22px;
    width: 320px;
    max-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    background: rgba(16, 16, 19, 0.93);
    border: 1px solid rgba(210, 215, 225, 0.16);
    border-radius: 11px;
    padding: 16px 18px;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e8eaef;
    opacity: 0;
    transform: translateX(8px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
    z-index: 6;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #stage #panel.visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
  #stage #panel .p-type {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7b808e;
    margin-bottom: 6px;
    flex: none;
  }
  /* The line tiers down as it reads: the record's own hue lights its type
     word, the state word steps back, the date steps back further. */
  #stage #panel .p-type .p-type-name { color: hsl(var(--h) var(--s) var(--l)); }
  #stage #panel .p-type .p-type-status { color: #9298a6; }
  #stage #panel .p-type .p-type-date { color: #7b808e; }
  /* Serif reading voice, widened here by ruling: the record's title is the
     one place the reading well's Charter voice reaches outside the well. */
  #stage #panel .p-title {
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.28;
    margin-bottom: 6px;
    color: #fbfbfd;
    flex: none;
  }
  #stage #panel .p-meta {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: #7b808e;
    margin-bottom: 12px;
    flex: none;
  }
  /* The well: the reading region's own plane of glass. Light plays across it
     (a static sheen) and its corners recede (a static vignette), so the
     record feels written INTO the glass rather than pasted flat on the card.
     Neutral - both overlays are black/white only; the drop-cap is the one
     hue accent. */
  #stage #panel .p-summary-well {
    position: relative;
    flex: none;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 6px;
    background: rgba(18,18,21,0.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -10px 16px -12px rgba(0,0,0,0.5);
  }
  #stage #panel .p-summary-well::before {
    content: '';
    position: absolute;
    inset: -10% -30%;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.05) 50%, transparent 58%);
  }
  #stage #panel .p-summary-well::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 35%, transparent 55%, rgba(0,0,0,0.32) 100%);
  }
  /* The spark shows the record's full source, always - no reveal control.
     Its line breaks carry meaning, so they render as written; overflow lives
     in an inner scroll window rather than growing the panel past its height. */
  #stage #panel .p-summary {
    position: relative;
    z-index: 1;
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 12.5px;
    line-height: 1.6;
    color: #c6cad4;
    max-height: 36vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    overflow-anchor: none;
    overflow-wrap: anywhere;
    padding: 14px 14px 16px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.18) transparent;
    /* fade state is toggled via at-top/at-bottom classes from a passive
       scroll listener (wireVerticalFade), not computed per frame. Zone sized
       to a full line so a boundary line is fully hidden, never half-opaque;
       the bottom zone is 40px (two lines) so a wrapped line's tail doesn't
       read as cut off. */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 40px), transparent 100%);
    /* ink reveal wipe - sequenced ~100ms after the panel's own slide-in so it
       reads as sequel, not collision. Restarted once per fillPanel; a switch
       overrides the delay to 0s inline (see fillPanel). */
    animation: c-ink-wipe 320ms ease both;
    animation-delay: 0.32s;
  }
  #stage #panel .p-summary.at-top {
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 40px), transparent 100%);
  }
  #stage #panel .p-summary.at-bottom {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 100%);
  }
  #stage #panel .p-summary.at-top.at-bottom { -webkit-mask-image: none; mask-image: none; }
  @keyframes c-ink-wipe { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0%); } }
  /* The template's first reduced-motion block, placed near the panel rules it
     overrides rather than at the stylesheet's tail (so later reduced-motion
     work, a future entrance say, has an obvious separate home next to it) -
     but AFTER those rules in source order: same-specificity selectors resolve
     by position, and a block placed earlier than the rules it overrides would
     silently lose to them regardless of the media query being active. */
  @media (prefers-reduced-motion: reduce) {
    #stage #panel.visible { transform: none; }
    #stage #panel .p-summary { animation: c-ink-wipe-reduced 220ms ease both; animation-delay: 0.28s; }
  }
  @keyframes c-ink-wipe-reduced { from { opacity: 0; } to { opacity: 1; } }
  #stage #panel .p-summary::-webkit-scrollbar { width: 4px; }
  #stage #panel .p-summary::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 2px; }
  /* spine neutralized to gray - the drop-cap carries the one hue accent */
  #stage #panel .p-summary::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(210,215,225,0.18);
  }
  #stage #panel .p-summary h2 {
    position: relative;
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #f2f3f6;
    margin: 16px 0 6px;
    opacity: 0.9;
  }
  #stage #panel .p-summary h2:first-child { margin-top: 2px; }
  #stage #panel .p-summary h2::before {
    content: '';
    position: absolute;
    left: -16px;
    top: 0.65em;
    width: 8px;
    height: 1px;
    background: rgba(210,215,225,0.3);
  }
  /* scroll-timeline heading focus - the heading nearest the top brightens,
     others dim. Feature-detected: a record with no headings never triggers
     this, an honest silence rather than a fake. */
  @supports (animation-timeline: view()) {
    #stage #panel .p-summary h2 {
      animation: c-heading-focus linear;
      animation-timeline: view();
      animation-range: entry 0% exit 100%;
    }
    @keyframes c-heading-focus { 0% { opacity: 0.55; } 40% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0.55; } }
  }
  #stage #panel .p-summary p { margin: 0 0 10px; }
  #stage #panel .p-summary .yaml-field { margin: 0 0 14px; }
  #stage #panel .p-summary .yaml-field:last-child { margin-bottom: 0; }
  #stage #panel .p-summary .yaml-key {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #868c99;
    margin-bottom: 4px;
  }
  #stage #panel .p-summary .yaml-val { overflow-wrap: anywhere; }
  #stage #panel .p-summary .yaml-list-marker {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #6b7080;
    margin-right: 0.4em;
  }
  /* The accent: the drop-cap. Only a prose record has a <p> as its first
     child - a cycle record's body is yaml-field divs, so this selector never
     matches it, an honest degradation rather than a bug. initial-letter is
     the real fix where supported: it reads the font's actual metrics and
     aligns a 2-line drop cap by construction. The float fallback approximates
     the same 2-line span for browsers without it. */
  #stage #panel .p-summary p:first-of-type::first-letter {
    float: left;
    font-weight: 700;
    font-size: 2.55em;
    line-height: 1.255;
    margin: 0 0.05em 0 0;
    color: hsl(var(--h) var(--s) var(--l));
  }
  @supports (initial-letter: 2) or (-webkit-initial-letter: 2) {
    #stage #panel .p-summary p:first-of-type::first-letter {
      float: none;
      -webkit-initial-letter: 2;
      initial-letter: 2;
      font-size: inherit;
      line-height: inherit;
      margin: 0 8px 0 0;
      padding: 0;
    }
  }
  #stage #panel .p-summary code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.86em;
    padding: 1px 5px;
    margin: 0 3px 0 2px;
    border-radius: 5px;
    color: #b8c4d8;
    background: rgba(255,255,255,0.03);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), inset 0 1px 2px rgba(0,0,0,0.35);
  }
  /* Section headers carry their own boundary: without the top rule and margin
     a chunk list and the Connections heading below it sit flush together. */
  #stage #panel .p-rel-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9298a6;
    margin-top: 18px;
    padding-top: 12px;
    margin-bottom: 6px;
    flex: none;
  }
  /* The deck's own fill already reads as the section boundary, so the first
     label under the well needs only a halved gap, not the full rhythm a
     label following another section (chunks -> Connections) still keeps. */
  #stage #panel .p-rels > .p-rel-label:first-child {
    margin-top: 8px;
    padding-top: 7px;
  }
  /* The work is collapsible; Connections is not - only a label carrying this
     class gets a click handler (wired in fillPanel at label creation). */
  #stage #panel .p-rel-label.chunks-toggle { cursor: pointer; user-select: none; }
  #stage #panel .chunks-toggle .disclosure { display: inline-block; width: 0.9em; }
  #stage #panel .p-chunk-list.is-collapsed { display: none; }
  /* The deck: a second, distinct region beneath the well - same recessed
     treatment, no hairline between the two; the label's own top spacing
     marks the boundary instead. Mask bands are 14px (vs. the well's 22/40) -
     the deck's rows are shorter, so a full-line zone is smaller here too. */
  #stage #panel .p-rels {
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 14px 12px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.018);
    overflow-anchor: none;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.18) transparent;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  #stage #panel .p-rels.at-top {
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 14px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 14px), transparent 100%);
  }
  #stage #panel .p-rels.at-bottom {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
  }
  #stage #panel .p-rels.at-top.at-bottom { -webkit-mask-image: none; mask-image: none; }
  #stage #panel .p-rel-item {
    font-size: 12.5px;
    color: #c7cbd4;
    padding: 4px 0;
    border-top: 1px solid rgba(210, 215, 225, 0.08);
    overflow-wrap: anywhere;
  }
  #stage #panel .p-rel-item:first-of-type { border-top: none; }

  /* Work rows: a status dot and the title on one flex line. text-indent is
     pinned to 0 and the title wraps inside its own flex cell, so wrapped
     lines align under the title text, never under the dot. */
  #stage #panel .p-chunk {
    display: flex;
    align-items: flex-start;
    gap: 0.5em;
    text-indent: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: #c7cbd4;
    padding: 4px 0;
    border-top: 1px solid rgba(210, 215, 225, 0.08);
  }
  #stage #panel .p-chunk:first-of-type { border-top: none; }
  /* The dot's resting look IS the pending state, so an unrecognized status
     degrades to pending instead of an invisible marker. The margin centers
     a 7px dot against the first 12.5px/1.5 text line. */
  #stage #panel .p-chunk .p-chunk-dot {
    box-sizing: border-box;
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-top: 0.45em;
    border: 1px solid #6b7080;
    opacity: 0.5;
  }
  #stage #panel .p-chunk .p-chunk-dot.is-active {
    border: 1.5px solid #9fd8ff;
    opacity: 1;
  }
  #stage #panel .p-chunk .p-chunk-dot.is-complete {
    background: #c7cbd4;
    border: none;
    opacity: 1;
  }
  #stage #panel .p-chunk .p-chunk-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  #stage #panel .p-chunk.is-complete .p-chunk-title { opacity: 0.65; }

  /* Back is a character in the type line, not a control on the card: bare
     chevron in that line's own colour and size, no fill, no border, no
     hit-box. iOS navigation-bar chevron / Linear's side panel. */
  #stage #panel .p-back {
    all: unset;
    cursor: pointer;
    font: inherit;
    color: inherit;
    font-size: 1.25em;
    line-height: 1;
    margin-right: 0.5em;
    vertical-align: -0.06em;
  }
  #stage #panel .p-back:hover { color: #ffffff; }
  /* `all: unset` above also unsets the user-agent focus ring, so the keyboard
     affordance has to be put back by hand - same outline the strip scroller
     uses. :focus-visible, not :focus, so a mouse click leaves no ring behind. */
  #stage #panel .p-back:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
    color: #ffffff;
  }

  /* The commit strip. A cell is ONE RECORD at a fixed size - a longer span
     widens the strip and scrolls; it never shrinks the cells below a
     clickable target. The scroller and its chrome exist only on overflow. */
  #stage #panel .p-strip-view { overflow: hidden; }
  #stage #panel .p-strip-view.is-scrollable {
    overflow-x: auto;
    overscroll-behavior-x: contain;
    padding-bottom: 7px;
    scrollbar-width: thin;
    scrollbar-color: rgba(210, 215, 225, 0.34) rgba(210, 215, 225, 0.10);
    -webkit-mask-image: linear-gradient(to right,
      transparent 0,
      #000 calc(18px * var(--fade-l, 0)),
      #000 calc(100% - 18px * var(--fade-r, 0)),
      transparent 100%);
  }
  /* The hairline that was already under the strip IS the scrollbar track, so
     overflow adds no new visual object to the card. */
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar { height: 3px; }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-track {
    background: rgba(210, 215, 225, 0.10);
    border-radius: 2px;
  }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-thumb {
    background: rgba(210, 215, 225, 0.34);
    border-radius: 2px;
  }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-thumb:hover {
    background: rgba(210, 215, 225, 0.55);
  }
  #stage #panel .p-strip-view.is-scrollable:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
  }
  #stage #panel .p-strip-grid {
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }
  #stage #panel .p-strip-col {
    display: flex;
    flex-direction: column-reverse;
    gap: 2px;
    width: 22px;
    flex: none;
  }
  #stage #panel .p-strip-cell {
    width: 22px;
    height: 9px;
    border-radius: 1.5px;
    cursor: pointer;
  }
  /* The strip is one tab stop with arrow keys inside it, so the ring has to
     read at 22x9 - same outline as the scroller and the back chevron. */
  #stage #panel .p-strip-cell:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
  }
  #stage #panel .p-strip-empty {
    width: 22px;
    height: 1px;
    background: rgba(210, 215, 225, 0.10);
  }
  #stage #panel .p-strip-ends {
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #83889a;
    margin-top: 6px;
  }
  #stage #panel .p-strip-span {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #7b808e;
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid rgba(210, 215, 225, 0.10);
  }
  #stage #panel .p-strip-legend {
    margin-top: 7px;
    font-size: 11px;
    color: #9aa0ad;
    line-height: 1.7;
  }
  #stage #panel .p-strip-legend span { margin-right: 11px; white-space: nowrap; }
  #stage #panel .p-strip-swatch {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 1.5px;
    margin-right: 5px;
  }
  #stage #panel .p-strip-hover {
    font-size: 11.5px;
    color: #aeb4c1;
    margin-top: 8px;
    height: 32px;
    line-height: 16px;
    overflow: hidden;
  }

  /* The insight layer: near-opaque cards pinned to the frame edges,
     composed over the settled galaxy. The layer itself rests at full
     opacity - each card owns its own staggered entrance - and the layer
     fade survives solely as the reading-panel coexistence seam. */
  #stage #cards {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.6s ease;
  }
  /* Chips accept the mouse only once revealed - the reveal itself fires at
     true rest, so this is the calm gate: hover can never catch the bloom. */
  #stage #cards.shown .card { pointer-events: auto; }
  #stage #cards.suppressed .card { pointer-events: none; }
  /* While the record panel owns the right edge, the insight layer bows out -
     the mark pass reads this same class to stop drawing marks. Declared
     after .shown so it wins when both classes are present. */
  #stage #cards.suppressed { opacity: 0; }
  /* Below desktop sizes the edge slots start eating the luminous core, so
     the layer disappears entirely rather than crowd the sky. */
  @media (max-width: 1099px), (max-height: 699px) {
    #stage #cards { display: none; }
  }
  /* The card surface: near-opaque fill so the galaxy never bleeds through
     the prose, one inset top highlight, and the accepted soft drop shadow -
     the one deliberate exception to the inset-only shadow law. Entrance is
     opacity+transform per card, staggered by an inline transition delay. */
  #stage #cards .card {
    position: absolute;
    width: 300px;
    background: rgba(14,15,19,0.94);
    border-radius: 11px;
    padding: 13px 15px 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.45);
    border: 1px solid transparent; /* per-card evidence hue at 0.55 alpha, set inline */
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    font-weight: 450;
    letter-spacing: 0em;
    font-optical-sizing: auto;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 480ms ease, transform 480ms cubic-bezier(0.16,1,0.3,1);
  }
  #stage #cards.shown .card { opacity: 1; transform: translateY(0); }
  #stage #cards .card .c-eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 7px;
  }
  #stage #cards .card .c-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  /* The date badge rides the eyebrow's far end - graph-derived from the
     quote-source node, never carried by the sidecar. */
  #stage #cards .card .c-eyebrow .c-date { margin-left: auto; font-size: 9.5px; letter-spacing: 0.1em; opacity: 0.75; }
  /* Right-pinned chips justify the machine-voice eyebrow to the frame edge;
     the prose below stays left-aligned unconditionally - a right-aligned
     body reads as a ragged left edge. */
  #stage #cards .card.pin-right .c-eyebrow { justify-content: flex-end; }
  #stage #cards .card .c-body {
    font-size: 14px;
    line-height: 1.5;
    color: #e8eaef;
    text-align: left;
    overflow-wrap: anywhere;
  }

<script>
'use strict';

/* This page opens from file:// - every local file is its own opaque origin
   there, so the Fetch API and ES modules fail silently. Classic sibling
   <script src> tags are the only load path that works, hence the three
   tags above rather than any import. */
const TAU = Math.PI * 2;
const GRAPH = (window.CRAFT_GRAPH && window.CRAFT_GRAPH.nodes) ? window.CRAFT_GRAPH : { nodes: [], edges: [] };
// The status, dial-outcome and type words this page prints - additive on the
// graph envelope, read here instead of held as a second copy of the same rules
// inside the page. No relationship verbs: the card's Connections region is the
// commit strip now, so the builder stopped emitting words nothing reads.
const VOCAB = GRAPH.vocabulary || { statuses: {}, dial_outcomes: {}, types: {} };
// The insight sidecar is optional and hand-authored, so absent, stale and
// malformed must all land in the same branch. A parse error inside a classic
// script stays inside its own tag - a broken sidecar simply never assigns
// the global and this guard sees undefined. No try/catch needed.
const INSIGHTS = (window.CRAFT_INSIGHTS && window.CRAFT_INSIGHTS.version === 1 && Array.isArray(window.CRAFT_INSIGHTS.cards)) ? window.CRAFT_INSIGHTS : null;

// The page cannot read .craft/'s mtime, so elapsed time since the last build
// carries no information about whether the graph is current - only these
// three receipts do.
const EXPECTED_DATA_VERSION = 1;

function computeNotice(build, graph) {
  if (!graph || !graph.nodes || !graph.nodes.length) {
    return 'No graph data yet. Run any craft flow, then press Refresh.';
  }
  if (graph.version !== EXPECTED_DATA_VERSION) {
    return 'This page is older than your project data. Run /craft:dashboard to update it.';
  }
  if (build && build.status !== 'ok') {
    return "The last rebuild didn't finish. Refresh once it has run again.";
  }
  return null;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function truncateTitle(title, max) {
  const s = title || '(untitled)';
  return s.length > max ? s.slice(0, max - 1).trimEnd() + '…' : s;
}

function cloneNodes() {
  return GRAPH.nodes.map((n, i) => ({
    id: n.id,
    type: n.type,
    label: n.title || n.id,
    short: truncateTitle(n.title, 24),
    date: n.date,
    status: n.status,
    chunks: n.chunks,
    summary: n.summary,
    x: 0, y: 0, vx: 0, vy: 0,
    mass: 1,
    phase: i * 1.3197 + 0.4,
  }));
}

function buildEdges(nodes) {
  const byId = new Map(nodes.map(n => [n.id, n]));
  const out = [];
  let i = 0;
  for (const e of GRAPH.edges) {
    const s = byId.get(e.source), t = byId.get(e.target);
    if (!s || !t) continue; // defensive: skip any dangling reference
    out.push({ source: s, target: t, kind: e.kind, pulsePhase: (i * 0.3719) % 1 });
    i++;
  }
  return out;
}

function buildAdjacency(nodes, edges) {
  const adj = new Map(nodes.map(n => [n.id, []]));
  edges.forEach(e => {
    adj.get(e.source.id).push({ other: e.target, kind: e.kind, dir: 'out' });
    adj.get(e.target.id).push({ other: e.source, kind: e.kind, dir: 'in' });
  });
  return adj;
}

/* Records semi-cluster by TYPE: a small standalone force relaxation among
   the ~9 type anchors, weighted by each type's real member count/radius
   mass, decides where each coloured region lives. Bigger clusters pull
   harder toward the centre (they end up the visual core); smaller ones get
   pushed to the periphery by pairwise repulsion sized to their own spread -
   the real data's lopsidedness, not a fabricated balance. */
const GOLDEN_ANGLE = 2.399963229728653;
const SPREAD_MULT = 1.0;
let TYPE_ANCHORS = null;
function computeTypeAnchors(nodes, groups) {
  const types = [...groups.keys()];
  const anchors = types.map(t => {
    const members = groups.get(t);
    const massArea = members.reduce((s, i) => s + nodes[i].hw * nodes[i].hw, 0);
    const spreadR = 26 + Math.sqrt(massArea) * 1.15;
    return { type: t, count: members.length, spreadR, x: 0, y: 0 };
  });
  anchors.sort((a, b) => b.spreadR - a.spreadR);
  const N = anchors.length;
  anchors.forEach((a, i) => {
    const ang = (i / N) * TAU;
    const seedR = 220 + a.spreadR;
    a.x = Math.cos(ang) * seedR; a.y = Math.sin(ang) * seedR * 0.7;
  });
  for (let iter = 0; iter < 420; iter++) {
    for (let i = 0; i < N; i++) {
      let fx = 0, fy = 0;
      const ai = anchors[i];
      for (let j = 0; j < N; j++) {
        if (i === j) continue;
        const bj = anchors[j];
        let dx = ai.x - bj.x, dy = ai.y - bj.y;
        let d = Math.hypot(dx, dy) || 0.01;
        const minD = ai.spreadR + bj.spreadR + 46;
        if (d < minD) {
          const push = (minD - d) * 0.05;
          fx += (dx / d) * push; fy += (dy / d) * push;
        }
      }
      const gk = 0.00016 * ai.spreadR;
      fx += -ai.x * gk; fy += -ai.y * gk;
      ai.fx = fx; ai.fy = fy;
    }
    for (const a of anchors) { a.x += a.fx; a.y += a.fy; }

  return map;
}

// Each type's members scatter phyllotaxis-style around their relaxed anchor,
// spiral radius scaled by member count, in the same unitless reference space.
function computeHomeRefs(nodes, groups, spreadMult) {
  for (const [type, members] of groups) {
    const anchor = TYPE_ANCHORS.get(type);
    const spiralScale = (10 + Math.sqrt(members.length) * 8) * spreadMult;
    members.forEach((i, j) => {
      const angle = j * GOLDEN_ANGLE;
      const rad = spiralScale * Math.sqrt(j + 0.5);
      nodes[i].homeRefX = anchor.x + Math.cos(angle) * rad;
      nodes[i].homeRefY = anchor.y + Math.sin(angle) * rad;

// The plate fits the viewport with ONE uniform scale - never per-axis, so
// the sky is never stretched anisotropically. The returned transform maps
// reference space to world space; the heat bake projects anchors through it.
function fitHomes(nodes, w, h, fitWFrac, fitHFrac) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes) {
    if (n.homeRefX < minX) minX = n.homeRefX; if (n.homeRefX > maxX) maxX = n.homeRefX;
    if (n.homeRefY < minY) minY = n.homeRefY; if (n.homeRefY > maxY) maxY = n.homeRefY;
  }
  const cx0 = (minX + maxX) / 2, cy0 = (minY + maxY) / 2;
  const scaleX = (w * fitWFrac) / (maxX - minX || 1);
  const scaleY = (h * fitHFrac) / (maxY - minY || 1);
  const scale = Math.min(scaleX, scaleY);
  for (const n of nodes) {
    n.homeX = w / 2 + (n.homeRefX - cx0) * scale;
    n.homeY = h / 2 + (n.homeRefY - cy0) * scale;
  }
  return { scale, cx0, cy0 };
}

class Sim {

    if (!TYPE_ANCHORS) TYPE_ANCHORS = computeTypeAnchors(this.nodes, this.byType);

    const fx = new Float64Array(n), fy = new Float64Array(n);

    // decaying back to the stance's normal repulsion within ~380ms so it
    // reads as a burst, not a permanent change.
    if (!REDUCED_MOTION && this.entranceT0) {

      const ai = this.idx.get(e.source.id), bi = this.idx.get(e.target.id);

      const node = nodes[i];

    // edge spring pulling it toward a held node - nowhere near enough to
    // visibly follow. This is a temporary, much stronger pull straight at
    // the held node's live position, active only while a node is held, so
    // towed neighbours visibly stretch toward it and flow back to their
    // normal cluster home the instant it is released. Only the held node
    // itself ever pins; a neighbour already pinned holds its own spot.
    if (this.dragNode && this.towed.length) {

      const dn = this.dragNode;
      for (const tn of this.towed) {
        if (tn.fx != null) continue; // an already-pinned neighbour holds its own spot
        const ti = this.idx.get(tn.id);
        fx[ti] += (dn.x - tn.x) * towK * forceScale;
        fy[ti] += (dn.y - tn.y) * towK * forceScale;
      }
    }
    // Drag-release recovery: ease damping UP toward a bouncier value right
    // after a pin, easing back down to the stance's normal (heavier)

    // can unpack itself, and the normal damping kills that velocity too
    // fast - this briefly lets the physics relax the jam in place. No
    // repositioning: nothing moves that wasn't already out of equilibrium.
    let damping = this.opts.damping;

      if (elapsed < RECOVER_MS) damping = damping + (0.992 - damping) * (1 - elapsed / RECOVER_MS);
    }
    const dampingStep = Math.pow(damping, dt * 60);
    for (let i = 0; i < n; i++) {
      const node = nodes[i];
      if (node.fx != null) { node.x = node.fx; node.y = node.fy; node.vx = 0; node.vy = 0; continue; }
      node.vx = (node.vx + (fx[i] / node.mass) * dt) * dampingStep;
      node.vy = (node.vy + (fy[i] / node.mass) * dt) * dampingStep;
      const sp = Math.hypot(node.vx, node.vy);
      if (sp > maxSpeed) { const s = maxSpeed / sp; node.vx *= s; node.vy *= s; }
      node.x += node.vx * dt;
      node.y += node.vy * dt;
    }
  }
}

// Seed tight, then launch with real angular momentum: a radial component
// for the burst plus a dominant tangential component (perpendicular to each
// node's own outward direction, same handedness for every node), so the
// whole galaxy visibly spins up out of the flash as gravity reels it back
// into formation. Under reduced motion: a plain, slightly looser seed with
// zero velocity.
function seedCompactCloud(nodes, cx, cy) {
  const swirl = !REDUCED_MOTION;
  const seedScale = swirl ? 0.022 : 0.055;
  nodes.forEach((n, i) => {
    const hx = n.homeX != null ? n.homeX : cx, hy = n.homeY != null ? n.homeY : cy;
    const jitter = (i % 2 === 0 ? 1 : -1) * (3 + (i * 7) % 9);
    n.x = cx + (hx - cx) * seedScale + jitter;
    n.y = cy + (hy - cy) * seedScale - jitter * 0.6;
    if (swirl) {
      const dx = hx - n.x, dy = hy - n.y;
      const dist = Math.hypot(dx, dy) || 1;
      const ux = dx / dist, uy = dy / dist;
      const tx = -uy, ty = ux; // perpendicular - same rotational sense for every node
      const launch = Math.min(dist * 2.6, 900);
      n.vx = ux * launch * 0.35 + tx * launch * 0.9;
      n.vy = uy * launch * 0.35 + ty * launch * 0.9;
    } else {
      n.vx = 0; n.vy = 0;
    }
  });
}

function makeCanvasCtx(canvas) {
  const ctx = canvas.getContext('2d');
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  return { ctx, resize };
}

function hitTestNode(nodes, wx, wy) {
  let best = null, bestScore = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d <= n.hw + 6 && d < bestScore) { best = n; bestScore = d; }
  }
  return best;
}

class Camera {
  constructor() { this.scale = 1; this.x = 0; this.y = 0; }
  toWorld(sx, sy, w, h) { return { x: (sx - w / 2) / this.scale + this.x, y: (sy - h / 2) / this.scale + this.y }; }
  zoomAt(sx, sy, w, h, factor) {
    const before = this.toWorld(sx, sy, w, h);
    this.scale = clamp(this.scale * factor, 0.2, 6);
    const after = this.toWorld(sx, sy, w, h);
    this.x += before.x - after.x;
    this.y += before.y - after.y;
  }
}

function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;

  const m = l - c / 2;

  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }

const TYPE_HSL = {
  cycle: [47, 88, 64],      // true gold - the container
  story: [16, 72, 60],      // ember-coral - craft's own accent
  fix: [352, 66, 58],       // rose-red - alert/resolved
  tweak: [178, 46, 54],     // teal-cyan - minor/quiet
  planning: [210, 50, 58],  // blue - not built yet
  notebook: [258, 40, 56],  // violet - quiet dust-ring texture
  riff: [325, 58, 64],      // magenta - rare, allowed to stand out
  dial: [302, 42, 63],      // orchid
  mockup: [135, 45, 56],    // tree green

const TYPE_RGB = {};
for (const k in TYPE_HSL) TYPE_RGB[k] = hsl2rgb(TYPE_HSL[k][0], TYPE_HSL[k][1], TYPE_HSL[k][2]);

const STATUS_ALPHA = { complete: 1, shipped: 1, active: 0.85, ready: 0.6, open: 0.6, planning: 0.4 };

const typeCountWord = (t, count) => {
  const word = String(VOCAB.types[t] || t).toLowerCase();

  if (/[^aeiou]y$/.test(word)) return word.slice(0, -1) + 'ies';   // -y becomes -ies

const FALLBACK_HSL = [0, 0, 55];
const FALLBACK_RGB = hsl2rgb(FALLBACK_HSL[0], FALLBACK_HSL[1], FALLBACK_HSL[2]);

const SIZE_BUCKETS = [
  { key: 'dust', maxR: 11, bakeR: 12 },
  { key: 'small', maxR: 19, bakeR: 20 },
  { key: 'medium', maxR: 29, bakeR: 30 },
  { key: 'hub', maxR: Infinity, bakeR: 42 },

function bucketFor(r) {

// sprites above.

// Rim per tokens.yaml visual.node_treatment.rim_to_radius: width

function bakeBackground(w, h) {

const DEG_CAP = 40;
const MIN_R = 6, MAX_R = 40;

// The cluster heat's own clock. The bloom bakes early rather than waiting
// for true rest (which a drag or a slow settle can push out indefinitely).
// The beat is derived from the stance's own alphaDecay (0.026), not guessed:
// alpha reaches ~95% decayed - the point the launch has visibly resolved
// into a gentle settle - at ln(0.05)/ln(1-0.026)/60 =~ 1.9s. Landing the
// beat at 1.6s puts it just ahead of that read, so heat arrives after the
// entrance's big gesture rather than cutting in front of it; its 600ms fade
// then reads as continuing atmosphere behind the insight layer landing.
const EARLY_HEAT_MS = 1600;
const HEAT_FADE_MS = 600;
// Heat stamps additively at this alpha with this size multiplier; the
// cooled region's bloom drops to 0.7x so grey dots never sit on a warm haze.
const HEAT_ALPHA = 0.5;
const HEAT_SIZE_MULT = 1.1;
// A trackpad zoom stream fires many wheel events per second; a shorter
// window would stutter the loop stopping and restarting between them.
const CALM_MS = 900;
// The swirl launch and the repulsion pop collapse to a plain seed under
// reduced motion - checked once at load, never per frame. The heat and
// insight-layer opacity fades still run either way.
const REDUCED_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
// The insight layer reveals at whichever comes FIRST: the simulation
// reaching true rest, or this hard ceiling from the first painted frame -
// so a drag keeping the loop alive can never hold the insight layer
// hostage, and a fast settle never leaves it waiting on a clock.
const CARD_REVEAL_MS = 2000;
// Eyebrow badge months - uppercase to match the eyebrow's machine voice.
const CARD_MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
// Leaders fade in over 500ms starting 400ms after the reveal, and their
// contact ray-march re-derives at most once per 100ms while the camera or
// the field is moving - the march tests every node, so an unthrottled
// rebuild would run it four times per frame during a drag.
const LEADER_FADE_MS = 500;
const LEADER_FADE_DELAY_MS = 400;
const LEADER_REMARCH_MS = 100;
// Hover unlocks on a fixed clock from the first painted frame - a load
// delay, deliberately NOT chained to the sim's energy. The early violent
// fling (where a cursor over flying nodes strobes the glow and flickers the
// pointer) is over well inside this window; after it, the slow glide is
// gentle enough to point at long before true stillness. Named so the calm
// point can be tuned live against the real page.
const HOVER_CALM_MS = 1500;
// Four fixed viewport slots for the insight chips, fractions of the frame
// edges. Assignment happens once, at reveal, by giving each card the nearest
// free slot to its evidence centroid in screen space - never recomputed
// during pan, zoom or drag, so the composition stays quiet under a hand.
const CARD_SLOTS = [
  { side: 'left', x: 0.028, y: 0.075 },
  { side: 'right', x: 0.028, y: 0.10 },
  { side: 'left', x: 0.028, y: 0.62 },
  { side: 'right', x: 0.028, y: 0.60 },
];
// Below these viewport sizes the edge slots start eating the luminous core,
// so the whole insight layer (chips and marks alike) stays hidden.
const CARD_MIN_W = 1100, CARD_MIN_H = 700;
function cardsViewportOk() { return window.innerWidth >= CARD_MIN_W && window.innerHeight >= CARD_MIN_H; }
// window.NS and window.LT are page globals on purpose - the browser skill's
// evaluate_script reaches them directly to try alternate values live.
window.NS = window.NS || { cycleScale: 0.65 };
window.LT = window.LT || { degreeAlwaysOn: Infinity, hubZoom: 2.2, dustZoom: 4.6, ramp: 0.8 };

// Progressive label reveal: labelAlpha = f(camera.scale, nodeRadius). Bigger
// radius means a lower reveal threshold (arrives first); alpha ramps
// linearly over LABEL_RAMP zoom-units around that threshold, never a hard
// pop. Labels render at a constant screen size regardless of zoom.
const LABEL_HUB_ZOOM = 0.6;   // large nodes: basically always revealed
const LABEL_DUST_ZOOM = 3.4;  // smallest nodes: require real zoom-in
const LABEL_RAMP = 0.9;       // zoom-units over which alpha fades 0->1

// Appends one line of record text as text runs and inline elements, left to
// right, in order - the only shape that keeps the verbatim law: no character
// is added, reordered, or removed, and record text never passes through
// innerHTML. Backtick code wins first at any position, then double-marker
// bold, then single-marker emphasis; a matcher earlier in the alternation
// always takes an overlapping span before a later one gets the chance.
const INLINE_RUN_RE = /`([^`]+)`|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*]+)\*|_([^_]+)_/g;

  INLINE_RUN_RE.lastIndex = 0;
  let lastIndex = 0, m;
  while ((m = INLINE_RUN_RE.exec(line)) !== null) {
    if (m.index > lastIndex) el.appendChild(document.createTextNode(line.slice(lastIndex, m.index)));
    const node = document.createElement(m[1] !== undefined ? 'code' : (m[2] !== undefined || m[3] !== undefined) ? 'strong' : 'em');
    node.textContent = m[1] !== undefined ? m[1] : m[2] !== undefined ? m[2] : m[3] !== undefined ? m[3] : m[4] !== undefined ? m[4] : m[5];
    el.appendChild(node);
    lastIndex = INLINE_RUN_RE.lastIndex;
