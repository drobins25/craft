<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="craft-template-version" content="6">
<title>Craft Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; }

  #stage .hint {
    position: absolute;
    left: 20px;
    bottom: 18px;
    font-size: 11px;
    letter-spacing: 0.04em;
    pointer-events: none;
    z-index: 5;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: rgba(220, 224, 232, 0.62);
  }

  #stage #controls {
    position: absolute;
    top: 20px;
    right: 22px;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    pointer-events: none;
  }
  #stage #controls .notice { display: none; color: rgba(220, 224, 232, 0.34); }
  #stage #controls .notice.visible { display: inline; }
  #stage #controls button {
    pointer-events: auto;
    font-family: inherit;
    font-size: inherit;
    color: rgba(226, 230, 238, 0.78);
    background: transparent;
    border: 1px solid rgba(210, 215, 225, 0.16);
    border-radius: 4px;
    padding: 6px 10px;
    cursor: pointer;
  }
  #stage #controls button:hover { color: rgba(220, 224, 232, 0.9); border-color: rgba(210, 215, 225, 0.3); }

  #stage #panel {
    position: absolute;
    top: 62px;
    right: 22px;
    width: 320px;
    max-height: calc(100vh - 90px);
    display: flex;
    flex-direction: column;
    background: rgba(16, 16, 19, 0.93);
    border: 1px solid rgba(210, 215, 225, 0.16);
    border-radius: 11px;
    padding: 16px 18px;
    font-family: system-ui, -apple-system, sans-serif;
    color: #e8eaef;
    opacity: 0;
    transform: translateX(8px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
    z-index: 6;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #stage #panel.visible { opacity: 1; transform: translateX(0); pointer-events: auto; }
  #stage #panel .p-type {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #7b808e;
    margin-bottom: 6px;
    flex: none;
  }
  /* The line tiers down as it reads: the record's own hue lights its type
     word, the state word steps back, the date steps back further. */
  #stage #panel .p-type .p-type-name { color: hsl(var(--h) var(--s) var(--l)); }
  #stage #panel .p-type .p-type-status { color: #9298a6; }
  #stage #panel .p-type .p-type-date { color: #7b808e; }
  /* Serif reading voice, widened here by ruling: the record's title is the
     one place the reading well's Charter voice reaches outside the well. */
  #stage #panel .p-title {
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.015em;
    line-height: 1.28;
    margin-bottom: 6px;
    color: #fbfbfd;
    flex: none;
  }
  #stage #panel .p-meta {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: #7b808e;
    margin-bottom: 12px;
    flex: none;
  }
  /* The well: the reading region's own plane of glass. Light plays across it
     (a static sheen) and its corners recede (a static vignette), so the
     record feels written INTO the glass rather than pasted flat on the card.
     Neutral - both overlays are black/white only; the drop-cap is the one
     hue accent. */
  #stage #panel .p-summary-well {
    position: relative;
    flex: none;
    overflow: hidden;
    border-radius: 8px;
    margin-bottom: 6px;
    background: rgba(18,18,21,0.4);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 -10px 16px -12px rgba(0,0,0,0.5);
  }
  #stage #panel .p-summary-well::before {
    content: '';
    position: absolute;
    inset: -10% -30%;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.05) 50%, transparent 58%);
  }
  #stage #panel .p-summary-well::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 35%, transparent 55%, rgba(0,0,0,0.32) 100%);
  }
  /* The spark shows the record's full source, always - no reveal control.
     Its line breaks carry meaning, so they render as written; overflow lives
     in an inner scroll window rather than growing the panel past its height. */
  #stage #panel .p-summary {
    position: relative;
    z-index: 1;
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 12.5px;
    line-height: 1.6;
    color: #c6cad4;
    max-height: 36vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    overflow-anchor: none;
    overflow-wrap: anywhere;
    padding: 14px 14px 16px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.18) transparent;
    /* fade state is toggled via at-top/at-bottom classes from a passive
       scroll listener (wireVerticalFade), not computed per frame. Zone sized
       to a full line so a boundary line is fully hidden, never half-opaque;
       the bottom zone is 40px (two lines) so a wrapped line's tail doesn't
       read as cut off. */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 calc(100% - 40px), transparent 100%);
    /* ink reveal wipe - sequenced ~100ms after the panel's own slide-in so it
       reads as sequel, not collision. Restarted once per fillPanel; a switch
       overrides the delay to 0s inline (see fillPanel). */
    animation: c-ink-wipe 320ms ease both;
    animation-delay: 0.32s;
  }
  #stage #panel .p-summary.at-top {
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 40px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 40px), transparent 100%);
  }
  #stage #panel .p-summary.at-bottom {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 22px, #000 100%);
  }
  #stage #panel .p-summary.at-top.at-bottom { -webkit-mask-image: none; mask-image: none; }
  @keyframes c-ink-wipe { from { clip-path: inset(0 0 0 100%); } to { clip-path: inset(0 0 0 0%); } }
  /* The template's first reduced-motion block, placed near the panel rules it
     overrides rather than at the stylesheet's tail (so later reduced-motion
     work, a future entrance say, has an obvious separate home next to it) -
     but AFTER those rules in source order: same-specificity selectors resolve
     by position, and a block placed earlier than the rules it overrides would
     silently lose to them regardless of the media query being active. */
  @media (prefers-reduced-motion: reduce) {
    #stage #panel.visible { transform: none; }
    #stage #panel .p-summary { animation: c-ink-wipe-reduced 220ms ease both; animation-delay: 0.28s; }
  }
  @keyframes c-ink-wipe-reduced { from { opacity: 0; } to { opacity: 1; } }
  #stage #panel .p-summary::-webkit-scrollbar { width: 4px; }
  #stage #panel .p-summary::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 2px; }
  /* spine neutralized to gray - the drop-cap carries the one hue accent */
  #stage #panel .p-summary::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: rgba(210,215,225,0.18);
  }
  #stage #panel .p-summary h2 {
    position: relative;
    font-family: Charter, "Iowan Old Style", Georgia, serif;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #f2f3f6;
    margin: 16px 0 6px;
    opacity: 0.9;
  }
  #stage #panel .p-summary h2:first-child { margin-top: 2px; }
  #stage #panel .p-summary h2::before {
    content: '';
    position: absolute;
    left: -16px;
    top: 0.65em;
    width: 8px;
    height: 1px;
    background: rgba(210,215,225,0.3);
  }
  /* scroll-timeline heading focus - the heading nearest the top brightens,
     others dim. Feature-detected: a record with no headings never triggers
     this, an honest silence rather than a fake. */
  @supports (animation-timeline: view()) {
    #stage #panel .p-summary h2 {
      animation: c-heading-focus linear;
      animation-timeline: view();
      animation-range: entry 0% exit 100%;
    }
    @keyframes c-heading-focus { 0% { opacity: 0.55; } 40% { opacity: 1; } 60% { opacity: 1; } 100% { opacity: 0.55; } }
  }
  #stage #panel .p-summary p { margin: 0 0 10px; }
  #stage #panel .p-summary .yaml-field { margin: 0 0 14px; }
  #stage #panel .p-summary .yaml-field:last-child { margin-bottom: 0; }
  #stage #panel .p-summary .yaml-key {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #868c99;
    margin-bottom: 4px;
  }
  #stage #panel .p-summary .yaml-val { overflow-wrap: anywhere; }
  #stage #panel .p-summary .yaml-list-marker {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #6b7080;
    margin-right: 0.4em;
  }
  /* The accent: the drop-cap. Only a prose record has a <p> as its first
     child - a cycle record's body is yaml-field divs, so this selector never
     matches it, an honest degradation rather than a bug. initial-letter is
     the real fix where supported: it reads the font's actual metrics and
     aligns a 2-line drop cap by construction. The float fallback approximates
     the same 2-line span for browsers without it. */
  #stage #panel .p-summary p:first-of-type::first-letter {
    float: left;
    font-weight: 700;
    font-size: 2.55em;
    line-height: 1.255;
    margin: 0 0.05em 0 0;
    color: hsl(var(--h) var(--s) var(--l));
  }
  @supports (initial-letter: 2) or (-webkit-initial-letter: 2) {
    #stage #panel .p-summary p:first-of-type::first-letter {
      float: none;
      -webkit-initial-letter: 2;
      initial-letter: 2;
      font-size: inherit;
      line-height: inherit;
      margin: 0 8px 0 0;
      padding: 0;
    }
  }
  #stage #panel .p-summary code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.86em;
    padding: 1px 5px;
    margin: 0 3px 0 2px;
    border-radius: 5px;
    color: #b8c4d8;
    background: rgba(255,255,255,0.03);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07), inset 0 1px 2px rgba(0,0,0,0.35);
  }
  /* Section headers carry their own boundary: without the top rule and margin
     a chunk list and the Connections heading below it sit flush together. */
  #stage #panel .p-rel-label {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9298a6;
    margin-top: 18px;
    padding-top: 12px;
    margin-bottom: 6px;
    flex: none;
  }
  /* The deck's own fill already reads as the section boundary, so the first
     label under the well needs only a halved gap, not the full rhythm a
     label following another section (chunks -> Connections) still keeps. */
  #stage #panel .p-rels > .p-rel-label:first-child {
    margin-top: 8px;
    padding-top: 7px;
  }
  /* The work is collapsible; Connections is not - only a label carrying this
     class gets a click handler (wired in fillPanel at label creation). */
  #stage #panel .p-rel-label.chunks-toggle { cursor: pointer; user-select: none; }
  #stage #panel .chunks-toggle .disclosure { display: inline-block; width: 0.9em; }
  #stage #panel .p-chunk-list.is-collapsed { display: none; }
  /* The deck: a second, distinct region beneath the well - same recessed
     treatment, no hairline between the two; the label's own top spacing
     marks the boundary instead. Mask bands are 14px (vs. the well's 22/40) -
     the deck's rows are shorter, so a full-line zone is smaller here too. */
  #stage #panel .p-rels {
    overflow-y: auto;
    flex: 1 1 auto;
    min-height: 0;
    padding: 0 14px 12px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.018);
    overflow-anchor: none;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.18) transparent;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  #stage #panel .p-rels.at-top {
    -webkit-mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 14px), transparent 100%);
            mask-image: linear-gradient(to bottom, #000 0, #000 calc(100% - 14px), transparent 100%);
  }
  #stage #panel .p-rels.at-bottom {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 100%);
  }
  #stage #panel .p-rels.at-top.at-bottom { -webkit-mask-image: none; mask-image: none; }
  #stage #panel .p-rel-item {
    font-size: 12.5px;
    color: #c7cbd4;
    padding: 4px 0;
    border-top: 1px solid rgba(210, 215, 225, 0.08);
    overflow-wrap: anywhere;
  }
  #stage #panel .p-rel-item:first-of-type { border-top: none; }

  /* Work rows: a status dot and the title on one flex line. text-indent is
     pinned to 0 and the title wraps inside its own flex cell, so wrapped
     lines align under the title text, never under the dot. */
  #stage #panel .p-chunk {
    display: flex;
    align-items: flex-start;
    gap: 0.5em;
    text-indent: 0;
    font-size: 12.5px;
    line-height: 1.5;
    color: #c7cbd4;
    padding: 4px 0;
    border-top: 1px solid rgba(210, 215, 225, 0.08);
  }
  #stage #panel .p-chunk:first-of-type { border-top: none; }
  /* The dot's resting look IS the pending state, so an unrecognized status
     degrades to pending instead of an invisible marker. The margin centers
     a 7px dot against the first 12.5px/1.5 text line. */
  #stage #panel .p-chunk .p-chunk-dot {
    box-sizing: border-box;
    flex: none;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-top: 0.45em;
    border: 1px solid #6b7080;
    opacity: 0.5;
  }
  #stage #panel .p-chunk .p-chunk-dot.is-active {
    border: 1.5px solid #9fd8ff;
    opacity: 1;
  }
  #stage #panel .p-chunk .p-chunk-dot.is-complete {
    background: #c7cbd4;
    border: none;
    opacity: 1;
  }
  #stage #panel .p-chunk .p-chunk-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  #stage #panel .p-chunk.is-complete .p-chunk-title { opacity: 0.65; }

  /* Back is a character in the type line, not a control on the card: bare
     chevron in that line's own colour and size, no fill, no border, no
     hit-box. iOS navigation-bar chevron / Linear's side panel. */
  #stage #panel .p-back {
    all: unset;
    cursor: pointer;
    font: inherit;
    color: inherit;
    font-size: 1.25em;
    line-height: 1;
    margin-right: 0.5em;
    vertical-align: -0.06em;
  }
  #stage #panel .p-back:hover { color: #ffffff; }
  /* `all: unset` above also unsets the user-agent focus ring, so the keyboard
     affordance has to be put back by hand - same outline the strip scroller
     uses. :focus-visible, not :focus, so a mouse click leaves no ring behind. */
  #stage #panel .p-back:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
    color: #ffffff;
  }

  /* The commit strip. A cell is ONE RECORD at a fixed size - a longer span
     widens the strip and scrolls; it never shrinks the cells below a
     clickable target. The scroller and its chrome exist only on overflow. */
  #stage #panel .p-strip-view { overflow: hidden; }
  #stage #panel .p-strip-view.is-scrollable {
    overflow-x: auto;
    overscroll-behavior-x: contain;
    padding-bottom: 7px;
    scrollbar-width: thin;
    scrollbar-color: rgba(210, 215, 225, 0.34) rgba(210, 215, 225, 0.10);
    -webkit-mask-image: linear-gradient(to right,
      transparent 0,
      #000 calc(18px * var(--fade-l, 0)),
      #000 calc(100% - 18px * var(--fade-r, 0)),
      transparent 100%);
  }
  /* The hairline that was already under the strip IS the scrollbar track, so
     overflow adds no new visual object to the card. */
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar { height: 3px; }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-track {
    background: rgba(210, 215, 225, 0.10);
    border-radius: 2px;
  }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-thumb {
    background: rgba(210, 215, 225, 0.34);
    border-radius: 2px;
  }
  #stage #panel .p-strip-view.is-scrollable::-webkit-scrollbar-thumb:hover {
    background: rgba(210, 215, 225, 0.55);
  }
  #stage #panel .p-strip-view.is-scrollable:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
  }
  #stage #panel .p-strip-grid {
    display: flex;
    align-items: flex-end;
    gap: 2px;
  }
  #stage #panel .p-strip-col {
    display: flex;
    flex-direction: column-reverse;
    gap: 2px;
    width: 22px;
    flex: none;
  }
  #stage #panel .p-strip-cell {
    width: 22px;
    height: 9px;
    border-radius: 1.5px;
    cursor: pointer;
  }
  /* The strip is one tab stop with arrow keys inside it, so the ring has to
     read at 22x9 - same outline as the scroller and the back chevron. */
  #stage #panel .p-strip-cell:focus-visible {
    outline: 1px solid rgba(159, 216, 255, 0.5);
    outline-offset: 2px;
  }
  #stage #panel .p-strip-empty {
    width: 22px;
    height: 1px;
    background: rgba(210, 215, 225, 0.10);
  }
  #stage #panel .p-strip-ends {
    display: flex;
    justify-content: space-between;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #83889a;
    margin-top: 6px;
  }
  #stage #panel .p-strip-span {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #7b808e;
    margin-top: 7px;
    padding-top: 6px;
    border-top: 1px solid rgba(210, 215, 225, 0.10);
  }
  #stage #panel .p-strip-legend {
    margin-top: 7px;
    font-size: 11px;
    color: #9aa0ad;
    line-height: 1.7;
  }
  #stage #panel .p-strip-legend span { margin-right: 11px; white-space: nowrap; }
  #stage #panel .p-strip-swatch {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 1.5px;
    margin-right: 5px;
  }
  #stage #panel .p-strip-hover {
    font-size: 11.5px;
    color: #aeb4c1;
    margin-top: 8px;
    height: 32px;
    line-height: 16px;
    overflow: hidden;
  }

  /* The insight layer: glass chips pinned to the frame edges, composed over
     the settled galaxy. The fill reads as a backdrop without paying for
     blur; the only glow a chip gets is one inset top highlight - never a
     drop-shadow, never a backdrop-filter. Entrance is opacity+transform
     only, and the 0.6s ride is deliberately shorter than the calm window
     the render loop grants after its last input, so the fade completes and
     true stillness still arrives. */
  #stage #cards {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #stage #cards.shown { opacity: 1; transform: translateY(0); }
  /* Chips accept the mouse only once revealed - the reveal itself fires at
     true rest, so this is the calm gate: hover can never catch the bloom. */
  #stage #cards.shown .card { pointer-events: auto; }
  #stage #cards.suppressed .card { pointer-events: none; }
  /* While the record panel owns the right edge, the insight layer bows out -
     the mark pass reads this same class to stop drawing marks. Declared
     after .shown so it wins when both classes are present. */
  #stage #cards.suppressed { opacity: 0; }
  /* Below desktop sizes the edge slots start eating the luminous core, so
     the layer disappears entirely rather than crowd the sky. */
  @media (max-width: 1099px), (max-height: 699px) {
    #stage #cards { display: none; }
  }
  #stage #cards .card {
    position: absolute;
    width: 300px;
    background: rgba(16,18,24,0.72);
    border-radius: 11px;
    padding: 13px 15px 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    border: 1px solid transparent; /* per-card evidence hue at 0.35 alpha, set inline */
    font-family: -apple-system, system-ui, 'Segoe UI', sans-serif;
    font-weight: 450;
    letter-spacing: 0em;
    font-optical-sizing: auto;
  }
  #stage #cards .card .c-eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 7px;
  }
  #stage #cards .card .c-eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  /* The date badge rides the eyebrow's far end - graph-derived from the
     quote-source node, never carried by the sidecar. */
  #stage #cards .card .c-eyebrow .c-date { margin-left: auto; font-size: 9.5px; letter-spacing: 0.1em; opacity: 0.75; }
  /* Right-pinned chips justify the machine-voice eyebrow to the frame edge;
     the prose below stays left-aligned unconditionally - a right-aligned
     body reads as a ragged left edge. */
  #stage #cards .card.pin-right .c-eyebrow { justify-content: flex-end; }
  #stage #cards .card .c-body {
    font-size: 14px;
    line-height: 1.5;
    color: #e8eaef;
    text-align: left;
    overflow-wrap: anywhere;
  }
  #stage #cards .card .c-witness {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #83889a;

  }

  }

    out.push({ source: s, target: t, kind: e.kind, pulsePhase: (i * 0.3719) % 1 });

  edges.forEach(e => {
    adj.get(e.source.id).push({ other: e.target, kind: e.kind, dir: 'out' });
    adj.get(e.target.id).push({ other: e.source, kind: e.kind, dir: 'in' });

class Camera {
  constructor() { this.scale = 1; this.x = 0; this.y = 0; }

const CARD_MIN_W = 1100, CARD_MIN_H = 700;
function cardsViewportOk() { return window.innerWidth >= CARD_MIN_W && window.innerHeight >= CARD_MIN_H; }
// window.NS and window.LT are page globals on purpose - the browser skill's
// evaluate_script reaches them directly to try alternate values live.
window.NS = window.NS || { cycleScale: 0.65 };
window.LT = window.LT || { degreeAlwaysOn: Infinity, hubZoom: 2.2, dustZoom: 4.6, ramp: 0.8 };

// Progressive label reveal: labelAlpha = f(camera.scale, nodeRadius). Bigger
// radius means a lower reveal threshold (arrives first); alpha ramps
// linearly over LABEL_RAMP zoom-units around that threshold, never a hard
// pop. Labels render at a constant screen size regardless of zoom.
const LABEL_HUB_ZOOM = 0.6;   // large nodes: basically always revealed
const LABEL_DUST_ZOOM = 3.4;  // smallest nodes: require real zoom-in
const LABEL_RAMP = 0.9;       // zoom-units over which alpha fades 0->1

// Appends one line of record text as text runs and inline elements, left to
// right, in order - the only shape that keeps the verbatim law: no character
// is added, reordered, or removed, and record text never passes through
// innerHTML. Backtick code wins first at any position, then double-marker
// bold, then single-marker emphasis; a matcher earlier in the alternation
// always takes an overlapping span before a later one gets the chance.
const INLINE_RUN_RE = /`([^`]+)`|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*]+)\*|_([^_]+)_/g;
function appendInlineRuns(el, line) {
  INLINE_RUN_RE.lastIndex = 0;
  let lastIndex = 0, m;
  while ((m = INLINE_RUN_RE.exec(line)) !== null) {
    if (m.index > lastIndex) el.appendChild(document.createTextNode(line.slice(lastIndex, m.index)));
    const node = document.createElement(m[1] !== undefined ? 'code' : (m[2] !== undefined || m[3] !== undefined) ? 'strong' : 'em');
    node.textContent = m[1] !== undefined ? m[1] : m[2] !== undefined ? m[2] : m[3] !== undefined ? m[3] : m[4] !== undefined ? m[4] : m[5];
    el.appendChild(node);
    lastIndex = INLINE_RUN_RE.lastIndex;
  }
  if (lastIndex < line.length) el.appendChild(document.createTextNode(line.slice(lastIndex)));
}

class GraphView {
  constructor(canvas, panel) {
    this.canvas = canvas;
    this.panel = panel;
    this.cardsEl = document.getElementById('cards');
    // .p-summary and .p-rels are static markup that persist across every
    // fill (fillPanel only ever writes into them), so the scroll listener
    // wires exactly once here rather than being re-attached per record.
    this._summaryFade = this.wireVerticalFade(this.panel.querySelector('.p-summary'));
    this._relsFade = this.wireVerticalFade(this.panel.querySelector('.p-rels'));
    this.cardsShown = false;
    this.cardsShownAt = 0;
    this.hoverCardIndex = -1;
    this.cardGlow = 0;
    this.calm = false;
    this.cardMeta = [];
    const { ctx, resize: resizeCanvas } = makeCanvasCtx(canvas);
    this.ctx = ctx;
    this._resizeCanvas = resizeCanvas;
    this.camera = new Camera();
    this.mouse = { x: -9999, y: -9999 };
    this.hoverNode = null;
    this.selectedNode = null;
    this.dragNode = null;
    this.dragCandidate = null;
    this.dragging = false;
    this.downScreen = null;
    this.panning = false;
    this.panStartScreen = null;
    this.panStartCam = null;
    this._labelWidthCache = new Map();
    // Both anchor on the first PAINTED frame (set inside tick), not here -
    // on a cold load the gap between this line and first paint can be large
    // enough to burn the entrance, or a whole clamped simulation step, dark.
    this.lastT = 0;
    this.entranceStart = 0;
    this.simT = 0;
    this.frameCount = 0;
    this.interactionActive = false;
    this.lastInputAt = 0;
    this.rafId = null;

    // Slow-bloom entrance: slower alpha decay + higher damping + lighter
    // gravity = tighter spawn, grander expansion, floatier ~5s settle.
    // Two decay profiles: the cinematic pair is for the entrance only. Applied
    // to a drag's residual energy it holds the O(n^2) pass + full glow overdraw
    // hot for ~5.5s per drag (measured), and overlapping drags never sleep - so
    // drag release switches to the snappy pair (~2s cool-down) and replay()
    // restores cinematic before each bloom.
    // DECAY_CINEMATIC mirrors the damping/alphaDecay in the Sim constructor
    // below (the locked-physics test pins that line verbatim).
    this.DECAY_CINEMATIC = { damping: 0.94, alphaDecay: 0.025 };
    this.DECAY_SNAPPY = { damping: 0.90, alphaDecay: 0.06 };
    this.sim = new Sim({ repulse: 60000, springK: 2.5, springLength: 110, damping: 0.94, gravity: 12, maxSpeed: 6000, alphaDecay: 0.025 });
    this.sim.nodes.forEach(n => this.shapeNode(n));
    // The single largest cluster anchor earns the brightest always-on glow -
    // a sky needs one point the eye lands on first.
    this.heroHub = null;
    for (const n of this.sim.nodes) {
      if (n.type === 'cycle' && (!this.heroHub || n.hw > this.heroHub.hw)) this.heroHub = n;
    }
    this.bakeAssets();
    this.attachInteraction();
    this.tick = this.tick.bind(this);
    this.resize();
    this.replay();
  }

  shapeNode(n) {
    n.shape = 'circle';
    const degree = this.sim.adj.get(n.id).length;
    n.degree = degree;
    const t = Math.sqrt(Math.min(degree, DEG_CAP) / DEG_CAP);
    n.hw = n.hh = (MIN_R + (MAX_R - MIN_R) * t) * (n.type === 'cycle' ? window.NS.cycleScale : 1);
    n.mass = 0.5 + t * 2.2;
    n.bucket = bucketFor(n.hw);
  }

  bakeAssets() {
    this.fill = {};
    this.hoverGlow = {};
    this.ambientGlow = {};
    // Rim colour is the node's own hue lifted +16 lightness (clamped), so it
    // needs the HSL triple, not the precomputed RGB. Ambient glow bakes at
    // 256px: it now stretches to the glow's full DIAMETER (2x its reach), and
    // a 100px bake would band at hero size.
    const bake = (key, hsl) => {
      const rgb = hsl2rgb(hsl[0], hsl[1], hsl[2]);
      const rim = hsl2rgb(hsl[0], hsl[1], Math.min(90, hsl[2] + 16));
      this.fill[key] = {};
      for (const b of SIZE_BUCKETS) this.fill[key][b.key] = bakeFlatCircle(rgb, b.bakeR, rim);
      this.hoverGlow[key] = bakeRadialGlow(rgb, 100);
      this.ambientGlow[key] = bakeAmbientGlow(rgb, 256);
    };
    for (const t in TYPE_HSL) bake(t, TYPE_HSL[t]);
    bake(FALLBACK_TYPE, FALLBACK_HSL);
  }

  // A record type this page has no hue for still resolves - to the baked
  // fallback sprite set - rather than throwing on the first draw frame.
  spriteFor(type, bucket) { return (this.fill[type] || this.fill[FALLBACK_TYPE])[bucket]; }
  ambientGlowFor(type) { return this.ambientGlow[type] || this.ambientGlow[FALLBACK_TYPE]; }
  glowFor(type) { return this.hoverGlow[type] || this.hoverGlow[FALLBACK_TYPE]; }

  // ---- the commit strip -------------------------------------------------
  // One cell = one record, at a FIXED size. A longer span makes the strip
  // wider (and scrollable); it never shrinks a cell below a clickable target.
  // The bucket unit is a calendar decision taken from the date strings before
  // anything is laid out - layout adapts to it and never overrules it.
  buildStrip(rels) {
    const CELL_W = 22, CELL_H = 9, GAP = 2;
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
    const host = el('div');

    const items = rels.map(r => r.other).filter(n => n.date).sort((a, b) => a.date.localeCompare(b.date));
    const undated = rels.length - items.length;
    if (!items.length) {
      const none = el('div', 'p-rel-item');
      none.textContent = rels.length + ' connection' + (rels.length === 1 ? '' : 's') + ', no dates recorded';
      host.appendChild(none);
      return host;
    }

    // Read the calendar straight off 'YYYY-MM-DD'. No average day-lengths:
    // an approximated month drifts off real month boundaries.
    const ymd = t => ({ y: +t.slice(0, 4), m: +t.slice(5, 7), d: +t.slice(8, 10) });
    const a = ymd(items[0].date), b = ymd(items[items.length - 1].date);
    const spanDays = Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000) + 1;
    const spanMonths = (b.y - a.y) * 12 + (b.m - a.m);
    const unit = spanDays <= 21 ? 'day' : spanMonths < 4 ? 'week' : spanMonths < 36 ? 'month' : 'year';

    const iso = dt => dt.toISOString().slice(0, 10);
    const monday = t => { const p = ymd(t); const dt = new Date(Date.UTC(p.y, p.m - 1, p.d)); dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7)); return iso(dt); };
    const keyOf = { day: t => t, week: monday, month: t => t.slice(0, 7), year: t => t.slice(0, 4) }[unit];
    const nextKey = {
      day:   k => { const p = ymd(k); return iso(new Date(Date.UTC(p.y, p.m - 1, p.d + 1))); },
      week:  k => { const p = ymd(k); return iso(new Date(Date.UTC(p.y, p.m - 1, p.d + 7))); },
      month: k => { const y = +k.slice(0, 4), m = +k.slice(5, 7); return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0'); },
      year:  k => String(+k + 1)
    }[unit];

    // Walk the calendar end to end so an idle week or month is a visible gap.
    const firstKey = keyOf(items[0].date), lastKey = keyOf(items[items.length - 1].date);
    const keys = [firstKey];
    for (let k = firstKey; k !== lastKey && keys.length < 4000; ) { k = nextKey(k); keys.push(k); }
    const slot = new Map(keys.map((k, i) => [k, i]));
    const cols = keys.map(() => []);
    items.forEach(n => { const i = slot.get(keyOf(n.date)); cols[i === undefined ? 0 : i].push(n); });

    const nCols = keys.length;
    const gridW = nCols * CELL_W + (nCols - 1) * GAP;
    const tallest = Math.max.apply(null, cols.map(c => c.length).concat([1]));

    const view = el('div', 'p-strip-view');
    const inner = el('div');
    inner.style.width = gridW + 'px';
    const grid = el('div', 'p-strip-grid');
    grid.style.height = (tallest * (CELL_H + GAP)) + 'px';

    const hover = el('div', 'p-strip-hover');
    // Cells are addressable by (column, row) so the key handler can walk the
    // grid. Row 0 is the bottom of a column - .p-strip-col is column-reverse.
    const colCells = [];
    cols.forEach((bucket, ci) => {
      const colEl = el('div', 'p-strip-col');
      const cells = [];
      bucket.forEach(n => {
        const cell = el('div', 'p-strip-cell');
        cell.style.background = fillFor(n);
        cell.title = n.label;
        // A div with a click handler is a pointer affordance and nothing else -
        // the browser synthesizes no keyboard activation for a roleless
        // element. Role plus a tab stop plus Enter/Space is the whole gap.
        cell.setAttribute('role', 'button');
        cell.setAttribute('aria-label', n.label);
        cell.tabIndex = -1;
        cell._node = n;
        cell._col = ci;
        cell._row = cells.length;
        cell.addEventListener('mouseenter', () => { hover.textContent = n.label; });
        cell.addEventListener('mouseleave', () => { hover.textContent = ''; });
        cell.addEventListener('focus', () => { hover.textContent = n.label; });
        cell.addEventListener('blur', () => { hover.textContent = ''; });
        cell.addEventListener('click', ev => { ev.stopPropagation(); this.goTo(n); });
        cells.push(cell);
        colEl.appendChild(cell);
      });
      colCells.push(cells);
      if (!bucket.length) colEl.appendChild(el('div', 'p-strip-empty'));
      grid.appendChild(colEl);
    });
    inner.appendChild(grid);

    // The endpoint dates ride inside the scroller with the bars, so the axis
    // never describes a window you are not looking at.
    const fmt = t => new Date(t + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const ends = el('div', 'p-strip-ends');
    ends.style.width = gridW + 'px';
    const from = el('span'); from.textContent = fmt(items[0].date); ends.appendChild(from);
    if (nCols > 1) { const to = el('span'); to.textContent = fmt(items[items.length - 1].date); ends.appendChild(to); }
    inner.appendChild(ends);
    view.appendChild(inner);
    host.appendChild(view);

    // Roving tabindex: the strip is ONE tab stop and the arrows walk it. A tab
    // stop per cell would put a thousand-record project's whole history in the
    // tab order, which is why this is not just tabIndex = 0 on every cell.
    const occupied = colCells.filter(c => c.length);
    if (occupied.length) {
      const firstCell = occupied[0][0];
      const lastCol = occupied[occupied.length - 1];
      const lastCell = lastCol[lastCol.length - 1];
      firstCell.tabIndex = 0;
      grid.setAttribute('role', 'group');
      grid.setAttribute('aria-label', 'Connected records, ' + items.length + ' dated, oldest first');

      // Nudge the scroller rather than scrollIntoView, which would also scroll
      // every ancestor. Paired with focus({preventScroll}) so the page is still.
      const keepInView = cell => {
        if (!view.classList.contains('is-scrollable')) return;
        const vr = view.getBoundingClientRect(), cr = cell.getBoundingClientRect();
        if (cr.left < vr.left) view.scrollLeft -= (vr.left - cr.left);
        else if (cr.right > vr.right) view.scrollLeft += (cr.right - vr.right);
      };
      const move = (from, to) => {
        if (!to || to === from) return;
        from.tabIndex = -1;
        to.tabIndex = 0;
        to.focus({ preventScroll: true });
        keepInView(to);
      };
      // Step to the nearest column that actually holds records, then clamp the
      // row - an idle week is a visible gap, and focus should skip over it.
      const stepCol = (ci, dir, row) => {
        for (let i = ci + dir; i >= 0 && i < colCells.length; i += dir) {
          if (colCells[i].length) return colCells[i][Math.min(row, colCells[i].length - 1)];
        }
        return null;
      };

      grid.addEventListener('keydown', ev => {
        const cell = ev.target;
        if (!cell || !cell.classList || !cell.classList.contains('p-strip-cell')) return;
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          ev.stopPropagation();
          this.goTo(cell._node);
          return;
        }
        const col = colCells[cell._col];
        let to = null;
        if (ev.key === 'ArrowUp') to = col[cell._row + 1];
        else if (ev.key === 'ArrowDown') to = col[cell._row - 1];
        else if (ev.key === 'ArrowRight') to = stepCol(cell._col, 1, cell._row);
        else if (ev.key === 'ArrowLeft') to = stepCol(cell._col, -1, cell._row);
        else if (ev.key === 'Home') to = firstCell;
        else if (ev.key === 'End') to = lastCell;
        else return;
        ev.preventDefault();
        ev.stopPropagation();
        move(cell, to);
      });
    }

    // Overflow chrome exists only when the strip actually overflows.
    const rail = this.panel.querySelector('.p-rels');
    if (gridW > (rail ? rail.clientWidth : gridW)) {
      view.classList.add('is-scrollable');
      view.tabIndex = 0;
      view.setAttribute('role', 'region');
      view.setAttribute('aria-label', 'Timeline, ' + nCols + ' ' + unit + (nCols === 1 ? '' : 's') + ', scrollable');
      const fades = () => {
        const max = view.scrollWidth - view.clientWidth;
        view.style.setProperty('--fade-l', view.scrollLeft > 1 ? '1' : '0');
        view.style.setProperty('--fade-r', view.scrollLeft < max - 1 ? '1' : '0');
      };
      view.addEventListener('scroll', fades, { passive: true });
      // Opened on the most recent end by fillPanel, once the strip is in the
      // document and has a measurable scrollWidth. Deliberately not deferred
      // to a frame: the render loop owns the only two rAF call sites.
      view.dataset.openAtEnd = '1';
      this._stripFades = fades;
    }

    // The span and the legend describe the whole record, not the visible
    // window, so they stay outside the scroller. The span is worded from the
    // columns actually drawn - there is no second unit ladder to drift.
    const span = el('div', 'p-strip-span');
    span.textContent = nCols + ' ' + unit + (nCols === 1 ? '' : 's') + (undated ? ' · ' + undated + ' undated' : '');
    host.appendChild(span);

    const counts = {};
    rels.forEach(r => { counts[r.other.type] = (counts[r.other.type] || 0) + 1; });
    const legend = el('div', 'p-strip-legend');
    Object.keys(counts).sort((x, y) => counts[y] - counts[x]).forEach(t => {
      const w = el('span');
      const sw = el('span', 'p-strip-swatch');
      sw.style.background = rgbCss(TYPE_RGB[t] || FALLBACK_RGB);
      w.appendChild(sw);
      w.appendChild(document.createTextNode(counts[t] + ' ' + typeCountWord(t, counts[t])));
      legend.appendChild(w);
    });
    host.appendChild(legend);
    host.appendChild(hover);
    return host;
  }

  fillPanel(n) {
    // The record's own hue is the panel's light source: the drop-cap and the
    // type word both read these custom properties, so setting them here once
    // reaches both without either needing to know the other exists.
    const hsl = TYPE_HSL[n.type] || FALLBACK_HSL;
    this.panel.style.setProperty('--h', hsl[0]);
    this.panel.style.setProperty('--s', hsl[1] + '%');
    this.panel.style.setProperty('--l', hsl[2] + '%');
    // The wipe restarts once per fill. Whether the panel was already open
    // decides the delay: closed->open keeps the stylesheet's 0.32s (sequel
    // to the panel's own slide-in), a switch plays with no delay at all.
    // fillPanel runs BEFORE setPanelVisible on the open path, so `.visible`
    // still reads the panel's PRIOR state here.
    const summaryEl = this.panel.querySelector('.p-summary');
    const wasOpen = this.panel.classList.contains('visible');
    summaryEl.style.animation = 'none';
    void summaryEl.offsetHeight;
    summaryEl.style.animation = '';
    // The animation shorthand reset above also clears any inline delay, so
    // this has to be assigned AFTER it - and on every fill, or a switch's
    // '0s' would leak into the next closed->open open.
    summaryEl.style.animationDelay = wasOpen ? '0s' : '';
    const fmtDate = d => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
    // A dial's status slot holds a session outcome rather than a status -
    // its own vocabulary axis, worded from a different table.
    const statusWords = n.type === 'dial' ? VOCAB.dial_outcomes : VOCAB.statuses;
    const typeEl = this.panel.querySelector('.p-type');
    typeEl.textContent = '';
    // Each bit is its own span so the line can tier its colours; the ' · '
    // separators stay bare text nodes in the line's own colour.
    const typeBit = (text, cls) => {
      if (typeEl.childNodes.length) typeEl.appendChild(document.createTextNode(' · '));
      if (!cls) { typeEl.appendChild(document.createTextNode(text)); return; }
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      typeEl.appendChild(span);
    };
    typeBit(VOCAB.types[n.type] || n.type, 'p-type-name');
    if (n.status) typeBit(statusWords[n.status] || n.status, 'p-type-status');
    if (n.date) typeBit(fmtDate(n.date), 'p-type-date');
    // Back is a prefix character on the line that already says where you are,
    // shown only when there is a card behind this one. No container, no label.
    if (this.trail && this.trail.length) {
      const back = document.createElement('button');
      back.className = 'p-back';
      back.textContent = '\u2039';
      back.setAttribute('aria-label', 'Back');
      back.addEventListener('click', ev => { ev.stopPropagation(); this.goBack(); });
      typeEl.insertBefore(back, typeEl.firstChild);
    }
    this.panel.querySelector('.p-title').textContent = n.label;
    this.panel.querySelector('.p-meta').textContent = n.degree + ' connection' + (n.degree === 1 ? '' : 's');
    // The summary paints instantly; the record's full source replaces it the
    // moment its mirror arrives. No control, no second state - the spark is
    // always the whole record, scrolling inside its own window. Both paints
    // route through the same parse, so the record is never pasted as raw
    // text - only ever written into elements.
    this.renderRecord(summaryEl, n.type, n.summary, n.label);
    // An empty record has nothing to light, so the whole well hides rather
    // than leaving a lit, empty box sitting on the card.
    this.panel.querySelector('.p-summary-well').style.display = n.summary ? '' : 'none';
    summaryEl.scrollTop = 0;
    if (n.summary) this.loadRecordText(n.id, text => {
      // The panel may already show another record by the time the mirror
      // arrives - never write into someone else's spark.
      if (this.selectedNode !== n) return;
      const full = text == null ? null : this.sourceSection(n.type, text);
      if (full != null) this.renderRecord(summaryEl, n.type, full, n.label);
    });
    const relsEl = this.panel.querySelector('.p-rels');
    relsEl.innerHTML = '';
    if (n.chunks && n.chunks.list && n.chunks.list.length) {
      // The work is collapsible - Connections is not, so only this label
      // gets the toggle class and its own click listener. Rebuilt on every
      // fill, so the listener wires fresh here rather than delegating - no
      // handler stacking to guard against.
      const h = document.createElement('div');
      h.className = 'p-rel-label chunks-toggle';
      const disclosure = document.createElement('span');
      disclosure.className = 'disclosure';
      disclosure.textContent = '▸';
      h.appendChild(disclosure);
      h.appendChild(document.createTextNode(' The work (' + n.chunks.complete + '/' + n.chunks.total + ' done)'));
      relsEl.appendChild(h);
      const list = document.createElement('div');
      list.className = 'p-chunk-list is-collapsed';
      n.chunks.list.forEach(c => {
        const row = document.createElement('div');
        row.className = 'p-chunk' + (c.status === 'complete' ? ' is-complete' : '');
        const dot = document.createElement('span');
        dot.className = 'p-chunk-dot' + (c.status === 'complete' || c.status === 'active' ? ' is-' + c.status : '');
        const title = document.createElement('span');
        title.className = 'p-chunk-title';
        title.textContent = c.title || '';
        row.appendChild(dot);
        row.appendChild(title);
        list.appendChild(row);
      });
      relsEl.appendChild(list);
      h.addEventListener('click', () => {
        const collapsed = list.classList.toggle('is-collapsed');
        disclosure.textContent = collapsed ? '▸' : '▾';
      });
    }
    const rels = this.sim.adj.get(n.id);
    if (rels.length) {
      const label = document.createElement('div'); label.className = 'p-rel-label'; label.textContent = 'Connections'; relsEl.appendChild(label);
      relsEl.appendChild(this.buildStrip(rels));
      const view = relsEl.querySelector('.p-strip-view[data-open-at-end]');
      if (view) { view.scrollLeft = view.scrollWidth; if (this._stripFades) this._stripFades(); }
    }
    // Both fades measure synchronously, the same idiom the strip's own fade
    // already uses here - never deferred to a frame.
    if (this._summaryFade) this._summaryFade();
    if (this._relsFade) this._relsFade();
  }

  // Turns a record's raw text into elements - never a rewrite, only a
  // client-side span-wrapping parse. A cycle's body is YAML (the registry's
  // only type pointed at a .yaml file); every other type is prose.
  renderRecord(el, type, text, title) {
    el.textContent = '';
    if (type === 'cycle') {
      this.renderYamlFields(el, text);
    } else {
      this.renderProse(el, text, title);
    }
  }

  // Blocks split on blank lines; a block opening with an ATX marker becomes
  // a heading, everything else a paragraph. Single newlines inside a block
  // carry meaning (the well's own comment promises it), so they survive as
  // <br> rather than being swallowed by the block split. Inline markers are
  // consumed the same way, never left as visible clutter in the reading well.
  renderProse(el, text, title) {
    const raw = String(text == null ? '' : text).replace(/\r\n/g, '\n').trim();
    if (!raw) return;
    const blocks = raw.split(/\n[ \t]*\n+/).filter(b => b.trim() !== '');
    const headingRe = /^(#{1,6})\s+(.*)$/;
    blocks.forEach((block, i) => {
      const lines = block.split('\n');
      const m = headingRe.exec(lines[0]);
      let node, textLines;
      if (m) {
        // A record's own leading H1 (a riff's own title line, say) duplicates
        // the panel's title directly above it - skip only that exact case,
        // and only at the very top, never a heading deeper in the body.
        if (i === 0 && m[1].length === 1 && m[2].trim() === String(title == null ? '' : title).trim()) return;
        node = document.createElement('h2');
        textLines = [m[2]].concat(lines.slice(1));
      } else {
        node = document.createElement('p');
        textLines = lines;
      }
      textLines.forEach((line, li) => {
        if (li > 0) node.appendChild(document.createElement('br'));
        appendInlineRuns(node, line);
      });
      el.appendChild(node);
    });
  }

  // A cycle record's body is a bare YAML file (no frontmatter fence to
  // strip), so it renders as key/value fields rather than prose. Keys the
  // panel chrome already shows are omitted mechanically - a fixed list,
  // never a per-key judgment.
  renderYamlFields(el, text) {
    const OMIT_KEYS = { name: true, title: true, status: true, created: true, updated: true };
    const keyRe = /^([A-Za-z_][A-Za-z0-9_-]*):[ \t]*(.*)$/;
    const listRe = /^\s*-\s?(.*)$/;
    const fields = [];
    let field = null;
    String(text == null ? '' : text).replace(/\r\n/g, '\n').split('\n').forEach(line => {
      const km = keyRe.exec(line);
      if (km) {
        field = { key: km[1], values: [] };
        fields.push(field);
        const inline = km[2].trim();
        if (inline) field.values.push({ text: inline, isList: false });
        return;
      }
      if (!line.trim() || !field) return;
      const lm = listRe.exec(line);
      field.values.push(lm ? { text: lm[1], isList: true } : { text: line.trim(), isList: false });
    });
    fields.forEach(f => {
      if (OMIT_KEYS[f.key]) return;
      const fieldEl = document.createElement('div');
      fieldEl.className = 'yaml-field';
      const keyEl = document.createElement('div');
      keyEl.className = 'yaml-key';
      keyEl.textContent = f.key;
      fieldEl.appendChild(keyEl);
      f.values.forEach(v => {
        const valEl = document.createElement('div');
        valEl.className = 'yaml-val';
        if (v.isList) {
          const marker = document.createElement('span');
          marker.className = 'yaml-list-marker';
          marker.textContent = '-';
          valEl.appendChild(marker);
        }
        valEl.appendChild(document.createTextNode(v.text));
        fieldEl.appendChild(valEl);
      });
      el.appendChild(fieldEl);
    });
  }

  // The full text behind the card's summary line: each record type names
  // the section its summary was drawn from; a type with no such heading
  // reads as its whole body after the frontmatter.
  sourceSection(type, text) {
    const body = String(text).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
    const titles = { story: 'Spark', fix: 'Symptom', tweak: 'Request', mockup: 'Brief' };
    const wanted = titles[type];
    if (!wanted) return body.trim() || null;
    const lines = body.split('\n');
    const out = [];
    let inside = false;
    for (const line of lines) {
      if (/^## /.test(line)) {
        if (inside) break;
        inside = line.slice(3).trim() === wanted;
        continue;
      }
      if (inside) out.push(line);
    }
    const section = out.join('\n').trim();
    return section || null;
  }

  // On-demand record mirror load through a sibling script tag - the only
  // load path that works from file:// (see the top-of-page note). Each
  // mirror registers itself on window.CRAFT_RECORDS; a mirror already
  // registered is never requested twice.
  loadRecordText(id, cb) {
    const have = window.CRAFT_RECORDS && window.CRAFT_RECORDS[id];
    if (have != null) { cb(have); return; }
    // One in-flight tag per id: rapid re-clicks while the mirror is still
    // arriving queue their callbacks instead of appending duplicate tags.
    this._mirrorWaiters = this._mirrorWaiters || {};
    if (this._mirrorWaiters[id]) { this._mirrorWaiters[id].push(cb); return; }
    this._mirrorWaiters[id] = [cb];
    const settle = () => {
      const records = window.CRAFT_RECORDS || {};
      const text = records[id] != null ? records[id] : null;
      const waiters = this._mirrorWaiters[id] || [];
      delete this._mirrorWaiters[id];
      waiters.forEach(fn => fn(text));
    };
    const tag = document.createElement('script');
    tag.src = 'graph/records/' + id + '.js';
    tag.onload = settle;
    tag.onerror = settle;
    document.head.appendChild(tag);
  }

  resize() {
    this._resizeCanvas();
    this.sim.resizeHome(window.innerWidth, window.innerHeight);
    this.camera.x = window.innerWidth / 2;
    this.camera.y = window.innerHeight / 2;
    this.bg = bakeBackground(window.innerWidth, window.innerHeight);
    this.requestRender();
  }

  // Travel between records from inside the card. Pushing happens only on an
  // in-card click; a canvas click clears the trail (see the mouseup handler).
  goTo(node) {
    if (this.selectedNode) (this.trail = this.trail || []).push(this.selectedNode);
    this.selectedNode = node;
    this.fillPanel(node);
    this.requestRender();
  }

  goBack() {
    const prev = (this.trail || []).pop();
    if (!prev) return;
    this.selectedNode = prev;
    this.fillPanel(prev);
    this.requestRender();
  }

  // ---- the insight layer -----------------------------------------------
  // Content and evidence come from the sidecar; geometry and chrome are the
  // page's. Evidence ids resolve against the live graph - an id that no
  // longer resolves loses only its marks, never the card: the wit survives,
  // the pointer goes quiet.
  resolveInsightCards() {
    if (!INSIGHTS) return [];
    return INSIGHTS.cards.filter(c => c && typeof c === 'object').slice(0, 4).map(c => {
      const ids = Array.isArray(c.evidence_node_ids) ? c.evidence_node_ids : [];
      const nodes = ids
        .map(id => this.sim.idx.has(id) ? this.sim.nodes[this.sim.idx.get(id)] : null)
        .filter(Boolean);
      return { body: String(c.body || ''), witness: String(c.witness || ''), nodes };
    }).filter(c => c.body);
  }

  // Hue is derived from the live type of the first RESOLVING evidence node,
  // never asserted by the sidecar - the chip's chrome IS its citation, so it
  // cannot cite a type the graph disagrees with. No surviving evidence takes
  // the same neutral fallback an unknown node type does.
  cardHsl(card) {
    return (card.nodes.length && TYPE_HSL[card.nodes[0].type]) || FALLBACK_HSL;
  }

  buildCards(cards) {
    const w = window.innerWidth, h = window.innerHeight;
    this.cardsEl.innerHTML = '';
    this.cardMeta = [];
    const free = CARD_SLOTS.map((s, i) => i);
    cards.forEach((card, ci) => {
      // Evidence centroid in screen space - the same projection expression
      // the label pass uses, so there is exactly one mapping to drift.
      let cx = w / 2, cy = h / 2;
      if (card.nodes.length) {
        let sx = 0, sy = 0;
        for (const n of card.nodes) {
          sx += (n.x - this.camera.x) * this.camera.scale + w / 2;
          sy += (n.y - this.camera.y) * this.camera.scale + h / 2;
        }
        cx = sx / card.nodes.length; cy = sy / card.nodes.length;
      }
      // Greedy nearest free slot, so each chip sits closest to its own
      // evidence.
      let best = free[0], bestD = Infinity;
      for (const i of free) {
        const s = CARD_SLOTS[i];
        const px = s.side === 'left' ? s.x * w : w - s.x * w;
        const d = Math.hypot(px - cx, s.y * h - cy);
        if (d < bestD) { bestD = d; best = i; }
      }
      free.splice(free.indexOf(best), 1);
      const slot = CARD_SLOTS[best];
      const hsl = this.cardHsl(card);
      const el = document.createElement('div');
      el.className = 'card' + (slot.side === 'right' ? ' pin-right' : '');
      el.style[slot.side] = (slot.x * 100) + '%';
      el.style.top = (slot.y * 100) + '%';
      el.style.borderColor = `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,0.35)`;
      const eyebrow = document.createElement('div');
      eyebrow.className = 'c-eyebrow';
      eyebrow.style.color = `hsl(${hsl[0]},${hsl[1]}%,${Math.min(90, hsl[2] + 10)}%)`;
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = `hsl(${hsl[0]},${hsl[1]}%,${hsl[2]}%)`;
      const obs = document.createTextNode('Observation ' + String(ci + 1).padStart(2, '0'));
      // The dot sits at the frame-facing edge: before the text on a
      // left-pinned chip, after it on a right-pinned one.
      if (slot.side === 'right') { eyebrow.appendChild(obs); eyebrow.appendChild(dot); }
      else { eyebrow.appendChild(dot); eyebrow.appendChild(obs); }
      // The quote-source node's date closes the row on every chip - the
      // auto margin owns the far end regardless of pin side.
      const src = card.nodes[0];
      if (src && src.date) {
        const parts = String(src.date).split('-');
        const month = CARD_MONTHS[(+parts[1] || 1) - 1];
        if (month && parts[2]) {
          const dateEl = document.createElement('span');
          dateEl.className = 'c-date';
          dateEl.textContent = month + ' ' + (+parts[2]);
          eyebrow.appendChild(dateEl);
        }
      }
      el.appendChild(eyebrow);
      const body = document.createElement('div');
      body.className = 'c-body';
      body.textContent = card.body;
      el.appendChild(body);
      if (card.witness) {
        const witness = document.createElement('div');
        witness.className = 'c-witness';
        witness.textContent = 'witnessed by ' + card.witness;
        el.appendChild(witness);
      }
      // Hover is the chip's only pointer verb: it warms the quote-source
      // node across the sky (see the mark pass) and nothing else.
      el.addEventListener('mouseenter', () => { this.hoverCardIndex = ci; this.requestRender(); });
      el.addEventListener('mouseleave', () => { if (this.hoverCardIndex === ci) this.hoverCardIndex = -1; this.requestRender(); });
      this.cardsEl.appendChild(el);
      // Height is measured once here - the chip never changes size, so the
      // per-frame mark pass can anchor without touching layout again.
      this.cardMeta.push({ card, slot, hsl, el, h: el.offsetHeight });
    });
  }

  // Fires from the render loop once CARD_REVEAL_DELAY_MS has elapsed since
  // the first painted frame - a fixed load delay, independent of the physics.
  // The requestFrame kicks the fade's first frame; the mark fade keeps the
  // loop alive until it completes, and stillness then returns.
  revealCards() {
    // The viewport bail precedes the latch: a settle below the size floor
    // leaves the reveal armed, so enlarging the window fires it on the next
    // rest frame instead of never.
    if (!this.cardsEl || !cardsViewportOk()) return;
    this.cardsShown = true;
    const cards = this.resolveInsightCards();
    if (!cards.length) return;
    this.buildCards(cards);
    this.cardsShownAt = performance.now();
    void this.cardsEl.offsetWidth; // commit resting styles so the class toggle transitions
    this.cardsEl.classList.add('shown');
    this.requestFrame();
  }

  // One seam for the record panel's visibility, so the insight layer bows
  // out and returns in the same breath - the composed frame never holds two
  // competing focus objects on the right edge.
  setPanelVisible(on) {
    if (this.panel) this.panel.classList.toggle('visible', on);
    if (this.cardsEl) this.cardsEl.classList.toggle('suppressed', on);
  }

  // Toggles at-top/at-bottom classes rather than a shared calc()-driven
  // custom property - a custom property shared across elements under one CSS
  // rule produced a hard, gapless cut on at least one box instead of a
  // gradient (mockup finding, root cause not fully isolated). Classes
  // sidestep the whole failure class: each rule is a static declaration with
  // nothing to miscompute. Wired once per element (they persist across every
  // fill); returns the updater so a fill can re-run it synchronously.
  wireVerticalFade(el) {
    if (!el) return null;
    const update = () => {
      const max = el.scrollHeight - el.clientHeight;
      el.classList.toggle('at-top', el.scrollTop <= 1);
      el.classList.toggle('at-bottom', el.scrollTop >= max - 1);
    };
    el.addEventListener('scroll', update, { passive: true });
    update();
    return update;
  }

  replay() {
    const w = window.innerWidth, h = window.innerHeight;
    this.sim.resizeHome(w, h);
    seedCompactCloud(this.sim.nodes, w / 2, h / 2, 0.06);
    // A drag may have left the sim on the snappy cool-down profile; the
    // entrance always blooms on the cinematic one.
    this.sim.opts.damping = this.DECAY_CINEMATIC.damping;
    this.sim.alphaDecay = this.DECAY_CINEMATIC.alphaDecay;
    this.sim.alpha = 1;
    this.sim.alphaTarget = 0;
    this.selectedNode = null;
    this.hoverNode = null;
    this.dragNode = null;
    this.dragCandidate = null;
    this.setPanelVisible(false);
    // Clearing cardsShown re-arms the reveal, so the whole choreography -
    // bloom, settle, card entrance - runs again from the top. The hover
    // calm latch re-arms with it, so hover goes quiet for the re-run too.
    this.cardsShown = false;
    this.cardsShownAt = 0;
    this.hoverCardIndex = -1;
    this.cardGlow = 0;
    this.calm = false;
    this.cardMeta = [];
    if (this.cardsEl) { this.cardsEl.classList.remove('shown'); this.cardsEl.innerHTML = ''; }
    this.entranceStart = 0;
    this.requestRender();
  }

  attachInteraction() {
    const canvas = this.canvas;
    canvas.addEventListener('mousedown', (ev) => {
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      const wp = this.camera.toWorld(ev.clientX, ev.clientY, w, h);
      this.dragCandidate = hitTestNode(this.sim.nodes, wp.x, wp.y);
      this.downScreen = { x: ev.clientX, y: ev.clientY };
      this.dragging = false;
      this.panning = false;
      if (!this.dragCandidate) {
        this.panStartScreen = { x: ev.clientX, y: ev.clientY };
        this.panStartCam = { x: this.camera.x, y: this.camera.y };
      }
    });
    canvas.addEventListener('mousemove', (ev) => {
      // Unconditional: with a stopped loop, hover state can change on any
      // move, and detecting "did it actually change" costs more than a
      // spare frame request does.
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      this.mouse.x = ev.clientX; this.mouse.y = ev.clientY;
      const wp = this.camera.toWorld(ev.clientX, ev.clientY, w, h);
      if (this.dragCandidate) {
        if (!this.dragging) {
          const dx = ev.clientX - this.downScreen.x, dy = ev.clientY - this.downScreen.y;
          if (Math.hypot(dx, dy) > 4) {
            this.dragging = true;
            this.dragNode = this.dragCandidate;
            this.dragNode.fx = this.dragNode.x; this.dragNode.fy = this.dragNode.y;
            this.sim.alphaTarget = 0.3;
            this.sim.alpha = Math.max(this.sim.alpha, 0.4);
          }
        }
        if (this.dragging && this.dragNode) { this.dragNode.fx = wp.x; this.dragNode.fy = wp.y; }
      } else if (this.panStartScreen) {
        // Background drag-to-pan - 1:1 with the cursor, no inertia, sharing
        // the same camera.x/y the wheel-zoom reads/writes so the two compose.
        const dx = ev.clientX - this.panStartScreen.x, dy = ev.clientY - this.panStartScreen.y;
        if (!this.panning && Math.hypot(dx, dy) > 3) {
          this.panning = true;
          canvas.style.cursor = 'grabbing';
        }
        if (this.panning) {
          this.camera.x = this.panStartCam.x - dx / this.camera.scale;
          this.camera.y = this.panStartCam.y - dy / this.camera.scale;
        }
      } else {
        // Hover stays quiet while nodes are still flying - the gate lifts
        // once motion calms into the final drift (see the tick loop's
        // HOVER_CALM_MS latch), and Replay re-arms it.
        this.hoverNode = this.calm ? hitTestNode(this.sim.nodes, wp.x, wp.y) : null;
        canvas.style.cursor = this.hoverNode ? 'pointer' : 'default';
      }
    });
    const release = () => {
      this.requestRender();
      if (this.dragging && this.dragNode) {
        this.dragNode.fx = null; this.dragNode.fy = null;
        this.sim.alphaTarget = 0;
        // Post-drag cool-down runs on the snappy profile: the cinematic decay
        // is an entrance treatment, not a price every drag should pay.
        this.sim.opts.damping = this.DECAY_SNAPPY.damping;
        this.sim.alphaDecay = this.DECAY_SNAPPY.alphaDecay;
      } else if (this.panning) {
        // pan release - camera state just stays where it is, nothing to undo
      } else if (this.dragCandidate) {
        const hit = this.dragCandidate;
        this.selectedNode = (hit === this.selectedNode) ? null : hit;
        // A canvas click is a jump to somewhere new, not a step along a path,
        // so it starts the card's back-trail over rather than extending it.
        this.trail = [];
        if (this.selectedNode) this.fillPanel(this.selectedNode);
        this.setPanelVisible(!!this.selectedNode);
      } else if (this.panel && this.panStartScreen) {
        // a real empty-space click (never moved past the pan threshold) = deselect
        this.selectedNode = null;
        this.setPanelVisible(false);
      }
      this.dragCandidate = null; this.dragging = false; this.dragNode = null;
      this.panStartScreen = null; this.panStartCam = null;
      if (this.panning) { this.panning = false; canvas.style.cursor = 'default'; }
    };
    // Listen on window, not just canvas: a pan or drag that ends with the
    // cursor released outside the canvas must still clear cleanly.
    window.addEventListener('mouseup', release);
    canvas.addEventListener('mouseleave', () => { this.requestRender(); this.mouse.x = -9999; this.mouse.y = -9999; this.hoverNode = null; });
    canvas.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      // Proportional zoom: scale follows actual scroll distance, so trackpad
      // streams accumulate gently. deltaMode 1 = line-scroll mice; ctrlKey = pinch.
      const px = ev.deltaY * (ev.deltaMode === 1 ? 50 : 1);
      const factor = Math.pow(2, -px * (ev.ctrlKey ? 0.02 : 0.002));
      this.camera.zoomAt(ev.clientX, ev.clientY, w, h, factor);
    }, { passive: false });
  }

  draw() {
    const ctx = this.ctx, sim = this.sim, w = window.innerWidth, h = window.innerHeight;
    ctx.drawImage(this.bg, 0, 0, w, h);
    const ea = entranceGlobalAlpha(this.entranceStart);
    ctx.save();
    ctx.translate(w / 2, h / 2); ctx.scale(this.camera.scale, this.camera.scale); ctx.translate(-this.camera.x, -this.camera.y);

    const active = this.selectedNode || this.hoverNode;
    const connectedIds = active ? new Set(sim.adj.get(active.id).map(e => e.other.id)) : null;

    // Label candidates are gathered here (screen position projected under
    // the world transform) but drawn in a separate screen-space pass below,
    // so label text stays a constant size at every zoom level.
    const labelCandidates = [];
    for (const n of sim.nodes) {
      const alwaysOn = n === active || n === this.dragNode || n.degree >= window.LT.degreeAlwaysOn;
      let alpha = 1;
      if (!alwaysOn) {
        const t = (n.hw - MIN_R) / (MAX_R - MIN_R);
        const threshold = lerp(window.LT.dustZoom, window.LT.hubZoom, t);
        alpha = clamp((this.camera.scale - (threshold - window.LT.ramp)) / window.LT.ramp, 0, 1);
        if (alpha <= 0.01) continue; // not a candidate at all this frame
      }
      const sx = (n.x - this.camera.x) * this.camera.scale + w / 2;
      const sy = (n.y - this.camera.y) * this.camera.scale + h / 2;
      if (sx < -80 || sx > w + 80 || sy < -60 || sy > h + 60) continue; // off-screen
      labelCandidates.push({ n, alwaysOn, alpha, sx, sy });
    }
    // Always-on first, then most prominent (bigger radius) first.
    labelCandidates.sort((a, b) => (b.alwaysOn - a.alwaysOn) || (b.n.hw - a.n.hw));

    // Ambient hairline reach: the resting mesh (no node under the pointer or
    // selected) reads as a quiet constellation instead of a flat wireframe -
    // nearby links carry more of the line, distant ones settle to a floor
    // rather than vanish, so no real connection goes fully invisible.
    const meshReach = w * MESH_REACH_TO_W;
    for (const e of sim.edges) {
      const isConn = !!(active && (e.source.id === active.id || e.target.id === active.id));
      ctx.beginPath(); ctx.moveTo(e.source.x, e.source.y); ctx.lineTo(e.target.x, e.target.y);
      if (isConn) {
        ctx.strokeStyle = 'rgba(220,225,235,0.6)';
        ctx.lineWidth = 1.6;
      } else if (active) {
        ctx.strokeStyle = 'rgba(190,195,205,0.04)';
        ctx.lineWidth = 1;
      } else {
        const d = Math.hypot(e.source.x - e.target.x, e.source.y - e.target.y);
        const near = 1 - Math.min(d / meshReach, 1);
        ctx.strokeStyle = `rgba(190,195,205,${MESH_ALPHA_FLOOR + near * (MESH_ALPHA_NEAR - MESH_ALPHA_FLOOR)})`;
        ctx.lineWidth = 1;
      }
      ctx.globalAlpha = ea;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Depth: fill alpha eases off with distance from the sky's brightest
    // anchor, so the composition reads as a core with a fading field around
    // it instead of a flat scatter of equally-weighted dots.
    const depthOrigin = this.heroHub || { x: 0, y: 0 };
    const depthReach = w * DEPTH_REACH_TO_W;

    for (const n of sim.nodes) {
      const dim = active && n !== active && !(connectedIds && connectedIds.has(n.id)) ? 0.3 : 1;
      const isActive = n === active;
      // Glow ratios are the gradient's outer RADIUS in node-radii (the mockup's
      // glow(x, y, r * 4.2) contract), so the sprite is drawn at 2x that reach
      // for its width. Compositing is plain source-over with the glow UNDER the
      // fill - per tokens.yaml hero.fill, the luminous read is emergent, "never
      // a lighter paint"; additive blending is what made these read neon-tight
      // instead of atmospheric.
      if (isActive) {
        const gs = n.hw * 4.4 * 2;
        ctx.globalAlpha = 0.7 * ea;
        ctx.drawImage(this.glowFor(n.type), n.x - gs / 2, n.y - gs / 2, gs, gs);
      } else {
        // Always-on ambient glow: the hero hub, and any rare riff/dial node,
        // burn bright; other large cycle hubs get a much quieter halo. Every
        // other node stays glow-free so the effect reads as rare, not busy.
        let glowRatio = 0, glowAlpha = 0;
        if (n === this.heroHub) { glowRatio = GLOW_ACCENT_TO_R; glowAlpha = GLOW_ACCENT_HERO_ALPHA; }
        else if (n.type === 'riff' || n.type === 'dial') { glowRatio = GLOW_ACCENT_TO_R; glowAlpha = GLOW_ACCENT_RARE_ALPHA; }
        else if (n.type === 'cycle' && (n.bucket === 'medium' || n.bucket === 'hub')) { glowRatio = GLOW_HUB_QUIET_TO_R; glowAlpha = GLOW_HUB_QUIET_ALPHA; }
        if (glowRatio) {
          const gs = n.hw * glowRatio * 2;
          ctx.globalAlpha = glowAlpha * ea;
          ctx.drawImage(this.ambientGlowFor(n.type), n.x - gs / 2, n.y - gs / 2, gs, gs);
        }
      }
      const dist = Math.hypot(n.x - depthOrigin.x, n.y - depthOrigin.y);
      const depthAlpha = Math.max(DEPTH_ALPHA_FLOOR, 1 - Math.min(dist / depthReach, 1) * (1 - DEPTH_ALPHA_FLOOR));
      ctx.globalAlpha = dim * ea * depthAlpha;
      const d2 = n.hw * 2;
      ctx.drawImage(this.spriteFor(n.type, n.bucket), n.x - n.hw, n.y - n.hh, d2, d2);
      ctx.globalAlpha = 1;
    }
    ctx.restore(); // back to screen space - DPR-scaled, no camera transform

    // Provenance marks: a thin standoff ring around each chip's QUOTE-SOURCE
    // node - the first evidence entry, whose order the sidecar contract makes
    // normative (it already keys the witness; here it keys the ring, the
    // hover warmth, and the eyebrow date). No leader lines: the connection
    // is the hover - resting the mouse on a chip warms its node across the
    // sky, and the warmth breathes out again on leave. Every 1px hue stroke
    // rides a 3px dark casing on the same path - the label-halo idiom - and
    // positions recompute from live node state every frame, so a mark never
    // drifts during pan or zoom. Evidence that stopped resolving simply
    // draws nothing: the chip stays, the pointer goes quiet.
    if (this.cardsShown && this.cardMeta.length && cardsViewportOk() &&
        this.cardsEl && !this.cardsEl.classList.contains('suppressed')) {
      const markAlpha = clamp((performance.now() - this.cardsShownAt) / CARD_FADE_MS, 0, 1);
      // The mark fade schedules its own frames until complete - internal
      // animation, not input.
      if (markAlpha < 1) this.requestFrame();
      if (markAlpha > 0) {
        // The warmth eases toward its target each frame; while it is still
        // travelling, keep the loop alive so the breath completes.
        const glowTarget = this.hoverCardIndex >= 0 ? 1 : 0;
        this.cardGlow += (glowTarget - this.cardGlow) * CARD_GLOW_EASE;
        if (Math.abs(glowTarget - this.cardGlow) > 0.01) this.requestFrame();
        else this.cardGlow = glowTarget;
        ctx.save();
        ctx.globalAlpha = markAlpha;
        const CASING = 'rgba(8,9,12,0.65)';
        for (let mi = 0; mi < this.cardMeta.length; mi++) {
          const meta = this.cardMeta[mi];
          const evidence = meta.card.nodes;
          if (!evidence.length) continue;
          const src = evidence[0];
          const nx = Math.round((src.x - this.camera.x) * this.camera.scale + w / 2);
          const ny = Math.round((src.y - this.camera.y) * this.camera.scale + h / 2);
          const r = Math.round(Math.max(12, src.hw * this.camera.scale * 1.35 + 6));
          const g = this.hoverCardIndex === mi ? this.cardGlow : 0;
          // Hover warmth: a soft radial bloom under the ring, in the chip's
          // own hue - drawn first so the cased ring stays crisp above it.
          if (g > 0.01) {
            const glowR = r * 2.8;
            const grad = ctx.createRadialGradient(nx, ny, r * 0.3, nx, ny, glowR);
            grad.addColorStop(0, `hsla(${meta.hsl[0]},${meta.hsl[1]}%,${Math.min(85, meta.hsl[2] + 15)}%,${0.4 * g})`);
            grad.addColorStop(1, `hsla(${meta.hsl[0]},${meta.hsl[1]}%,${meta.hsl[2]}%,0)`);
            ctx.beginPath(); ctx.arc(nx, ny, glowR, 0, TAU);
            ctx.fillStyle = grad; ctx.fill();
          }
          // Reticle: casing first, hue second, same path. The hue stroke
          // thickens and brightens with the hover warmth.
          ctx.beginPath(); ctx.arc(nx, ny, r, 0, TAU);
          ctx.lineWidth = 3; ctx.strokeStyle = CASING; ctx.stroke();
          ctx.beginPath(); ctx.arc(nx, ny, r, 0, TAU);
          ctx.lineWidth = 1 + g * 0.8;
          ctx.strokeStyle = `hsla(${meta.hsl[0]},${meta.hsl[1]}%,${Math.min(85, meta.hsl[2] + g * 12)}%,${0.55 + g * 0.35})`;
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    // Screen-space label pass - constant 11px size at every zoom. Suppression
    // uses each candidate's real measured text bounds against an AABB of
    // already-placed higher-priority labels, not a fixed grid.
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const placed = [];
    for (const cand of labelCandidates) {
      const n = cand.n;
      let tw = this._labelWidthCache.get(n.id);
      if (tw == null) { tw = ctx.measureText(n.short).width; this._labelWidthCache.set(n.id, tw); }
      const labelY = cand.sy + n.hw * this.camera.scale + 13;
      const halfW = tw / 2 + 3, halfH = 8;
      const rect = { x1: cand.sx - halfW, y1: labelY - halfH, x2: cand.sx + halfW, y2: labelY + halfH };
      let overlaps = false;
      for (const p of placed) {
        if (rect.x1 < p.x2 && rect.x2 > p.x1 && rect.y1 < p.y2 && rect.y2 > p.y1) { overlaps = true; break; }
      }
      if (overlaps && !cand.alwaysOn) continue; // always-on always draws; others yield to a higher-priority neighbor
      placed.push(rect);

      const dim = active && n !== active && !(connectedIds && connectedIds.has(n.id)) ? 0.3 : 1;
      const isActive = n === active;
      ctx.font = (isActive ? '600 ' : '400 ') + '11px system-ui, -apple-system, sans-serif';
      const labelAlpha = cand.alpha * dim * ea;
      const col = isActive ? `rgba(255,255,255,${ea})` : `rgba(222,226,232,${0.78 * labelAlpha})`;
      drawLabelHalo(ctx, n.short, cand.sx, labelY, col);
    }
  }

  requestRender() {
    this.lastInputAt = performance.now();
    this.interactionActive = true;
    if (!this.rafId) this.rafId = requestAnimationFrame(this.tick);
  }

  // Pure frame scheduling for the page's OWN animations (card fades, glow
  // easing). Unlike requestRender it does not stamp the input timer, so an
  // internal ease can never masquerade as user activity and extend the calm
  // window - the loop parks the moment the animation truly finishes.
  requestFrame() {
    if (!this.rafId) this.rafId = requestAnimationFrame(this.tick);
  }

  tick(now) {
    this.rafId = null;
    if (!this.entranceStart) this.entranceStart = now;
    if (!this.lastT) this.lastT = now;
    const dt = Math.min((now - this.lastT) / 1000, 0.05);
    this.lastT = now;
    this.simT += dt;
    this.sim.step(dt);
    this.draw(now);
    this.frameCount++;

    const entranceActive = entranceGlobalAlpha(this.entranceStart) < 1;
    if (this.interactionActive && !this.dragging && !this.panning && (now - this.lastInputAt) > CALM_MS) {
      this.interactionActive = false;
    }
    const still = entranceActive || !this.sim.isAtRest() || this.dragging || this.panning || this.interactionActive;
    /* Guarded reschedule only: draw() may already have booked the next frame
       (mark fade, hover-glow easing). A bare requestAnimationFrame here would
       stack a second loop on top of that one - and the population doubles
       every frame both fire, collapsing the page to a crawl. */
    if (still && !this.rafId) this.rafId = requestAnimationFrame(this.tick);
    // The hover gate lifts here, on the load clock rather than the sim's
    // energy: once the entrance's violent fling window has passed, pointing
    // at nodes feels natural again. Latched - later re-heats (a drag warms
    // the sim back up) never re-close it; only Replay does.
    if (!entranceActive && (now - this.entranceStart) > HOVER_CALM_MS) this.calm = true;
    // The insight reveal keys on a fixed load-delay clock from the first
    // painted frame - never on the physics: rest timing is a rendering
    // concern, and movement on the page must not delay the insight layer.
    // It runs after the frame's scheduling decision so its requestFrame
    // never races the still-guarded reschedule above.
    if (!entranceActive && !this.cardsShown && (now - this.entranceStart) > CARD_REVEAL_DELAY_MS) this.revealCards();
  }
}

window.GraphInstance = new GraphView(document.getElementById('canvas'), document.getElementById('panel'));

document.getElementById('replay-btn').addEventListener('click', () => {
  window.GraphInstance.replay();
});
document.getElementById('refresh-btn').addEventListener('click', () => {
  location.reload();
});
window.addEventListener('resize', () => {
  window.GraphInstance.resize();
});

const noticeMessage = computeNotice(window.CRAFT_BUILD, GRAPH);
if (noticeMessage) {
  const noticeEl = document.querySelector('#controls .notice');
  noticeEl.textContent = noticeMessage;
  noticeEl.classList.add('visible');
}
</script>
