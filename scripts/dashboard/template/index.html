class GraphView {
  constructor(canvas, panel) {
    this.canvas = canvas;
    this.panel = panel;
    this.cardsEl = document.getElementById('cards');
    // .p-summary and .p-rels are static markup that persist across every
    // fill (fillPanel only ever writes into them), so the scroll listener
    // wires exactly once here rather than being re-attached per record.
    this._summaryFade = this.wireVerticalFade(this.panel.querySelector('.p-summary'));
    this._relsFade = this.wireVerticalFade(this.panel.querySelector('.p-rels'));
    this.cardsShown = false;
    this.cardsShownAt = 0;
    this.calm = false;
    this.cardMeta = [];
    this._leaderMarchAt = 0;
    this._leaderCamSig = '';
    this._leaderRestMarched = false;
    const { ctx, resize: resizeCanvas } = makeCanvasCtx(canvas);
    this.ctx = ctx;
    this._resizeCanvas = resizeCanvas;
    this.camera = new Camera();
    this.mouse = { x: -9999, y: -9999 };
    this.hoverNode = null;
    this.selectedNode = null;
    this.dragNode = null;
    this.dragCandidate = null;
    this.dragging = false;
    this.downScreen = null;
    this.panning = false;
    this.panStartScreen = null;
    this.panStartCam = null;
    this._labelWidthCache = new Map();
    // Both anchor on the first PAINTED frame (set inside tick), not here -
    // on a cold load the gap between this line and first paint can be large
    // enough to burn the entrance, or a whole clamped simulation step, dark.
    this.lastT = 0;
    this.entranceStart = 0;
    this.simT = 0;
    this.frameCount = 0;
    this.interactionActive = false;
    this.lastInputAt = 0;
    this.rafId = null;

    // One damping value and one alphaDecay - the accepted stance's own. The
    // drag-release recovery window inside the simulation is the only
    // modulation either ever gets.
    this.sim = new Sim({ repulse: 30000, springK: 0.9, springLength: 92, damping: 0.94, gravity: 10, maxSpeed: 6000, alphaDecay: 0.026 });
    this.sim.nodes.forEach(n => this.shapeNode(n));
    // Cluster heat state: the baked bloom canvas and the moment its fade-in
    // began. heatFadeStart doubles as the already-handled guard, so the
    // early beat and the first-rest path can never double-fire the fade.
    this.heatCanvas = null;
    this.heatFadeStart = 0;
    this.settledOnce = false;
    this.bakeAssets();
    this.attachInteraction();
    this.tick = this.tick.bind(this);
    this.resize();
    this.replay();
  }

  shapeNode(n) {
    n.shape = 'circle';
    const degree = this.sim.adj.get(n.id).length;
    n.degree = degree;
    const t = Math.sqrt(Math.min(degree, DEG_CAP) / DEG_CAP);
    n.hw = n.hh = (MIN_R + (MAX_R - MIN_R) * t) * (n.type === 'cycle' ? window.NS.cycleScale : 1);
    n.mass = 0.6 + t * 2.2;
    n.bucket = bucketFor(n.hw);
  }

  bakeAssets() {
    this.fill = {};
    this.heat = {};
    // Rim colour is the node's own hue lifted +16 lightness (clamped), so it
    // needs the HSL triple, not the precomputed RGB.
    const bake = (key, hsl) => {
      const rgb = hsl2rgb(hsl[0], hsl[1], hsl[2]);
      const rim = hsl2rgb(hsl[0], hsl[1], Math.min(90, hsl[2] + 16));
      this.fill[key] = {};
      for (const b of SIZE_BUCKETS) this.fill[key][b.key] = bakeFlatCircle(rgb, b.bakeR, rim);
      this.heat[key] = bakeHeatBlob(rgb, 320);
    };
    for (const t in TYPE_HSL) bake(t, TYPE_HSL[t]);
    bake(FALLBACK_TYPE, FALLBACK_HSL);
    // Completed records of the most numerous type cool to near-neutral grey
    // texture - saturation dropped hard, lightness pulled down - so only
    // living work still carries the ember-coral. The same dim key feeds that
    // region's ambient heat, cooled to match the dimmed dots (grey dots over
    // a still-warm haze read as olive, not neutral).
    bake('story_dim', [220, 4, 36]);
  }

  // A record type this page has no hue for still resolves - to the baked
  // fallback sprite set - rather than throwing on the first draw frame.
  spriteFor(type, bucket) { return (this.fill[type] || this.fill[FALLBACK_TYPE])[bucket]; }
  heatFor(type) { return this.heat[type] || this.heat[FALLBACK_TYPE]; }

  // One bloom per type region, stamped additively into a world-sized canvas.
  // Both POSITION and SIZE are ANALYTIC - the anchor's fitted position and a
  // final-scatter prediction from member count - never a live centroid. A
  // bloom baked from mid-flight positions sits in the wrong place looking
  // settled, then silently jumps at true rest; the anchor and the final
  // centroid agree within ~1-2px, so baking from the anchor the whole time
  // removes the jump entirely rather than hiding it better.
  bakeHeat() {
    const w = window.innerWidth, h = window.innerHeight;
    const fit = this.sim.fit;
    if (!fit || !TYPE_ANCHORS) return null; // no fitted plate yet - nothing to bloom
    const c = document.createElement('canvas');
    c.width = Math.max(1, w); c.height = Math.max(1, h);
    const g = c.getContext('2d');
    g.globalCompositeOperation = 'lighter';
    for (const [type, idxs] of this.sim.byType) {
      const anchor = TYPE_ANCHORS.get(type);
      if (!anchor || !idxs.length) continue;
      const cooled = type === 'story';
      const sprite = cooled ? this.heatFor('story_dim') : this.heatFor(type);
      const cx = w / 2 + (anchor.x - fit.cx0) * fit.scale;
      const cy = h / 2 + (anchor.y - fit.cy0) * fit.scale;
      const memberCount = idxs.length;
      const spiralScale = (10 + Math.sqrt(memberCount) * 8) * SPREAD_MULT;
      const analyticMaxDRef = spiralScale * Math.sqrt(Math.max(0, memberCount - 1) + 0.5);
      const analyticMaxD = Math.max(30, analyticMaxDRef * fit.scale);
      const size = Math.max(180, (analyticMaxD + 40) * 2.1) * HEAT_SIZE_MULT;
      g.globalAlpha = cooled ? HEAT_ALPHA * 0.7 : HEAT_ALPHA;
      g.drawImage(sprite, cx - size / 2, cy - size / 2, size, size);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    return c;
  }

  // Bakes (or re-bakes) the bloom and starts its one fade-in. The fade
  // starts only once - a later re-bake (first rest, a resize) refreshes the
  // canvas without restarting the fade.
  armHeat(now) {
    this.heatCanvas = this.bakeHeat();
    if (this.heatCanvas && !this.heatFadeStart) { this.heatFadeStart = now; this.requestFrame(); }
  }

  // ---- the commit strip -------------------------------------------------
  // One cell = one record, at a FIXED size. A longer span makes the strip
  // wider (and scrollable); it never shrinks a cell below a clickable target.
  // The bucket unit is a calendar decision taken from the date strings before
  // anything is laid out - layout adapts to it and never overrules it.
  buildStrip(rels) {
    const CELL_W = 22, CELL_H = 9, GAP = 2;
    const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
    const host = el('div');

    const items = rels.map(r => r.other).filter(n => n.date).sort((a, b) => a.date.localeCompare(b.date));
    const undated = rels.length - items.length;
    if (!items.length) {
      const none = el('div', 'p-rel-item');
      none.textContent = rels.length + ' connection' + (rels.length === 1 ? '' : 's') + ', no dates recorded';
      host.appendChild(none);
      return host;
    }

    // Read the calendar straight off 'YYYY-MM-DD'. No average day-lengths:
    // an approximated month drifts off real month boundaries.
    const ymd = t => ({ y: +t.slice(0, 4), m: +t.slice(5, 7), d: +t.slice(8, 10) });
    const a = ymd(items[0].date), b = ymd(items[items.length - 1].date);
    const spanDays = Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000) + 1;
    const spanMonths = (b.y - a.y) * 12 + (b.m - a.m);
    const unit = spanDays <= 21 ? 'day' : spanMonths < 4 ? 'week' : spanMonths < 36 ? 'month' : 'year';

    const iso = dt => dt.toISOString().slice(0, 10);
    const monday = t => { const p = ymd(t); const dt = new Date(Date.UTC(p.y, p.m - 1, p.d)); dt.setUTCDate(dt.getUTCDate() - ((dt.getUTCDay() + 6) % 7)); return iso(dt); };
    const keyOf = { day: t => t, week: monday, month: t => t.slice(0, 7), year: t => t.slice(0, 4) }[unit];
    const nextKey = {
      day:   k => { const p = ymd(k); return iso(new Date(Date.UTC(p.y, p.m - 1, p.d + 1))); },
      week:  k => { const p = ymd(k); return iso(new Date(Date.UTC(p.y, p.m - 1, p.d + 7))); },
      month: k => { const y = +k.slice(0, 4), m = +k.slice(5, 7); return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0'); },
      year:  k => String(+k + 1)
    }[unit];

    // Walk the calendar end to end so an idle week or month is a visible gap.
    const firstKey = keyOf(items[0].date), lastKey = keyOf(items[items.length - 1].date);
    const keys = [firstKey];
    for (let k = firstKey; k !== lastKey && keys.length < 4000; ) { k = nextKey(k); keys.push(k); }
    const slot = new Map(keys.map((k, i) => [k, i]));
    const cols = keys.map(() => []);
    items.forEach(n => { const i = slot.get(keyOf(n.date)); cols[i === undefined ? 0 : i].push(n); });

    const nCols = keys.length;
    const gridW = nCols * CELL_W + (nCols - 1) * GAP;
    const tallest = Math.max.apply(null, cols.map(c => c.length).concat([1]));

    const view = el('div', 'p-strip-view');
    const inner = el('div');
    inner.style.width = gridW + 'px';
    const grid = el('div', 'p-strip-grid');
    grid.style.height = (tallest * (CELL_H + GAP)) + 'px';

    const hover = el('div', 'p-strip-hover');
    // Cells are addressable by (column, row) so the key handler can walk the
    // grid. Row 0 is the bottom of a column - .p-strip-col is column-reverse.
    const colCells = [];
    cols.forEach((bucket, ci) => {
      const colEl = el('div', 'p-strip-col');
      const cells = [];
      bucket.forEach(n => {
        const cell = el('div', 'p-strip-cell');
        cell.style.background = fillFor(n);
        cell.title = n.label;
        // A div with a click handler is a pointer affordance and nothing else -
        // the browser synthesizes no keyboard activation for a roleless
        // element. Role plus a tab stop plus Enter/Space is the whole gap.
        cell.setAttribute('role', 'button');
        cell.setAttribute('aria-label', n.label);
        cell.tabIndex = -1;
        cell._node = n;
        cell._col = ci;
        cell._row = cells.length;
        cell.addEventListener('mouseenter', () => { hover.textContent = n.label; });
        cell.addEventListener('mouseleave', () => { hover.textContent = ''; });
        cell.addEventListener('focus', () => { hover.textContent = n.label; });
        cell.addEventListener('blur', () => { hover.textContent = ''; });
        cell.addEventListener('click', ev => { ev.stopPropagation(); this.goTo(n); });
        cells.push(cell);
        colEl.appendChild(cell);
      });
      colCells.push(cells);
      if (!bucket.length) colEl.appendChild(el('div', 'p-strip-empty'));
      grid.appendChild(colEl);
    });
    inner.appendChild(grid);

    // The endpoint dates ride inside the scroller with the bars, so the axis
    // never describes a window you are not looking at.
    const fmt = t => new Date(t + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const ends = el('div', 'p-strip-ends');
    ends.style.width = gridW + 'px';
    const from = el('span'); from.textContent = fmt(items[0].date); ends.appendChild(from);
    if (nCols > 1) { const to = el('span'); to.textContent = fmt(items[items.length - 1].date); ends.appendChild(to); }
    inner.appendChild(ends);
    view.appendChild(inner);
    host.appendChild(view);

    // Roving tabindex: the strip is ONE tab stop and the arrows walk it. A tab
    // stop per cell would put a thousand-record project's whole history in the
    // tab order, which is why this is not just tabIndex = 0 on every cell.
    const occupied = colCells.filter(c => c.length);
    if (occupied.length) {
      const firstCell = occupied[0][0];
      const lastCol = occupied[occupied.length - 1];
      const lastCell = lastCol[lastCol.length - 1];
      firstCell.tabIndex = 0;
      grid.setAttribute('role', 'group');
      grid.setAttribute('aria-label', 'Connected records, ' + items.length + ' dated, oldest first');

      // Nudge the scroller rather than scrollIntoView, which would also scroll
      // every ancestor. Paired with focus({preventScroll}) so the page is still.
      const keepInView = cell => {
        if (!view.classList.contains('is-scrollable')) return;
        const vr = view.getBoundingClientRect(), cr = cell.getBoundingClientRect();
        if (cr.left < vr.left) view.scrollLeft -= (vr.left - cr.left);
        else if (cr.right > vr.right) view.scrollLeft += (cr.right - vr.right);
      };
      const move = (from, to) => {
        if (!to || to === from) return;
        from.tabIndex = -1;
        to.tabIndex = 0;
        to.focus({ preventScroll: true });
        keepInView(to);
      };
      // Step to the nearest column that actually holds records, then clamp the
      // row - an idle week is a visible gap, and focus should skip over it.
      const stepCol = (ci, dir, row) => {
        for (let i = ci + dir; i >= 0 && i < colCells.length; i += dir) {
          if (colCells[i].length) return colCells[i][Math.min(row, colCells[i].length - 1)];
        }
        return null;
      };

      grid.addEventListener('keydown', ev => {
        const cell = ev.target;
        if (!cell || !cell.classList || !cell.classList.contains('p-strip-cell')) return;
        if (ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar') {
          ev.preventDefault();
          ev.stopPropagation();
          this.goTo(cell._node);
          return;
        }
        const col = colCells[cell._col];
        let to = null;
        if (ev.key === 'ArrowUp') to = col[cell._row + 1];
        else if (ev.key === 'ArrowDown') to = col[cell._row - 1];
        else if (ev.key === 'ArrowRight') to = stepCol(cell._col, 1, cell._row);
        else if (ev.key === 'ArrowLeft') to = stepCol(cell._col, -1, cell._row);
        else if (ev.key === 'Home') to = firstCell;
        else if (ev.key === 'End') to = lastCell;
        else return;
        ev.preventDefault();
        ev.stopPropagation();
        move(cell, to);
      });
    }

    // Overflow chrome exists only when the strip actually overflows.
    const rail = this.panel.querySelector('.p-rels');
    if (gridW > (rail ? rail.clientWidth : gridW)) {
      view.classList.add('is-scrollable');
      view.tabIndex = 0;
      view.setAttribute('role', 'region');
      view.setAttribute('aria-label', 'Timeline, ' + nCols + ' ' + unit + (nCols === 1 ? '' : 's') + ', scrollable');
      const fades = () => {
        const max = view.scrollWidth - view.clientWidth;
        view.style.setProperty('--fade-l', view.scrollLeft > 1 ? '1' : '0');
        view.style.setProperty('--fade-r', view.scrollLeft < max - 1 ? '1' : '0');
      };
      view.addEventListener('scroll', fades, { passive: true });
      // Opened on the most recent end by fillPanel, once the strip is in the
      // document and has a measurable scrollWidth. Deliberately not deferred
      // to a frame: the render loop owns the only two rAF call sites.
      view.dataset.openAtEnd = '1';
      this._stripFades = fades;
    }

    // The span and the legend describe the whole record, not the visible
    // window, so they stay outside the scroller. The span is worded from the
    // columns actually drawn - there is no second unit ladder to drift.
    const span = el('div', 'p-strip-span');
    span.textContent = nCols + ' ' + unit + (nCols === 1 ? '' : 's') + (undated ? ' · ' + undated + ' undated' : '');
    host.appendChild(span);

    const counts = {};
    rels.forEach(r => { counts[r.other.type] = (counts[r.other.type] || 0) + 1; });
    const legend = el('div', 'p-strip-legend');
    Object.keys(counts).sort((x, y) => counts[y] - counts[x]).forEach(t => {
      const w = el('span');
      const sw = el('span', 'p-strip-swatch');
      sw.style.background = rgbCss(TYPE_RGB[t] || FALLBACK_RGB);
      w.appendChild(sw);
      w.appendChild(document.createTextNode(counts[t] + ' ' + typeCountWord(t, counts[t])));
      legend.appendChild(w);
    });
    host.appendChild(legend);
    host.appendChild(hover);
    return host;
  }

  fillPanel(n) {
    // The record's own hue is the panel's light source: the drop-cap and the
    // type word both read these custom properties, so setting them here once
    // reaches both without either needing to know the other exists.
    const hsl = TYPE_HSL[n.type] || FALLBACK_HSL;
    this.panel.style.setProperty('--h', hsl[0]);
    this.panel.style.setProperty('--s', hsl[1] + '%');
    this.panel.style.setProperty('--l', hsl[2] + '%');
    // The wipe restarts once per fill. Whether the panel was already open
    // decides the delay: closed->open keeps the stylesheet's 0.32s (sequel
    // to the panel's own slide-in), a switch plays with no delay at all.
    // fillPanel runs BEFORE setPanelVisible on the open path, so `.visible`
    // still reads the panel's PRIOR state here.
    const summaryEl = this.panel.querySelector('.p-summary');
    const wasOpen = this.panel.classList.contains('visible');
    summaryEl.style.animation = 'none';
    void summaryEl.offsetHeight;
    summaryEl.style.animation = '';
    // The animation shorthand reset above also clears any inline delay, so
    // this has to be assigned AFTER it - and on every fill, or a switch's
    // '0s' would leak into the next closed->open open.
    summaryEl.style.animationDelay = wasOpen ? '0s' : '';
    const fmtDate = d => { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
    // A dial's status slot holds a session outcome rather than a status -
    // its own vocabulary axis, worded from a different table.
    const statusWords = n.type === 'dial' ? VOCAB.dial_outcomes : VOCAB.statuses;
    const typeEl = this.panel.querySelector('.p-type');
    typeEl.textContent = '';
    // Each bit is its own span so the line can tier its colours; the ' · '
    // separators stay bare text nodes in the line's own colour.
    const typeBit = (text, cls) => {
      if (typeEl.childNodes.length) typeEl.appendChild(document.createTextNode(' · '));
      if (!cls) { typeEl.appendChild(document.createTextNode(text)); return; }
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      typeEl.appendChild(span);
    };
    typeBit(VOCAB.types[n.type] || n.type, 'p-type-name');
    if (n.status) typeBit(statusWords[n.status] || n.status, 'p-type-status');
    if (n.date) typeBit(fmtDate(n.date), 'p-type-date');
    // Back is a prefix character on the line that already says where you are,
    // shown only when there is a card behind this one. No container, no label.
    if (this.trail && this.trail.length) {
      const back = document.createElement('button');
      back.className = 'p-back';
      back.textContent = '\u2039';
      back.setAttribute('aria-label', 'Back');
      back.addEventListener('click', ev => { ev.stopPropagation(); this.goBack(); });
      typeEl.insertBefore(back, typeEl.firstChild);
    }
    this.panel.querySelector('.p-title').textContent = n.label;
    this.panel.querySelector('.p-meta').textContent = n.degree + ' connection' + (n.degree === 1 ? '' : 's');
    // The summary paints instantly; the record's full source replaces it the
    // moment its mirror arrives. No control, no second state - the spark is
    // always the whole record, scrolling inside its own window. Both paints
    // route through the same parse, so the record is never pasted as raw
    // text - only ever written into elements.
    this.renderRecord(summaryEl, n.type, n.summary, n.label);
    // An empty record has nothing to light, so the whole well hides rather
    // than leaving a lit, empty box sitting on the card.
    this.panel.querySelector('.p-summary-well').style.display = n.summary ? '' : 'none';
    summaryEl.scrollTop = 0;
    if (n.summary) this.loadRecordText(n.id, text => {
      // The panel may already show another record by the time the mirror
      // arrives - never write into someone else's spark.
      if (this.selectedNode !== n) return;
      const full = text == null ? null : this.sourceSection(n.type, text);
      if (full != null) this.renderRecord(summaryEl, n.type, full, n.label);
    });
    const relsEl = this.panel.querySelector('.p-rels');
    relsEl.innerHTML = '';
    if (n.chunks && n.chunks.list && n.chunks.list.length) {
      // The work is collapsible - Connections is not, so only this label
      // gets the toggle class and its own click listener. Rebuilt on every
      // fill, so the listener wires fresh here rather than delegating - no
      // handler stacking to guard against.
      const h = document.createElement('div');
      h.className = 'p-rel-label chunks-toggle';
      const disclosure = document.createElement('span');
      disclosure.className = 'disclosure';
      disclosure.textContent = '▸';
      h.appendChild(disclosure);
      h.appendChild(document.createTextNode(' The work (' + n.chunks.complete + '/' + n.chunks.total + ' done)'));
      relsEl.appendChild(h);
      const list = document.createElement('div');
      list.className = 'p-chunk-list is-collapsed';
      n.chunks.list.forEach(c => {
        const row = document.createElement('div');
        row.className = 'p-chunk' + (c.status === 'complete' ? ' is-complete' : '');
        const dot = document.createElement('span');
        dot.className = 'p-chunk-dot' + (c.status === 'complete' || c.status === 'active' ? ' is-' + c.status : '');
        const title = document.createElement('span');
        title.className = 'p-chunk-title';
        title.textContent = c.title || '';
        row.appendChild(dot);
        row.appendChild(title);
        list.appendChild(row);
      });
      relsEl.appendChild(list);
      h.addEventListener('click', () => {
        const collapsed = list.classList.toggle('is-collapsed');
        disclosure.textContent = collapsed ? '▸' : '▾';
      });
    }
    const rels = this.sim.adj.get(n.id);
    if (rels.length) {
      const label = document.createElement('div'); label.className = 'p-rel-label'; label.textContent = 'Connections'; relsEl.appendChild(label);
      relsEl.appendChild(this.buildStrip(rels));
      const view = relsEl.querySelector('.p-strip-view[data-open-at-end]');
      if (view) { view.scrollLeft = view.scrollWidth; if (this._stripFades) this._stripFades(); }
    }
    // Both fades measure synchronously, the same idiom the strip's own fade
    // already uses here - never deferred to a frame.
    if (this._summaryFade) this._summaryFade();
    if (this._relsFade) this._relsFade();
  }

  // Turns a record's raw text into elements - never a rewrite, only a
  // client-side span-wrapping parse. A cycle's body is YAML (the registry's
  // only type pointed at a .yaml file); every other type is prose.
  renderRecord(el, type, text, title) {
    el.textContent = '';
    if (type === 'cycle') {
      this.renderYamlFields(el, text);
    } else {
      this.renderProse(el, text, title);
    }
  }

  // Blocks split on blank lines; a block opening with an ATX marker becomes
  // a heading, everything else a paragraph. Single newlines inside a block
  // carry meaning (the well's own comment promises it), so they survive as
  // <br> rather than being swallowed by the block split. Inline markers are
  // consumed the same way, never left as visible clutter in the reading well.
  renderProse(el, text, title) {
    const raw = String(text == null ? '' : text).replace(/\r\n/g, '\n').trim();
    if (!raw) return;
    const blocks = raw.split(/\n[ \t]*\n+/).filter(b => b.trim() !== '');
    const headingRe = /^(#{1,6})\s+(.*)$/;
    blocks.forEach((block, i) => {
      const lines = block.split('\n');
      const m = headingRe.exec(lines[0]);
      let node, textLines;
      if (m) {
        // A record's own leading H1 (a riff's own title line, say) duplicates
        // the panel's title directly above it - skip only that exact case,
        // and only at the very top, never a heading deeper in the body.
        if (i === 0 && m[1].length === 1 && m[2].trim() === String(title == null ? '' : title).trim()) return;
        node = document.createElement('h2');
        textLines = [m[2]].concat(lines.slice(1));
      } else {
        node = document.createElement('p');
        textLines = lines;
      }
      textLines.forEach((line, li) => {
        if (li > 0) node.appendChild(document.createElement('br'));
        appendInlineRuns(node, line);
      });
      el.appendChild(node);
    });
  }

  // A cycle record's body is a bare YAML file (no frontmatter fence to
  // strip), so it renders as key/value fields rather than prose. Keys the
  // panel chrome already shows are omitted mechanically - a fixed list,
  // never a per-key judgment.
  renderYamlFields(el, text) {
    const OMIT_KEYS = { name: true, title: true, status: true, created: true, updated: true };
    const keyRe = /^([A-Za-z_][A-Za-z0-9_-]*):[ \t]*(.*)$/;
    const listRe = /^\s*-\s?(.*)$/;
    const fields = [];
    let field = null;
    String(text == null ? '' : text).replace(/\r\n/g, '\n').split('\n').forEach(line => {
      const km = keyRe.exec(line);
      if (km) {
        field = { key: km[1], values: [] };
        fields.push(field);
        const inline = km[2].trim();
        if (inline) field.values.push({ text: inline, isList: false });
        return;
      }
      if (!line.trim() || !field) return;
      const lm = listRe.exec(line);
      field.values.push(lm ? { text: lm[1], isList: true } : { text: line.trim(), isList: false });
    });
    fields.forEach(f => {
      if (OMIT_KEYS[f.key]) return;
      const fieldEl = document.createElement('div');
      fieldEl.className = 'yaml-field';
      const keyEl = document.createElement('div');
      keyEl.className = 'yaml-key';
      keyEl.textContent = f.key;
      fieldEl.appendChild(keyEl);
      f.values.forEach(v => {
        const valEl = document.createElement('div');
        valEl.className = 'yaml-val';
        if (v.isList) {
          const marker = document.createElement('span');
          marker.className = 'yaml-list-marker';
          marker.textContent = '-';
          valEl.appendChild(marker);
        }
        valEl.appendChild(document.createTextNode(v.text));
        fieldEl.appendChild(valEl);
      });
      el.appendChild(fieldEl);
    });
  }

  // The full text behind the card's summary line: each record type names
  // the section its summary was drawn from; a type with no such heading
  // reads as its whole body after the frontmatter.
  sourceSection(type, text) {
    const body = String(text).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
    const titles = { story: 'Spark', fix: 'Symptom', tweak: 'Request', mockup: 'Brief' };
    const wanted = titles[type];
    if (!wanted) return body.trim() || null;
    const lines = body.split('\n');
    const out = [];
    let inside = false;
    for (const line of lines) {
      if (/^## /.test(line)) {
        if (inside) break;
        inside = line.slice(3).trim() === wanted;
        continue;
      }
      if (inside) out.push(line);
    }
    const section = out.join('\n').trim();
    return section || null;
  }

  // On-demand record mirror load through a sibling script tag - the only
  // load path that works from file:// (see the top-of-page note). Each
  // mirror registers itself on window.CRAFT_RECORDS; a mirror already
  // registered is never requested twice.
  loadRecordText(id, cb) {
    const have = window.CRAFT_RECORDS && window.CRAFT_RECORDS[id];
    if (have != null) { cb(have); return; }
    // One in-flight tag per id: rapid re-clicks while the mirror is still
    // arriving queue their callbacks instead of appending duplicate tags.
    this._mirrorWaiters = this._mirrorWaiters || {};
    if (this._mirrorWaiters[id]) { this._mirrorWaiters[id].push(cb); return; }
    this._mirrorWaiters[id] = [cb];
    const settle = () => {
      const records = window.CRAFT_RECORDS || {};
      const text = records[id] != null ? records[id] : null;
      const waiters = this._mirrorWaiters[id] || [];
      delete this._mirrorWaiters[id];
      waiters.forEach(fn => fn(text));
    };
    const tag = document.createElement('script');
    tag.src = 'graph/records/' + id + '.js';
    tag.onload = settle;
    tag.onerror = settle;
    document.head.appendChild(tag);
  }

  resize() {
    this._resizeCanvas();
    this.sim.resizeHome(window.innerWidth, window.innerHeight);
    this.camera.x = window.innerWidth / 2;
    this.camera.y = window.innerHeight / 2;
    this.bg = bakeBackground(window.innerWidth, window.innerHeight);
    // The fitted plate moved, so an already-baked bloom re-bakes to the new
    // anchors - a refresh, never a second fade (armHeat guards the clock).
    if (this.heatCanvas) this.heatCanvas = this.bakeHeat();
    // The card slots are viewport-fraction positioned, so every leader's
    // card end moved with the resize - the cache re-derives on the next
    // painted frame.
    this._leaderMarchAt = 0;
    this._leaderRestMarched = false;
    this.requestRender();
  }

  // Travel between records from inside the card. Pushing happens only on an
  // in-card click; a canvas click clears the trail (see the mouseup handler).
  goTo(node) {
    if (this.selectedNode) (this.trail = this.trail || []).push(this.selectedNode);
    this.selectedNode = node;
    this.fillPanel(node);
    this.requestRender();
  }

  goBack() {
    const prev = (this.trail || []).pop();
    if (!prev) return;
    this.selectedNode = prev;
    this.fillPanel(prev);
    this.requestRender();
  }

  // ---- the insight layer -----------------------------------------------
  // Content and evidence come from the sidecar; geometry and chrome are the
  // page's. Evidence ids resolve against the live graph - an id that no
  // longer resolves loses only its marks, never the card: the wit survives,
  // the pointer goes quiet.
  resolveInsightCards() {
    if (!INSIGHTS) return [];
    return INSIGHTS.cards.filter(c => c && typeof c === 'object').slice(0, 4).map(c => {
      const ids = Array.isArray(c.evidence_node_ids) ? c.evidence_node_ids : [];
      const nodes = ids
        .map(id => this.sim.idx.has(id) ? this.sim.nodes[this.sim.idx.get(id)] : null)
        .filter(Boolean);
      return { body: String(c.body || ''), witness: String(c.witness || ''), nodes };
    }).filter(c => c.body);
  }

  // Hue is derived from the live type of the first RESOLVING evidence node,
  // never asserted by the sidecar - the chip's chrome IS its citation, so it
  // cannot cite a type the graph disagrees with. No surviving evidence takes
  // the same neutral fallback an unknown node type does.
  cardHsl(card) {
    return (card.nodes.length && TYPE_HSL[card.nodes[0].type]) || FALLBACK_HSL;
  }

  buildCards(cards) {
    const w = window.innerWidth, h = window.innerHeight;
    this.cardsEl.innerHTML = '';
    this.cardMeta = [];
    const free = CARD_SLOTS.map((s, i) => i);
    cards.forEach((card, ci) => {
      // Evidence centroid in screen space - the same projection expression
      // the label pass uses, so there is exactly one mapping to drift.
      let cx = w / 2, cy = h / 2;
      if (card.nodes.length) {
        let sx = 0, sy = 0;
        for (const n of card.nodes) {
          sx += (n.x - this.camera.x) * this.camera.scale + w / 2;
          sy += (n.y - this.camera.y) * this.camera.scale + h / 2;
        }
        cx = sx / card.nodes.length; cy = sy / card.nodes.length;
      }
      // Greedy nearest free slot, so each chip sits closest to its own
      // evidence.
      let best = free[0], bestD = Infinity;
      for (const i of free) {
        const s = CARD_SLOTS[i];
        const px = s.side === 'left' ? s.x * w : w - s.x * w;
        const d = Math.hypot(px - cx, s.y * h - cy);
        if (d < bestD) { bestD = d; best = i; }
      }
      free.splice(free.indexOf(best), 1);
      const slot = CARD_SLOTS[best];
      const hsl = this.cardHsl(card);
      const el = document.createElement('div');
      el.className = 'card' + (slot.side === 'right' ? ' pin-right' : '');
      el.style[slot.side] = (slot.x * 100) + '%';
      el.style.top = (slot.y * 100) + '%';
      el.style.transitionDelay = (ci * 110) + 'ms';
      el.style.borderColor = `hsla(${hsl[0]},${hsl[1]}%,${hsl[2]}%,0.55)`;
      const eyebrow = document.createElement('div');
      eyebrow.className = 'c-eyebrow';
      eyebrow.style.color = `hsl(${hsl[0]},${hsl[1]}%,${Math.min(90, hsl[2] + 12)}%)`;
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = `hsl(${hsl[0]},${hsl[1]}%,${hsl[2]}%)`;
      const obs = document.createTextNode('Observation ' + String(ci + 1).padStart(2, '0'));
      // The dot sits at the frame-facing edge: before the text on a
      // left-pinned chip, after it on a right-pinned one.
      if (slot.side === 'right') { eyebrow.appendChild(obs); eyebrow.appendChild(dot); }
      else { eyebrow.appendChild(dot); eyebrow.appendChild(obs); }
      // The quote-source node's date closes the row on every chip - the
      // auto margin owns the far end regardless of pin side.
      const src = card.nodes[0];
      if (src && src.date) {
        const parts = String(src.date).split('-');
        const month = CARD_MONTHS[(+parts[1] || 1) - 1];
        if (month && parts[2]) {
          const dateEl = document.createElement('span');
          dateEl.className = 'c-date';
          dateEl.textContent = month + ' ' + (+parts[2]);
          eyebrow.appendChild(dateEl);
        }
      }
      el.appendChild(eyebrow);
      const body = document.createElement('div');
      body.className = 'c-body';
      body.textContent = card.body;
      el.appendChild(body);
      if (card.witness) {
        const witness = document.createElement('div');
        witness.className = 'c-witness';
        witness.textContent = 'witnessed by ' + card.witness;
        el.appendChild(witness);
      }
      this.cardsEl.appendChild(el);
      // The leader pass derives its geometry from this entry: the element's
      // untransformed layout box (offsetLeft/offsetTop are immune to the
      // translateY entrance) and the evidence hue. The cached leader
      // geometry lands on the same entry when the throttled march runs.
      this.cardMeta.push({ card, slot, hsl, el, leader: null });
    });
    this._leaderMarchAt = 0;
    this._leaderCamSig = '';
    this._leaderRestMarched = false;
  }

  // Ray-marches from the card edge toward the evidence cluster's projected
  // centroid in small screen-space steps, testing every node's projected
  // radius, and returns the first contact backed off by a standoff - so the
  // leader travels only over empty background and stops at the dot field's
  // true outer edge, never crossing ANY dot (not just the evidence
  // cluster's own members).
  cloudContact(x1, y1, cx, cy, w, h) {
    const dx = cx - x1, dy = cy - y1;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    const stepSize = 6, standoff = 14;
    const steps = Math.max(1, Math.floor(dist / stepSize));
    const cam = this.camera, scale = cam.scale;
    for (let s = 1; s <= steps; s++) {
      const px = x1 + ux * stepSize * s, py = y1 + uy * stepSize * s;
      for (const n of this.sim.nodes) {
        const nx = (n.x - cam.x) * scale + w / 2;
        const ny = (n.y - cam.y) * scale + h / 2;
        const dd = Math.hypot(px - nx, py - ny);
        if (dd <= n.hw * scale + 3) {
          const backDist = Math.max(0, stepSize * s - standoff);
          return { x: x1 + ux * backDist, y: y1 + uy * backDist };
        }
      }
    }
    // No contact along the whole ray - stop well short of the centroid
    // rather than reaching all the way in.
    const fallback = Math.max(dist - 60, dist * 0.5);
    return { x: x1 + ux * fallback, y: y1 + uy * fallback };
  }

  // Re-derives every leader's cached geometry from live projected node
  // positions. The card end reads the untransformed layout box
  // (offsetLeft/offsetTop), so a leader measured mid-entrance never anchors
  // low; the node end re-projects, so pan, zoom, resize and drag never
  // leave a leader pointing at empty space. All coordinates round to
  // integers before caching.
  deriveLeaders(w, h) {
    for (const meta of this.cardMeta) {
      const evidence = meta.card.nodes;
      if (!evidence.length) { meta.leader = null; continue; }
      const src = evidence[0];
      const grp = this.sim.byType.get(src.type) || [];
      let gx = 0, gy = 0;
      for (const ni of grp) { gx += this.sim.nodes[ni].x; gy += this.sim.nodes[ni].y; }
      const count = grp.length || 1;
      const cx = (gx / count - this.camera.x) * this.camera.scale + w / 2;
      const cy = (gy / count - this.camera.y) * this.camera.scale + h / 2;
      const el = meta.el;
      const x1 = meta.slot.side === 'left' ? el.offsetLeft + el.offsetWidth : el.offsetLeft;
      const y1 = el.offsetTop + el.offsetHeight / 2;
      const contact = this.cloudContact(x1, y1, cx, cy, w, h);
      const tx = contact.x, ty = contact.y;
      // A shallow bend only - a wider bow risks bowing the curve's belly
      // back over a dot near the boundary it just stopped short of.
      const bend = (y1 < ty ? 1 : -1) * (meta.slot.side === 'left' ? 1 : -1) * 14;
      const cxp = (x1 + tx) / 2, cyp = (y1 + ty) / 2 + bend;
      const dirx = tx - cxp, diry = ty - cyp;
      const dl2 = Math.hypot(dirx, diry) || 1;
      const uxa = dirx / dl2, uya = diry / dl2;
      const perpx = -uya, perpy = uxa;
      const back = 8, spread = 4;
      meta.leader = {
        x1: Math.round(x1), y1: Math.round(y1),
        cx: Math.round(cxp), cy: Math.round(cyp),
        tx: Math.round(tx), ty: Math.round(ty),
        a1x: Math.round(tx - uxa * back + perpx * spread), a1y: Math.round(ty - uya * back + perpy * spread),
        a2x: Math.round(tx - uxa * back - perpx * spread), a2y: Math.round(ty - uya * back - perpy * spread),
        hue: `hsl(${meta.hsl[0]},${meta.hsl[1]}%,${Math.min(85, meta.hsl[2] + 6)}%)`,
      };
    }
  }

  // Fires from the render loop at whichever comes first: the simulation
  // reaching rest, or the CARD_REVEAL_MS ceiling from the first painted
  // frame. The requestFrame kicks the entrance's first frame; the leader
  // fade keeps the loop alive until it completes, and stillness returns.
  revealCards() {
    // The viewport bail precedes the latch: a settle below the size floor
    // leaves the reveal armed, so enlarging the window fires it on the next
    // rest frame instead of never.
    if (!this.cardsEl || !cardsViewportOk()) return;
    this.cardsShown = true;
    const cards = this.resolveInsightCards();
    if (!cards.length) return;
    this.buildCards(cards);
    this.cardsShownAt = performance.now();
    void this.cardsEl.offsetWidth; // commit resting styles so the class toggle transitions
    this.cardsEl.classList.add('shown');
    this.requestFrame();
  }

  // One seam for the record panel's visibility, so the insight layer bows
  // out and returns in the same breath - the composed frame never holds two
  // competing focus objects on the right edge.
  setPanelVisible(on) {
    if (this.panel) this.panel.classList.toggle('visible', on);
    if (this.cardsEl) this.cardsEl.classList.toggle('suppressed', on);
  }

  // Toggles at-top/at-bottom classes rather than a shared calc()-driven
  // custom property - a custom property shared across elements under one CSS
  // rule produced a hard, gapless cut on at least one box instead of a
  // gradient (mockup finding, root cause not fully isolated). Classes
  // sidestep the whole failure class: each rule is a static declaration with
  // nothing to miscompute. Wired once per element (they persist across every
  // fill); returns the updater so a fill can re-run it synchronously.
  wireVerticalFade(el) {
    if (!el) return null;
    const update = () => {
      const max = el.scrollHeight - el.clientHeight;
      el.classList.toggle('at-top', el.scrollTop <= 1);
      el.classList.toggle('at-bottom', el.scrollTop >= max - 1);
    };
    el.addEventListener('scroll', update, { passive: true });
    update();
    return update;
  }

  replay() {
    const w = window.innerWidth, h = window.innerHeight;
    this.sim.resizeHome(w, h);
    // A Replay is a genuinely fresh start - a node pinned from an earlier
    // drag must not survive it and sit frozen while everything else
    // re-enters. Every pin clears BEFORE the seed.
    this.sim.nodes.forEach(n => { n.fx = null; n.fy = null; });
    seedCompactCloud(this.sim.nodes, w / 2, h / 2);
    this.sim.alpha = 1;
    this.sim.alphaTarget = 0;
    this.sim.dragNode = null;
    this.sim.towed = [];
    this.sim.recoverT0 = 0;
    this.sim.entranceT0 = 0;
    this.selectedNode = null;
    this.hoverNode = null;
    this.dragNode = null;
    this.dragCandidate = null;
    this.setPanelVisible(false);
    // Clearing cardsShown re-arms the reveal, so the whole choreography -
    // bloom, settle, card entrance - runs again from the top. The hover
    // calm latch re-arms with it, so hover goes quiet for the re-run too.
    this.cardsShown = false;
    this.cardsShownAt = 0;
    this.calm = false;
    this.cardMeta = [];
    this._leaderMarchAt = 0;
    this._leaderCamSig = '';
    this._leaderRestMarched = false;
    if (this.cardsEl) { this.cardsEl.classList.remove('shown'); this.cardsEl.innerHTML = ''; }
    this.heatCanvas = null;
    this.heatFadeStart = 0;
    this.settledOnce = false;
    this.entranceStart = 0;
    this.requestRender();
  }

  attachInteraction() {
    const canvas = this.canvas;
    canvas.addEventListener('mousedown', (ev) => {
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      const wp = this.camera.toWorld(ev.clientX, ev.clientY, w, h);
      this.dragCandidate = hitTestNode(this.sim.nodes, wp.x, wp.y);
      this.downScreen = { x: ev.clientX, y: ev.clientY };
      this.dragging = false;
      this.panning = false;
      if (!this.dragCandidate) {
        this.panStartScreen = { x: ev.clientX, y: ev.clientY };
        this.panStartCam = { x: this.camera.x, y: this.camera.y };
      }
    });
    canvas.addEventListener('mousemove', (ev) => {
      // Unconditional: with a stopped loop, hover state can change on any
      // move, and detecting "did it actually change" costs more than a
      // spare frame request does.
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      this.mouse.x = ev.clientX; this.mouse.y = ev.clientY;
      const wp = this.camera.toWorld(ev.clientX, ev.clientY, w, h);
      if (this.dragCandidate) {
        if (!this.dragging) {
          const dx = ev.clientX - this.downScreen.x, dy = ev.clientY - this.downScreen.y;
          if (Math.hypot(dx, dy) > 4) {
            this.dragging = true;
            this.dragNode = this.dragCandidate;
            // Mirror the held node onto the simulation: the rest predicate
            // reads it, and the tow pass pulls its direct neighbours toward
            // it - captured here, emptied on release, never pinned.
            this.sim.dragNode = this.dragNode;
            this.sim.towed = (this.sim.adj.get(this.dragNode.id) || []).map(r => r.other);
            this.dragNode.fx = this.dragNode.x; this.dragNode.fy = this.dragNode.y;
            this.sim.alphaTarget = 0.35;
            if (this.sim.alpha < this.sim.alphaTarget) this.sim.alpha = this.sim.alphaTarget;
          }
        }
        if (this.dragging && this.dragNode) { this.dragNode.fx = wp.x; this.dragNode.fy = wp.y; }
      } else if (this.panStartScreen) {
        // Background drag-to-pan - 1:1 with the cursor, no inertia, sharing
        // the same camera.x/y the wheel-zoom reads/writes so the two compose.
        const dx = ev.clientX - this.panStartScreen.x, dy = ev.clientY - this.panStartScreen.y;
        if (!this.panning && Math.hypot(dx, dy) > 3) {
          this.panning = true;
          canvas.style.cursor = 'grabbing';
        }
        if (this.panning) {
          this.camera.x = this.panStartCam.x - dx / this.camera.scale;
          this.camera.y = this.panStartCam.y - dy / this.camera.scale;
        }
      } else {
        // Hover stays quiet while nodes are still flying - the gate lifts
        // once motion calms into the final drift (see the tick loop's
        // HOVER_CALM_MS latch), and Replay re-arms it.
        this.hoverNode = this.calm ? hitTestNode(this.sim.nodes, wp.x, wp.y) : null;
        canvas.style.cursor = this.hoverNode ? 'pointer' : 'default';
      }
    });
    const release = () => {
      this.requestRender();
      if (this.dragging && this.dragNode) {
        // Pin exactly where dropped - no fx/fy clear, no spring home, and no
        // repositioning of anything else. The field recovers IN PLACE: a
        // full reheat (alpha 1 draining to 0) plus the simulation's brief
        // eased-damping window relaxes the disturbed pocket with real
        // physics. Nodes already in equilibrium have ~zero net force, so
        // raising alpha moves nothing that wasn't actually disturbed.
        this.sim.dragNode = null;
        this.sim.towed = [];
        this.sim.alpha = 1;
        this.sim.alphaTarget = 0;
        this.sim.recoverT0 = performance.now();
      } else if (this.panning) {
        // pan release - camera state just stays where it is, nothing to undo
      } else if (this.dragCandidate) {
        const hit = this.dragCandidate;
        this.selectedNode = (hit === this.selectedNode) ? null : hit;
        // A canvas click is a jump to somewhere new, not a step along a path,
        // so it starts the card's back-trail over rather than extending it.
        this.trail = [];
        if (this.selectedNode) this.fillPanel(this.selectedNode);
        this.setPanelVisible(!!this.selectedNode);
      } else if (this.panel && this.panStartScreen) {
        // a real empty-space click (never moved past the pan threshold) = deselect
        this.selectedNode = null;
        this.setPanelVisible(false);
      }
      this.dragCandidate = null; this.dragging = false; this.dragNode = null;
      this.panStartScreen = null; this.panStartCam = null;
      if (this.panning) { this.panning = false; canvas.style.cursor = 'default'; }
    };
    // Listen on window, not just canvas: a pan or drag that ends with the
    // cursor released outside the canvas must still clear cleanly.
    window.addEventListener('mouseup', release);
    canvas.addEventListener('mouseleave', () => { this.requestRender(); this.mouse.x = -9999; this.mouse.y = -9999; this.hoverNode = null; });
    canvas.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      this.requestRender();
      const w = window.innerWidth, h = window.innerHeight;
      // Proportional zoom: scale follows actual scroll distance, so trackpad
      // streams accumulate gently. deltaMode 1 = line-scroll mice; ctrlKey = pinch.
      const px = ev.deltaY * (ev.deltaMode === 1 ? 50 : 1);
      const factor = Math.pow(2, -px * (ev.ctrlKey ? 0.02 : 0.002));
      this.camera.zoomAt(ev.clientX, ev.clientY, w, h, factor);
    }, { passive: false });
  }

  draw() {
    const ctx = this.ctx, sim = this.sim, w = window.innerWidth, h = window.innerHeight;
    ctx.drawImage(this.bg, 0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2); ctx.scale(this.camera.scale, this.camera.scale); ctx.translate(-this.camera.x, -this.camera.y);

    // The bloom pans and zooms locked to the galaxy it belongs to: the bake
    // canvas and the fitted world plate are the same w x h rectangle, so one
    // drawImage inside the camera transform is the whole registration.
    if (this.heatCanvas) {
      let heatMul = 1;
      if (this.heatFadeStart) heatMul = clamp((performance.now() - this.heatFadeStart) / HEAT_FADE_MS, 0, 1);
      if (heatMul < 1) ctx.globalAlpha = heatMul;
      ctx.drawImage(this.heatCanvas, 0, 0, w, h);
      if (heatMul < 1) ctx.globalAlpha = 1;
    }

    const active = this.selectedNode || this.hoverNode;
    const connectedIds = active ? new Set(sim.adj.get(active.id).map(e => e.other.id)) : null;

    // Label candidates are gathered here (screen position projected under
    // the world transform) but drawn in a separate screen-space pass below,
    // so label text stays a constant size at every zoom level.
    const labelCandidates = [];
    for (const n of sim.nodes) {
      const alwaysOn = n === active || n === this.dragNode || n.degree >= window.LT.degreeAlwaysOn;
      let alpha = 1;
      if (!alwaysOn) {
        const t = (n.hw - MIN_R) / (MAX_R - MIN_R);
        const threshold = lerp(window.LT.dustZoom, window.LT.hubZoom, t);
        alpha = clamp((this.camera.scale - (threshold - window.LT.ramp)) / window.LT.ramp, 0, 1);
        if (alpha <= 0.01) continue; // not a candidate at all this frame
      }
      const sx = (n.x - this.camera.x) * this.camera.scale + w / 2;
      const sy = (n.y - this.camera.y) * this.camera.scale + h / 2;
      if (sx < -80 || sx > w + 80 || sy < -60 || sy > h + 60) continue; // off-screen
      labelCandidates.push({ n, alwaysOn, alpha, sx, sy });
    }
    // Always-on first, then most prominent (bigger radius) first.
    labelCandidates.sort((a, b) => (b.alwaysOn - a.alwaysOn) || (b.n.hw - a.n.hw));

    // The resting mesh is one quiet batched stroke - the coloured regions
    // and their heat carry the composition now, so the hairlines only need
    // to whisper the connective tissue. The selected/hover branches survive
    // for the reading panel's connected-highlight affordance.
    if (active) {
      for (const e of sim.edges) {
        const isConn = e.source.id === active.id || e.target.id === active.id;
        ctx.beginPath(); ctx.moveTo(e.source.x, e.source.y); ctx.lineTo(e.target.x, e.target.y);
        ctx.strokeStyle = isConn ? 'rgba(220,225,235,0.6)' : 'rgba(190,195,205,0.04)';
        ctx.lineWidth = isConn ? 1.6 : 1;
        ctx.stroke();
      }
    } else {
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(180,190,210,0.085)';
      ctx.beginPath();
      for (const e of sim.edges) {
        ctx.moveTo(e.source.x, e.source.y); ctx.lineTo(e.target.x, e.target.y);
      }
      ctx.stroke();
    }

    // No per-node glow anywhere: the region heat IS the luminosity, and the
    // absence on individual dots is the design. Completed records of the
    // most numerous type swap to the dim sprite and step back to 0.8 alpha -
    // finished work as quiet grey texture, living work carrying the colour.
    for (const n of sim.nodes) {
      const dim = active && n !== active && !(connectedIds && connectedIds.has(n.id)) ? 0.3 : 1;
      const cooled = n.type === 'story' && (n.status === 'complete' || n.status === 'shipped');
      const sprite = cooled ? this.spriteFor('story_dim', n.bucket) : this.spriteFor(n.type, n.bucket);
      ctx.globalAlpha = (cooled ? 0.8 : 1) * dim;
      const d2 = n.hw * 2;
      ctx.drawImage(sprite, n.x - n.hw, n.y - n.hh, d2, d2);
      ctx.globalAlpha = 1;
    }
    ctx.restore(); // back to screen space - DPR-scaled, no camera transform

    // Leader pass: each card draws ONE dotted, gently-curved 1px reach in
    // its evidence hue, riding a 3px dark casing - the label-halo idiom -
    // ending in a filled arrowhead at the first node contact along the ray,
    // standoff included, so no leader ever crosses a dot. Geometry re-derives
    // from live projected positions (throttled), and the whole pass shares
    // the reading panel's suppression seam. Evidence that stopped resolving
    // simply draws nothing: the card stays, the pointer goes quiet.
    if (this.cardsShown && this.cardMeta.length && cardsViewportOk() &&
        this.cardsEl && !this.cardsEl.classList.contains('suppressed')) {
      const leaderAlpha = clamp((performance.now() - this.cardsShownAt - LEADER_FADE_DELAY_MS) / LEADER_FADE_MS, 0, 1);
      // The leader fade schedules its own frames until complete - internal
      // animation, not input.
      if (leaderAlpha < 1) this.requestFrame();
      if (leaderAlpha > 0) {
        const nowMs = performance.now();
        const atRest = this.sim.isAtRest();
        const camSig = this.camera.x + '|' + this.camera.y + '|' + this.camera.scale;
        const stale = camSig !== this._leaderCamSig || !atRest || !this._leaderRestMarched;
        if (stale && (!this._leaderMarchAt || nowMs - this._leaderMarchAt >= LEADER_REMARCH_MS || (atRest && !this._leaderRestMarched))) {
          this.deriveLeaders(w, h);
          this._leaderMarchAt = nowMs;
          this._leaderCamSig = camSig;
          this._leaderRestMarched = atRest;
        }
        ctx.save();
        ctx.globalAlpha = leaderAlpha;
        const CASING = 'rgba(8,9,12,0.65)';
        for (const meta of this.cardMeta) {
          const L = meta.leader;
          if (!L) continue;
          ctx.setLineDash([1, 6]);
          ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(L.x1, L.y1); ctx.quadraticCurveTo(L.cx, L.cy, L.tx, L.ty);
          ctx.lineWidth = 3; ctx.strokeStyle = CASING; ctx.stroke();
          ctx.beginPath(); ctx.moveTo(L.x1, L.y1); ctx.quadraticCurveTo(L.cx, L.cy, L.tx, L.ty);
          ctx.lineWidth = 1; ctx.strokeStyle = L.hue; ctx.stroke();
          ctx.setLineDash([]);
          ctx.beginPath(); ctx.moveTo(L.tx, L.ty); ctx.lineTo(L.a1x, L.a1y); ctx.lineTo(L.a2x, L.a2y);
          ctx.closePath(); ctx.fillStyle = L.hue; ctx.fill();
        }
        ctx.restore();
      }
    }

    // Screen-space label pass - constant 11px size at every zoom. Suppression
    // uses each candidate's real measured text bounds against an AABB of
    // already-placed higher-priority labels, not a fixed grid.
    ctx.font = '11px system-ui, -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const placed = [];
    for (const cand of labelCandidates) {
      const n = cand.n;
      let tw = this._labelWidthCache.get(n.id);
      if (tw == null) { tw = ctx.measureText(n.short).width; this._labelWidthCache.set(n.id, tw); }
      const labelY = cand.sy + n.hw * this.camera.scale + 13;
      const halfW = tw / 2 + 3, halfH = 8;
      const rect = { x1: cand.sx - halfW, y1: labelY - halfH, x2: cand.sx + halfW, y2: labelY + halfH };
      let overlaps = false;
      for (const p of placed) {
        if (rect.x1 < p.x2 && rect.x2 > p.x1 && rect.y1 < p.y2 && rect.y2 > p.y1) { overlaps = true; break; }
      }
      if (overlaps && !cand.alwaysOn) continue; // always-on always draws; others yield to a higher-priority neighbor
      placed.push(rect);

      const dim = active && n !== active && !(connectedIds && connectedIds.has(n.id)) ? 0.3 : 1;
      const isActive = n === active;
      ctx.font = (isActive ? '600 ' : '400 ') + '11px system-ui, -apple-system, sans-serif';
      const labelAlpha = cand.alpha * dim;
      const col = isActive ? 'rgba(255,255,255,1)' : `rgba(222,226,232,${0.78 * labelAlpha})`;
      drawLabelHalo(ctx, n.short, cand.sx, labelY, col);
    }
  }

  requestRender() {
    this.lastInputAt = performance.now();
    this.interactionActive = true;
    if (!this.rafId) this.rafId = requestAnimationFrame(this.tick);
  }

  // Pure frame scheduling for the page's OWN animations (heat fade, leader
  // fade, card reveal). Unlike requestRender it does not stamp the input
  // timer, so an internal ease can never masquerade as user activity and
  // extend the calm window - the loop parks the moment the animation truly
  // finishes.
  requestFrame() {
    if (!this.rafId) this.rafId = requestAnimationFrame(this.tick);
  }

  tick(now) {
    this.rafId = null;
    if (!this.entranceStart) this.entranceStart = now;
    // The simulation reads the same anchor for its launch-pop window - the
    // swirl IS the entrance, there is no global fade softening it.
    if (!this.sim.entranceT0) this.sim.entranceT0 = now;
    if (!this.lastT) this.lastT = now;
    const dt = Math.min((now - this.lastT) / 1000, 0.05);
    this.lastT = now;
    this.simT += dt;
    this.sim.step(dt, now);
    this.draw(now);
    this.frameCount++;

    if (this.interactionActive && !this.dragging && !this.panning && (now - this.lastInputAt) > CALM_MS) {
      this.interactionActive = false;
    }
    // True stillness also waits for the heat fade - a loop parked mid-fade
    // would snap the bloom to full alpha on the frame that stopped it.
    const heatFading = !!this.heatFadeStart && (now - this.heatFadeStart) < HEAT_FADE_MS;
    const still = !this.sim.isAtRest() || this.dragging || this.panning || this.interactionActive || heatFading;
    /* Guarded reschedule only: draw() may already have booked the next frame
       (heat fade, leader fade). A bare requestAnimationFrame here would
       stack a second loop on top of that one - and the population doubles
       every frame both fire, collapsing the page to a crawl. */
    if (still && !this.rafId) this.rafId = requestAnimationFrame(this.tick);
    // The hover gate lifts here, on the load clock rather than the sim's
    // energy: once the entrance's violent fling window has passed, pointing
    // at nodes feels natural again. Latched - later re-heats (a drag warms
    // the sim back up) never re-close it; only Replay does.
    if ((now - this.entranceStart) > HOVER_CALM_MS) this.calm = true;
    // The insight reveal races the physics against a hard ceiling: true
    // rest, or CARD_REVEAL_MS from the first painted frame, whichever
    // arrives first - so a fast settle brings the layer in early and a
    // long-held drag can never push it out indefinitely. It runs after the
    // frame's scheduling decision so its requestFrame never races the
    // still-guarded reschedule above.
    if (!this.cardsShown && (this.sim.isAtRest() || (now - this.entranceStart) > CARD_REVEAL_MS)) this.revealCards();
    // The bloom bakes on its own early beat, or at first true rest -
    // whichever arrives first; armHeat guards the fade clock so it never
    // double-fires. Both sit after the scheduling decision for the same
    // reason the reveal does: their requestFrame must never race the
    // still-guarded reschedule above.
    if (!this.heatFadeStart && (now - this.entranceStart) > EARLY_HEAT_MS) this.armHeat(now);
    if (!this.settledOnce && this.sim.isAtRest()) { this.settledOnce = true; this.armHeat(now); }
  }
}

window.GraphInstance = new GraphView(document.getElementById('canvas'), document.getElementById('panel'));

document.getElementById('replay-btn').addEventListener('click', () => {
  window.GraphInstance.replay();
});
document.getElementById('refresh-btn').addEventListener('click', () => {
  location.reload();
});
window.addEventListener('resize', () => {
  window.GraphInstance.resize();
});

const noticeMessage = computeNotice(window.CRAFT_BUILD, GRAPH);
if (noticeMessage) {
  const noticeEl = document.querySelector('#controls .notice');
  noticeEl.textContent = noticeMessage;
  noticeEl.classList.add('visible');
}
</script>
</body>
</html>
